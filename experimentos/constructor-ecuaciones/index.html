<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🧩 Constructor de ecuaciones - MI WEB</title><link rel="stylesheet" href="../../assets/simple-game.css"></head><body><div class="barra"><a class="volver" id="volver" href="../../index.html">← Volver</a><div class="espacio"></div><div class="menu-idioma"><button class="boton-idioma" id="botonIdioma">🇪🇸 ES ▾</button><div class="idiomas" id="menuIdiomas"><button data-lang="es">🇪🇸 Español</button><button data-lang="en">🇬🇧 English</button><button data-lang="hy">🇦🇲 Հայերեն</button></div></div><button id="botonTema">☀️ Claro</button></div><main class="contenedor"><h1 id="titulo">🧩 Constructor de ecuaciones</h1><p class="descripcion" id="descripcion">Construye una ecuación del tipo ax + b = c y mira cómo se resuelve paso a paso.</p><section class="panel"><div class="fila"><div class="campo"><label for="a">a</label><input id="a" type="number" value="2"></div><div class="campo"><label for="b">b</label><input id="b" type="number" value="3"></div><div class="campo"><label for="c">c</label><input id="c" type="number" value="11"></div><button class="accion" id="construir">🧩 Construir</button></div><div class="ecuacion" id="ecuacion">2x + 3 = 11</div><div class="pasos" id="pasos"></div><p class="nota" id="nota">Puedes usar números negativos y decimales. El valor de a no puede ser 0.</p></section></main><script src="../../assets/common.js"></script><script src="app.js"></script></body></html>
