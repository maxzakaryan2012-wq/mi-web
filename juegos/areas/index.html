<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculador de áreas - MI WEB</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#111;color:white;transition:.3s}.barra{height:70px;background:#181818;display:flex;align-items:center;padding:0 25px;gap:15px;border-bottom:1px solid #333}
.volver{color:white;text-decoration:none;font-size:18px;font-weight:bold}.volver:hover{opacity:.7}.espacio{flex:1}.menu-idioma{position:relative}.boton-idioma,#botonTema{background:#252525;color:white;border:1px solid #444;border-radius:8px;padding:10px 14px;cursor:pointer;font-size:14px}
.boton-idioma:hover,#botonTema:hover{background:#333}.idiomas{display:none;position:absolute;right:0;top:45px;background:#202020;border:1px solid #444;border-radius:8px;overflow:hidden;min-width:150px;z-index:100}.idiomas button{width:100%;border:0;background:transparent;color:white;padding:12px;text-align:left;cursor:pointer}.idiomas button:hover{background:#333}
.contenedor{max-width:850px;margin:auto;padding:50px 20px;text-align:center}h1{font-size:38px;margin:0 0 10px}#descripcion{color:#bbb;font-size:17px;margin-bottom:30px;line-height:1.5}
.panel{background:#1d1d1d;border:1px solid #333;border-radius:18px;padding:24px;margin-top:20px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;text-align:left}.campo-completo{grid-column:1/-1}label{display:block;margin:0 0 7px;font-weight:bold}
select,input{width:100%;padding:14px;font-size:16px;border-radius:10px;border:1px solid #555;background:#202020;color:white;outline:none}select:focus,input:focus{border-color:#888}
#campos{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.formula-previa{margin:18px 0 0;padding:14px;border:1px dashed #555;border-radius:12px;font-size:21px;font-weight:bold;text-align:center}
#botonCalcular{display:block;width:100%;margin:20px 0 0;padding:13px 25px;font-size:17px;border:0;border-radius:10px;cursor:pointer;background:white;color:#111;font-weight:bold}#botonCalcular:disabled{opacity:.5;cursor:wait}
#estado{min-height:26px;color:#aaa;font-size:14px}.resultado{font-size:42px;font-weight:bold;margin:8px 0}.formula{font-size:22px;margin:0 0 12px}.pasos{white-space:pre-line;line-height:1.7;text-align:left;max-width:600px;margin:15px auto 0}
.nota{color:#aaa;font-size:14px;line-height:1.5;margin-top:20px}.descarga{display:inline-block;margin-top:25px;color:#bbb}.descarga:hover{color:white}.oculto{display:none}
body.claro{background:#f4f4f4;color:#111}body.claro .barra{background:white;border-bottom-color:#ddd}body.claro .volver{color:#111}body.claro .boton-idioma,body.claro #botonTema{background:#f1f1f1;color:#111;border-color:#ccc}body.claro .idiomas{background:white;border-color:#ccc}body.claro .idiomas button{color:#111}body.claro .idiomas button:hover{background:#eee}
body.claro #descripcion,body.claro #estado,body.claro .nota,body.claro .descarga{color:#555}body.claro .panel{background:white;border-color:#ddd}body.claro select,body.claro input{background:white;color:#111;border-color:#bbb}body.claro .formula-previa{border-color:#bbb}
@media(max-width:650px){.grid,#campos{grid-template-columns:1fr}.campo-completo{grid-column:auto}.barra{padding:0 12px}.contenedor{padding:35px 15px}h1{font-size:31px}.resultado{font-size:34px}}
</style>
</head>
<body>
<div class="barra"><a href="../../index.html" class="volver" id="volver">← Volver</a><div class="espacio"></div>
<div class="menu-idioma"><button class="boton-idioma" id="botonIdioma">🇪🇸 ES ▾</button><div class="idiomas" id="menuIdiomas"><button data-lang="es">🇪🇸 Español</button><button data-lang="en">🇬🇧 English</button><button data-lang="hy">🇦🇲 Հայերեն</button></div></div>
<button id="botonTema">☀️ Claro</button></div>
<main class="contenedor">
<h1 id="titulo">📐 Calculador de áreas</h1>
<p id="descripcion">Elige una figura, introduce sus medidas y calcula el área paso a paso.</p>
<section class="panel">
<form id="formulario">
<div class="grid"><div class="campo-completo"><label for="figura" id="labelFigura">Figura</label>
<select id="figura">
<option value="triangulo">Triángulo</option><option value="rectangulo">Rectángulo</option><option value="cuadrado">Cuadrado</option><option value="circulo">Círculo</option><option value="trapecio">Trapecio</option><option value="paralelogramo">Paralelogramo</option><option value="rombo">Rombo</option>
</select></div></div>
<div id="campos"></div>
<div class="formula-previa" id="formulaPrevia">A = (b × h) / 2</div>
<button id="botonCalcular" type="submit" disabled>📐 Calcular área</button>
<p id="estado" role="status" aria-live="polite"></p>
</form>
</section>
<section class="panel oculto" id="resultados">
<div id="textoArea">Área</div><div class="resultado" id="resultadoArea">—</div><div class="formula" id="formulaResultado"></div><div class="pasos" id="pasos"></div>
</section>
<p class="nota" id="nota">Las medidas deben usar la misma unidad. El resultado se expresa en unidades cuadradas.</p>
<a class="descarga" id="descarga" href="calculadora.py" download>Descargar código Python</a>
</main>
<script src="../../assets/common.js?v=xp-20261006-8"></script><script src="app.js"></script>
</body></html>
