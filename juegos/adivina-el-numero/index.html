<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Adivina el número - MI WEBSITE</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            transition: 0.3s;
        }

        /* BARRA SUPERIOR */

        .barra {
            height: 70px;
            background: #181818;
            display: flex;
            align-items: center;
            padding: 0 25px;
            gap: 15px;
            border-bottom: 1px solid #333;
        }

        .volver {
            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
        }

        .volver:hover {
            opacity: 0.7;
        }

        .espacio {
            flex: 1;
        }

        .menu-idioma {
            position: relative;
        }

        .boton-idioma,
        #botonTema {
            background: #252525;
            color: white;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 10px 14px;
            cursor: pointer;
            font-size: 14px;
        }

        .boton-idioma:hover,
        #botonTema:hover {
            background: #333;
        }

        .idiomas {
            display: none;
            position: absolute;
            right: 0;
            top: 45px;
            background: #202020;
            border: 1px solid #444;
            border-radius: 8px;
            overflow: hidden;
            min-width: 150px;
            z-index: 100;
        }

        .idiomas button {
            width: 100%;
            border: none;
            background: transparent;
            color: white;
            padding: 12px;
            text-align: left;
            cursor: pointer;
            font-size: 14px;
        }

        .idiomas button:hover {
            background: #333;
        }

        /* JUEGO */

        .contenedor {
            max-width: 700px;
            margin: 0 auto;
            padding: 50px 20px;
            text-align: center;
        }

        h1 {
            font-size: 38px;
            margin-bottom: 10px;
        }

        #descripcion {
            color: #bbb;
            font-size: 17px;
            margin-bottom: 30px;
        }

        #numero {
            width: 220px;
            padding: 14px;
            font-size: 18px;
            border-radius: 10px;
            border: 1px solid #555;
            background: #202020;
            color: white;
            outline: none;
            text-align: center;
        }

        #numero:focus {
            border-color: #777;
        }

        #botonAdivinar,
        #reiniciar {
            display: block;
            margin: 15px auto;
            padding: 13px 25px;
            font-size: 17px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: #fff;
            color: #111;
            font-weight: bold;
        }

        #botonAdivinar:hover,
        #reiniciar:hover {
            transform: scale(1.03);
        }

        #mensaje {
            min-height: 30px;
            font-size: 20px;
            margin-top: 20px;
            font-weight: bold;
        }

        #intentos {
            color: #aaa;
            margin-top: 10px;
        }

        #reiniciar {
            display: none;
        }

        /* ESTADÍSTICAS */

        .estadisticas {
            margin-top: 60px;
            text-align: left;
        }

        .estadisticas h2 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 20px;
        }

        .tabla-contenedor {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid #333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #181818;
        }

        th,
        td {
            padding: 14px 10px;
            text-align: center;
            border-bottom: 1px solid #333;
        }

        th {
            background: #222;
            font-size: 14px;
        }

        td {
            font-size: 15px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .tu-fila {
            background: #292929;
            font-weight: bold;
        }

        .posicion-usuario {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            background: #181818;
            border: 1px solid #333;
            text-align: center;
            display: none;
        }

        /* TEMA CLARO */

        body.claro {
            background: #f4f4f4;
            color: #111;
        }

        body.claro .barra {
            background: white;
            border-bottom: 1px solid #ddd;
        }

        body.claro .volver {
            color: #111;
        }

        body.claro .boton-idioma,
        body.claro #botonTema {
            background: #f1f1f1;
            color: #111;
            border-color: #ccc;
        }

        body.claro .boton-idioma:hover,
        body.claro #botonTema:hover {
            background: #e5e5e5;
        }

        body.claro .idiomas {
            background: white;
            border-color: #ccc;
        }

        body.claro .idiomas button {
            color: #111;
        }

        body.claro .idiomas button:hover {
            background: #eee;
        }

        body.claro #descripcion {
            color: #555;
        }

        body.claro #numero {
            background: white;
            color: #111;
            border-color: #bbb;
        }

        body.claro #intentos {
            color: #666;
        }

        body.claro table {
            background: white;
        }

        body.claro th {
            background: #eee;
        }

        body.claro th,
        body.claro td {
            border-bottom-color: #ddd;
        }

        body.claro .tu-fila {
            background: #e8e8e8;
        }

        body.claro .posicion-usuario {
            background: white;
            border-color: #ddd;
        }
    </style>
</head>

<body>

    <!-- BARRA SUPERIOR -->

    <div class="barra">

        <a href="../../index.html" class="volver" id="volver">
            ← Volver
        </a>

        <div class="espacio"></div>

        <div class="menu-idioma">

            <button
                class="boton-idioma"
                id="botonIdioma"
                onclick="abrirIdioma()"
            >
                🇪🇸 ES ▾
            </button>

            <div
                class="idiomas"
                id="menuIdiomas"
            >
                <button onclick="cambiarIdioma('es')">
                    🇪🇸 Español
                </button>

                <button onclick="cambiarIdioma('en')">
                    🇬🇧 English
                </button>

                <button onclick="cambiarIdioma('hy')">
                    🇦🇲 Հայերեն
                </button>
            </div>

        </div>

        <button
            id="botonTema"
            onclick="cambiarTema()"
        >
            ☀️ Claro
        </button>

    </div>


    <!-- JUEGO -->

    <main class="contenedor">

        <h1 id="titulo">
            🔢 Adivina el número
        </h1>

        <p id="descripcion">
            Estoy pensando en un número entre 1 y 100.
        </p>

        <input
            type="number"
            id="numero"
            min="1"
            max="100"
            placeholder="1 - 100"
        >

        <button
            id="botonAdivinar"
            onclick="comprobarNumero()"
        >
            🎯 Adivinar
        </button>

        <p id="mensaje"></p>

        <p id="intentos">
            Intentos: 0
        </p>

        <button
            id="reiniciar"
            onclick="reiniciarJuego()"
        >
            🔄 Jugar otra vez
        </button>


        <!-- ESTADÍSTICAS -->

        <section class="estadisticas">

            <h2 id="tituloEstadisticas">
                🏆 Estadísticas
            </h2>

            <div class="tabla-contenedor">

                <table>

                    <thead>
                        <tr>
                            <th id="thPuesto">
                                Puesto
                            </th>

                            <th id="thNombre">
                                Nombre
                            </th>

                            <th id="thIntentos">
                                Menos intentos
                            </th>

                            <th id="thAciertos">
                                Números acertados
                            </th>
                        </tr>
                    </thead>

                    <tbody id="tablaRanking">
                    </tbody>

                </table>

            </div>

            <div
                class="posicion-usuario"
                id="posicionUsuario"
            >
            </div>

        </section>

    </main>


    <script>

        /* =========================
           JUEGO
        ========================= */

        let numeroSecreto =
            Math.floor(Math.random() * 100) + 1;

        let numeroIntentos = 0;

        let juegoTerminado = false;


        function comprobarNumero() {

            if (juegoTerminado) {
                return;
            }

            const input =
                document.getElementById("numero");

            const numero =
                Number(input.value);

            const idioma =
                localStorage.getItem("idioma") || "es";


            if (input.value === "") {

                if (idioma === "en") {
                    mostrarMensaje(
                        "⚠️ Enter a number."
                    );
                } else if (idioma === "hy") {
                    mostrarMensaje(
                        "⚠️ Գրիր թիվ։"
                    );
                } else {
                    mostrarMensaje(
                        "⚠️ Escribe un número."
                    );
                }

                return;
            }


            if (
                numero < 1 ||
                numero > 100
            ) {

                if (idioma === "en") {
                    mostrarMensaje(
                        "⚠️ The number must be between 1 and 100."
                    );
                } else if (idioma === "hy") {
                    mostrarMensaje(
                        "⚠️ Թիվը պետք է լինի 1-ից 100-ի միջև։"
                    );
                } else {
                    mostrarMensaje(
                        "⚠️ El número debe estar entre 1 y 100."
                    );
                }

                return;
            }


            numeroIntentos++;

            actualizarIntentos();


            if (numero < numeroSecreto) {

                if (idioma === "en") {
                    mostrarMensaje(
                        "🔼 It's higher."
                    );
                } else if (idioma === "hy") {
                    mostrarMensaje(
                        "🔼 Ավելի բարձր է։"
                    );
                } else {
                    mostrarMensaje(
                        "🔼 Es más alto."
                    );
                }

            } else if (numero > numeroSecreto) {

                if (idioma === "en") {
                    mostrarMensaje(
                        "🔽 It's lower."
                    );
                } else if (idioma === "hy") {
                    mostrarMensaje(
                        "🔽 Ավելի ցածր է։"
                    );
                } else {
                    mostrarMensaje(
                        "🔽 Es más bajo."
                    );
                }

            } else {

                juegoTerminado = true;

                const intentosFinales =
                    numeroIntentos;


                if (idioma === "en") {

                    mostrarMensaje(
                        "🎉 You got it! It was " +
                        numeroSecreto +
                        "."
                    );

                } else if (idioma === "hy") {

                    mostrarMensaje(
                        "🎉 Ճիշտ է։ Թիվը " +
                        numeroSecreto +
                        " էր։"
                    );

                } else {

                    mostrarMensaje(
                        "🎉 ¡Acertaste! Era el " +
                        numeroSecreto +
                        "."
                    );
                }


                input.disabled = true;

                document.getElementById(
                    "botonAdivinar"
                ).style.display = "none";

                document.getElementById(
                    "reiniciar"
                ).style.display = "block";


                guardarEstadistica(
                    intentosFinales
                );
            }
        }


        function mostrarMensaje(texto) {

            document.getElementById(
                "mensaje"
            ).textContent = texto;
        }


        function actualizarIntentos() {

            const idioma =
                localStorage.getItem("idioma") || "es";

            const elemento =
                document.getElementById("intentos");


            if (idioma === "en") {

                elemento.textContent =
                    "Attempts: " +
                    numeroIntentos;

            } else if (idioma === "hy") {

                elemento.textContent =
                    "Փորձեր՝ " +
                    numeroIntentos;

            } else {

                elemento.textContent =
                    "Intentos: " +
                    numeroIntentos;
            }
        }


        function reiniciarJuego() {

            numeroSecreto =
                Math.floor(Math.random() * 100) + 1;

            numeroIntentos = 0;

            juegoTerminado = false;


            const input =
                document.getElementById("numero");

            input.value = "";

            input.disabled = false;

            document.getElementById(
                "botonAdivinar"
            ).style.display = "block";

            document.getElementById(
                "reiniciar"
            ).style.display = "none";

            document.getElementById(
                "mensaje"
            ).textContent = "";

            actualizarIntentos();

            input.focus();
        }


        document.getElementById(
            "numero"
        ).addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {
                    comprobarNumero();
                }

            }
        );


        /* =========================
           ESTADÍSTICAS
        ========================= */

        function obtenerNombreUsuario() {

            let nombre =
                localStorage.getItem(
                    "nombreUsuario"
                );

            if (!nombre) {

                let numero =
                    localStorage.getItem(
                        "numeroUsuario"
                    );

                if (!numero) {

                    numero =
                        Math.floor(
                            Math.random() * 10000
                        );

                    numero =
                        String(numero)
                            .padStart(4, "0");

                    localStorage.setItem(
                        "numeroUsuario",
                        numero
                    );
                }

                nombre =
                    "user_" + numero;

                localStorage.setItem(
                    "nombreUsuario",
                    nombre
                );
            }

            return nombre;
        }


        function obtenerEstadisticas() {

            const datos =
                localStorage.getItem(
                    "estadisticasAdivinaNumero"
                );

            if (!datos) {
                return {};
            }

            try {

                return JSON.parse(datos);

            } catch {

                return {};
            }
        }


        function guardarEstadistica(
            intentos
        ) {

            const nombre =
                obtenerNombreUsuario();

            const estadisticas =
                obtenerEstadisticas();


            if (!estadisticas[nombre]) {

                estadisticas[nombre] = {

                    mejorIntentos:
                        intentos,

                    aciertos:
                        1
                };

            } else {

                if (
                    intentos <
                    estadisticas[nombre]
                        .mejorIntentos
                ) {

                    estadisticas[nombre]
                        .mejorIntentos =
                        intentos;
                }

                estadisticas[nombre]
                    .aciertos++;
            }


            localStorage.setItem(
                "estadisticasAdivinaNumero",
                JSON.stringify(
                    estadisticas
                )
            );


            mostrarRanking();
        }


        function ordenarRanking(
            estadisticas
        ) {

            const jugadores =
                Object.keys(
                    estadisticas
                ).map(
                    function(nombre) {

                        return {

                            nombre: nombre,

                            mejorIntentos:
                                estadisticas[
                                    nombre
                                ].mejorIntentos,

                            aciertos:
                                estadisticas[
                                    nombre
                                ].aciertos
                        };

                    }
                );


            jugadores.sort(
                function(a, b) {

                    if (
                        a.mejorIntentos !==
                        b.mejorIntentos
                    ) {

                        return (
                            a.mejorIntentos -
                            b.mejorIntentos
                        );
                    }


                    if (
                        a.aciertos !==
                        b.aciertos
                    ) {

                        return (
                            b.aciertos -
                            a.aciertos
                        );
                    }


                    return a.nombre.localeCompare(
                        b.nombre
                    );
                }
            );


            return jugadores;
        }


        function mostrarRanking() {

            const estadisticas =
                obtenerEstadisticas();

            const ranking =
                ordenarRanking(
                    estadisticas
                );

            const tabla =
                document.getElementById(
                    "tablaRanking"
                );

            const nombreUsuario =
                obtenerNombreUsuario();


            tabla.innerHTML = "";


            const top10 =
                ranking.slice(0, 10);


            top10.forEach(
                function(jugador, index) {

                    const fila =
                        document.createElement(
                            "tr"
                        );


                    if (
                        jugador.nombre ===
                        nombreUsuario
                    ) {

                        fila.classList.add(
                            "tu-fila"
                        );
                    }


                    const puesto =
                        document.createElement(
                            "td"
                        );

                    const nombre =
                        document.createElement(
                            "td"
                        );

                    const intentos =
                        document.createElement(
                            "td"
                        );

                    const aciertos =
                        document.createElement(
                            "td"
                        );


                    puesto.textContent =
                        index + 1;

                    nombre.textContent =
                        jugador.nombre;

                    intentos.textContent =
                        jugador.mejorIntentos;

                    aciertos.textContent =
                        jugador.aciertos;


                    fila.appendChild(
                        puesto
                    );

                    fila.appendChild(
                        nombre
                    );

                    fila.appendChild(
                        intentos
                    );

                    fila.appendChild(
                        aciertos
                    );


                    tabla.appendChild(
                        fila
                    );

                }
            );


            mostrarPosicionUsuario(
                ranking,
                nombreUsuario
            );
        }


        function mostrarPosicionUsuario(
            ranking,
            nombreUsuario
        ) {

            const elemento =
                document.getElementById(
                    "posicionUsuario"
                );

            const posicion =
                ranking.findIndex(
                    function(jugador) {

                        return (
                            jugador.nombre ===
                            nombreUsuario
                        );
                    }
                );


            if (posicion === -1) {

                elemento.style.display =
                    "none";

                return;
            }


            if (posicion < 10) {

                elemento.style.display =
                    "none";

                return;
            }


            const jugador =
                ranking[posicion];

            const idioma =
                localStorage.getItem(
                    "idioma"
                ) || "es";


            if (idioma === "en") {

                elemento.textContent =
                    "👤 Your position: " +
                    (posicion + 1) +
                    " — " +
                    nombreUsuario +
                    " — " +
                    jugador.mejorIntentos +
                    " attempts minimum — " +
                    jugador.aciertos +
                    " numbers guessed";

            } else if (idioma === "hy") {

                elemento.textContent =
                    "👤 Քո դիրքը՝ " +
                    (posicion + 1) +
                    " — " +
                    nombreUsuario +
                    " — " +
                    jugador.mejorIntentos +
                    " նվազագույն փորձ — " +
                    jugador.aciertos +
                    " ճիշտ թիվ";

            } else {

                elemento.textContent =
                    "👤 Tu posición: " +
                    (posicion + 1) +
                    " — " +
                    nombreUsuario +
                    " — " +
                    jugador.mejorIntentos +
                    " intentos mínimos — " +
                    jugador.aciertos +
                    " números acertados";
            }


            elemento.style.display =
                "block";
        }


        /* =========================
           IDIOMAS
        ========================= */

        function abrirIdioma() {

            const menu =
                document.getElementById(
                    "menuIdiomas"
                );

            if (
                menu.style.display ===
                "block"
            ) {

                menu.style.display =
                    "none";

            } else {

                menu.style.display =
                    "block";
            }
        }


        function cambiarIdioma(
            idioma
        ) {

            localStorage.setItem(
                "idioma",
                idioma
            );

            aplicarIdioma();

            document.getElementById(
                "menuIdiomas"
            ).style.display = "none";
        }


        function aplicarIdioma() {

            const idioma =
                localStorage.getItem(
                    "idioma"
                ) || "es";


            const titulo =
                document.getElementById(
                    "titulo"
                );

            const descripcion =
                document.getElementById(
                    "descripcion"
                );

            const volver =
                document.getElementById(
                    "volver"
                );

            const botonAdivinar =
                document.getElementById(
                    "botonAdivinar"
                );

            const reiniciar =
                document.getElementById(
                    "reiniciar"
                );

            const botonIdioma =
                document.getElementById(
                    "botonIdioma"
                );


            const tituloEstadisticas =
                document.getElementById(
                    "tituloEstadisticas"
                );

            const thPuesto =
                document.getElementById(
                    "thPuesto"
                );

            const thNombre =
                document.getElementById(
                    "thNombre"
                );

            const thIntentos =
                document.getElementById(
                    "thIntentos"
                );

            const thAciertos =
                document.getElementById(
                    "thAciertos"
                );


            if (idioma === "en") {

                titulo.textContent =
                    "🔢 Guess the number";

                descripcion.textContent =
                    "I'm thinking of a number between 1 and 100.";

                volver.textContent =
                    "← Back";

                botonAdivinar.textContent =
                    "🎯 Guess";

                reiniciar.textContent =
                    "🔄 Play again";

                botonIdioma.textContent =
                    "🇬🇧 EN ▾";

                tituloEstadisticas.textContent =
                    "🏆 Statistics";

                thPuesto.textContent =
                    "Place";

                thNombre.textContent =
                    "Name";

                thIntentos.textContent =
                    "Fewest attempts";

                thAciertos.textContent =
                    "Numbers guessed";

                document.title =
                    "Guess the number - MY WEBSITE";


            } else if (idioma === "hy") {

                titulo.textContent =
                    "🔢 Գուշակիր թիվը";

                descripcion.textContent =
                    "Ես մտածում եմ 1-ից 100-ի միջև գտնվող թվի մասին։";

                volver.textContent =
                    "← Հետ";

                botonAdivinar.textContent =
                    "🎯 Գուշակել";

                reiniciar.textContent =
                    "🔄 Նորից խաղալ";

                botonIdioma.textContent =
                    "🇦🇲 HY ▾";

                tituloEstadisticas.textContent =
                    "🏆 Վիճակագրություն";

                thPuesto.textContent =
                    "Դիրք";

                thNombre.textContent =
                    "Անուն";

                thIntentos.textContent =
                    "Ամենաքիչ փորձեր";

                thAciertos.textContent =
                    "Ճիշտ գուշակումներ";

                document.title =
                    "Գուշակիր թիվը - ԻՄ ԿԱՅՔԸ";


            } else {

                titulo.textContent =
                    "🔢 Adivina el número";

                descripcion.textContent =
                    "Estoy pensando en un número entre 1 y 100.";

                volver.textContent =
                    "← Volver";

                botonAdivinar.textContent =
                    "🎯 Adivinar";

                reiniciar.textContent =
                    "🔄 Jugar otra vez";

                botonIdioma.textContent =
                    "🇪🇸 ES ▾";

                tituloEstadisticas.textContent =
                    "🏆 Estadísticas";

                thPuesto.textContent =
                    "Puesto";

                thNombre.textContent =
                    "Nombre";

                thIntentos.textContent =
                    "Menos intentos";

                thAciertos.textContent =
                    "Números acertados";

                document.title =
                    "Adivina el número - MI WEB";
            }


            actualizarIntentos();

            mostrarRanking();

            actualizarTextoTema();
        }


        document.addEventListener(
            "click",
            function(event) {

                const menu =
                    document.getElementById(
                        "menuIdiomas"
                    );

                const boton =
                    document.getElementById(
                        "botonIdioma"
                    );


                if (
                    !menu.contains(event.target) &&
                    !boton.contains(event.target)
                ) {

                    menu.style.display =
                        "none";
                }

            }
        );


        /* =========================
           TEMA
        ========================= */

        function aplicarTema() {

            const tema =
                localStorage.getItem(
                    "tema"
                ) || "oscuro";


            if (tema === "claro") {

                document.body.classList.add(
                    "claro"
                );

            } else {

                document.body.classList.remove(
                    "claro"
                );
            }


            actualizarTextoTema();
        }


        function cambiarTema() {

            const temaActual =
                localStorage.getItem(
                    "tema"
                ) || "oscuro";


            const nuevoTema =
                temaActual === "oscuro"
                ? "claro"
                : "oscuro";


            localStorage.setItem(
                "tema",
                nuevoTema
            );


            aplicarTema();
        }


        function actualizarTextoTema() {

            const tema =
                localStorage.getItem(
                    "tema"
                ) || "oscuro";

            const idioma =
                localStorage.getItem(
                    "idioma"
                ) || "es";


            const boton =
                document.getElementById(
                    "botonTema"
                );


            if (idioma === "en") {

                boton.textContent =
                    tema === "oscuro"
                    ? "☀️ Light"
                    : "🌙 Dark";

            } else if (idioma === "hy") {

                boton.textContent =
                    tema === "oscuro"
                    ? "☀️ Բաց"
                    : "🌙 Մութ";

            } else {

                boton.textContent =
                    tema === "oscuro"
                    ? "☀️ Claro"
                    : "🌙 Oscuro";
            }
        }


        /* =========================
           INICIO
        ========================= */

        aplicarIdioma();

        aplicarTema();

        mostrarRanking();

    </script>

</body>
</html>
