<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Adivina el número - MI WEB</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
      transition: background 0.3s, color 0.3s;
    }

    body.claro {
      background: #f5f5f5;
      color: #111;
    }

    /* VOLVER */

    .volver {
      position: absolute;
      top: 20px;
      left: 20px;
      padding: 12px 18px;
      border: none;
      border-radius: 12px;
      background: #222;
      color: white;
      font-size: 16px;
      cursor: pointer;
      text-decoration: none;
      transition: 0.2s;
    }

    body.claro .volver {
      background: #ddd;
      color: #111;
    }

    .volver:hover {
      transform: scale(1.05);
    }

    /* IDIOMA */

    .idioma {
      position: absolute;
      top: 20px;
      right: 150px;
    }

    .botonIdioma {
      padding: 12px 14px;
      border: none;
      border-radius: 12px;
      background: #222;
      color: white;
      font-size: 15px;
      cursor: pointer;
      transition: 0.2s;
    }

    body.claro .botonIdioma {
      background: #ddd;
      color: #111;
    }

    .botonIdioma:hover {
      transform: scale(1.05);
    }

    .menuIdioma {
      display: none;
      position: absolute;
      top: 48px;
      right: 0;
      min-width: 170px;
      background: #1d1d1d;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 6px;
      z-index: 1000;
    }

    body.claro .menuIdioma {
      background: white;
      border-color: #ddd;
    }

    .menuIdioma.mostrar {
      display: block;
    }

    .menuIdioma button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: white;
      text-align: left;
      font-size: 15px;
      cursor: pointer;
    }

    body.claro .menuIdioma button {
      color: #111;
    }

    .menuIdioma button:hover {
      background: #2a2a2a;
    }

    body.claro .menuIdioma button:hover {
      background: #eee;
    }

    /* TEMA */

    .tema {
      position: absolute;
      top: 20px;
      right: 20px;
      padding: 12px 18px;
      border: none;
      border-radius: 12px;
      background: #222;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
    }

    body.claro .tema {
      background: #ddd;
      color: #111;
    }

    .tema:hover {
      transform: scale(1.05);
    }

    /* CONTENEDOR */

    .contenedor {
      max-width: 600px;
      margin: 100px auto;
      padding: 30px 20px;
    }

    h1 {
      font-size: 50px;
      margin-bottom: 15px;
    }

    .descripcion {
      font-size: 20px;
      color: #aaa;
    }

    body.claro .descripcion {
      color: #555;
    }

    input {
      width: 180px;
      padding: 15px;
      margin-top: 25px;
      font-size: 22px;
      text-align: center;
      border-radius: 10px;
      border: 2px solid #333;
      background: #222;
      color: white;
      outline: none;
    }

    body.claro input {
      background: white;
      color: #111;
      border-color: #ccc;
    }

    input:focus {
      border-color: #777;
    }

    .adivinar,
    .reiniciar {
      display: block;
      margin: 20px auto 0;
      padding: 15px 30px;
      font-size: 20px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.2s;
    }

    .adivinar:hover,
    .reiniciar:hover {
      transform: scale(1.05);
    }

    .reiniciar {
      display: none;
      margin-top: 15px;
    }

    #mensaje {
      font-size: 28px;
      font-weight: bold;
      margin-top: 35px;
      min-height: 40px;
    }

    #intentos {
      font-size: 18px;
      color: #aaa;
      margin-top: 15px;
    }

    body.claro #intentos {
      color: #555;
    }

    @media (max-width: 600px) {

      h1 {
        font-size: 38px;
      }

      .contenedor {
        margin-top: 90px;
      }

      .volver,
      .tema {
        padding: 10px 13px;
        font-size: 14px;
      }

      .idioma {
        right: 125px;
      }

    }

  </style>

</head>


<body>


  <!-- VOLVER -->

  <a
    class="volver"
    href="../../"
    id="volver"
  >
    ← Volver
  </a>


  <!-- IDIOMA -->

  <div class="idioma">

    <button
      class="botonIdioma"
      id="botonIdioma"
      onclick="abrirIdioma()"
    >
      🇪🇸 ES ▾
    </button>


    <div
      class="menuIdioma"
      id="menuIdioma"
    >

      <button onclick="cambiarIdioma('es')">
        🇪🇸 Español
      </button>

      <button onclick="cambiarIdioma('en')">
        🇬🇧 English
      </button>

      <button onclick="cambiarIdioma('hy')">
        🇦🇲 Հայերեն
      </button>

    </div>

  </div>


  <!-- TEMA -->

  <button
    class="tema"
    id="botonTema"
    onclick="cambiarTema()"
  >
    ☀️ Claro
  </button>


  <!-- CONTENIDO -->

  <div class="contenedor">


    <h1 id="titulo">
      🔢 Adivina el número
    </h1>


    <p
      class="descripcion"
      id="descripcion"
    >
      Estoy pensando en un número entre 1 y 100.
    </p>


    <input
      type="number"
      id="numero"
      min="1"
      max="100"
      placeholder="1 - 100"
    >


    <button
      class="adivinar"
      id="botonAdivinar"
      onclick="comprobarNumero()"
    >
      🎯 Adivinar
    </button>


    <div id="mensaje"></div>


    <div id="intentos">
      Intentos: 0
    </div>


    <button
      class="reiniciar"
      id="reiniciar"
      onclick="reiniciarJuego()"
    >
      🔄 Jugar otra vez
    </button>


  </div>


  <script>

    /* =========================
       VARIABLES DEL JUEGO
       ========================= */

    let numeroSecreto =
      Math.floor(Math.random() * 100) + 1;

    let intentos = 0;

    let juegoTerminado = false;


    /* =========================
       IDIOMA
       ========================= */

    function aplicarIdioma() {

      const idioma =
        localStorage.getItem("idioma") || "es";


      document.documentElement.lang = idioma;


      const titulo =
        document.getElementById("titulo");

      const descripcion =
        document.getElementById("descripcion");

      const volver =
        document.getElementById("volver");

      const botonAdivinar =
        document.getElementById("botonAdivinar");

      const reiniciar =
        document.getElementById("reiniciar");

      const botonIdioma =
        document.getElementById("botonIdioma");


      if (idioma === "en") {

        titulo.textContent =
          "🔢 Guess the number";

        descripcion.textContent =
          "I'm thinking of a number between 1 and 100.";

        volver.textContent =
          "← Back";

        botonAdivinar.textContent =
          "🎯 Guess";

        reiniciar.textContent =
          "🔄 Play again";

        botonIdioma.textContent =
          "🇬🇧 EN ▾";

        document.title =
          "Guess the number - MY WEBSITE";

      }


      else if (idioma === "hy") {

        titulo.textContent =
          "🔢 Գուշակիր թիվը";

        descripcion.textContent =
          "Ես մտածում եմ 1-ից 100-ի միջև գտնվող թվի մասին։";

        volver.textContent =
          "← Հետ";

        botonAdivinar.textContent =
          "🎯 Գուշակել";

        reiniciar.textContent =
          "🔄 Նորից խաղալ";

        botonIdioma.textContent =
          "🇦🇲 HY ▾";

        document.title =
          "Գուշակիր թիվը - ԻՄ ԿԱՅՔԸ";

      }


      else {

        titulo.textContent =
          "🔢 Adivina el número";

        descripcion.textContent =
          "Estoy pensando en un número entre 1 y 100.";

        volver.textContent =
          "← Volver";

        botonAdivinar.textContent =
          "🎯 Adivinar";

        reiniciar.textContent =
          "🔄 Jugar otra vez";

        botonIdioma.textContent =
          "🇪🇸 ES ▾";

        document.title =
          "Adivina el número - MI WEB";

      }


      actualizarIntentos();

    }


    function actualizarIntentos() {

      const idioma =
        localStorage.getItem("idioma") || "es";


      const elemento =
        document.getElementById("intentos");


      if (idioma === "en") {

        elemento.textContent =
          "Attempts: " + intentos;

      }

      else if (idioma === "hy") {

        elemento.textContent =
          "Փորձեր՝ " + intentos;

      }

      else {

        elemento.textContent =
          "Intentos: " + intentos;

      }

    }


    function cambiarIdioma(idioma) {

      localStorage.setItem(
        "idioma",
        idioma
      );

      aplicarIdioma();

      document
        .getElementById("menuIdioma")
        .classList.remove("mostrar");

    }


    function abrirIdioma() {

      document
        .getElementById("menuIdioma")
        .classList.toggle("mostrar");

    }


    /* CERRAR MENÚ */

    document.addEventListener(
      "click",
      function(event) {

        const menu =
          document.getElementById("menuIdioma");

        const boton =
          document.getElementById("botonIdioma");

        if (
          !menu.contains(event.target) &&
          !boton.contains(event.target)
        ) {

          menu.classList.remove("mostrar");

        }

      }
    );


    /* =========================
       COMPROBAR NÚMERO
       ========================= */

    function comprobarNumero() {

      if (juegoTerminado) {
        return;
      }


      const input =
        document.getElementById("numero");

      const mensaje =
        document.getElementById("mensaje");

      const numero =
        Number(input.value);

      const idioma =
        localStorage.getItem("idioma") || "es";


      if (input.value === "") {

        if (idioma === "en") {
          mensaje.textContent =
            "⚠️ Enter a number.";
        }

        else if (idioma === "hy") {
          mensaje.textContent =
            "⚠️ Գրիր թիվ։";
        }

        else {
          mensaje.textContent =
            "⚠️ Escribe un número.";
        }

        return;
      }


      if (numero < 1 || numero > 100) {

        if (idioma === "en") {
          mensaje.textContent =
            "⚠️ The number must be between 1 and 100.";
        }

        else if (idioma === "hy") {
          mensaje.textContent =
            "⚠️ Թիվը պետք է լինի 1-ից 100-ի միջև։";
        }

        else {
          mensaje.textContent =
            "⚠️ El número debe estar entre 1 y 100.";
        }

        return;
      }


      intentos++;

      actualizarIntentos();


      if (numero < numeroSecreto) {

        if (idioma === "en") {
          mensaje.textContent =
            "🔼 It's higher.";
        }

        else if (idioma === "hy") {
          mensaje.textContent =
            "🔼 Ավելի բարձր է։";
        }

        else {
          mensaje.textContent =
            "🔼 Es más alto.";
        }

      }


      else if (numero > numeroSecreto) {

        if (idioma === "en") {
          mensaje.textContent =
            "🔽 It's lower.";
        }

        else if (idioma === "hy") {
          mensaje.textContent =
            "🔽 Ավելի ցածր է։";
        }

        else {
          mensaje.textContent =
            "🔽 Es más bajo.";
        }

      }


      else {

        if (idioma === "en") {
          mensaje.textContent =
            "🎉 You got it! It was " +
            numeroSecreto + ".";
        }

        else if (idioma === "hy") {
          mensaje.textContent =
            "🎉 Ճիշտ է։ Թիվը " +
            numeroSecreto + " էր։";
        }

        else {
          mensaje.textContent =
            "🎉 ¡Acertaste! Era el " +
            numeroSecreto + ".";
        }


        juegoTerminado = true;

        input.disabled = true;

        document.getElementById(
          "botonAdivinar"
        ).style.display = "none";

        document.getElementById(
          "reiniciar"
        ).style.display = "block";

      }


      input.value = "";

      input.focus();

    }


    /* =========================
       REINICIAR
       ========================= */

    function reiniciarJuego() {

      numeroSecreto =
        Math.floor(Math.random() * 100) + 1;

      intentos = 0;

      juegoTerminado = false;


      const input =
        document.getElementById("numero");


      input.disabled = false;

      input.value = "";


      document.getElementById(
        "mensaje"
      ).textContent = "";


      actualizarIntentos();


      document.getElementById(
        "botonAdivinar"
      ).style.display = "block";


      document.getElementById(
        "reiniciar"
      ).style.display = "none";


      input.focus();

    }


    /* =========================
       TEMA
       ========================= */

    function aplicarTema() {

      const tema =
        localStorage.getItem("tema") || "oscuro";


      if (tema === "claro") {

        document.body.classList.add("claro");

        document.getElementById(
          "botonTema"
        ).textContent =
          "🌙 Oscuro";

      }

      else {

        document.body.classList.remove("claro");

        document.getElementById(
          "botonTema"
        ).textContent =
          "☀️ Claro";

      }

    }


    function cambiarTema() {

      const temaActual =
        localStorage.getItem("tema") || "oscuro";


      if (temaActual === "oscuro") {

        localStorage.setItem(
          "tema",
          "claro"
        );

      }

      else {

        localStorage.setItem(
          "tema",
          "oscuro"
        );

      }


      aplicarTema();

    }


    /* =========================
       ENTER
       ========================= */

    document
      .getElementById("numero")
      .addEventListener(
        "keydown",
        function(event) {

          if (event.key === "Enter") {
            comprobarNumero();
          }

        }
      );


    /* =========================
       INICIAR
       ========================= */

    aplicarIdioma();

    aplicarTema();

  </script>

</body>

</html>
