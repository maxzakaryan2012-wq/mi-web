<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Adivina el número - MI WEB</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
      transition: background 0.3s, color 0.3s;
    }

    body.dia {
      background: #f5f5f5;
      color: #111;
    }

    /* BOTÓN VOLVER */

    .volver {
      position: absolute;
      top: 20px;
      left: 20px;
      padding: 12px 18px;
      border: none;
      border-radius: 12px;
      background: #222;
      color: white;
      font-size: 16px;
      cursor: pointer;
      text-decoration: none;
      transition: 0.2s;
    }

    body.dia .volver {
      background: #ddd;
      color: #111;
    }

    /* BOTÓN TEMA */

    .tema {
      position: absolute;
      top: 20px;
      right: 20px;
      padding: 12px 18px;
      border: none;
      border-radius: 12px;
      background: #222;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
    }

    body.dia .tema {
      background: #ddd;
      color: #111;
    }

    .volver:hover,
    .tema:hover,
    .adivinar:hover,
    .reiniciar:hover {
      transform: scale(1.05);
    }

    /* CONTENIDO */

    .contenedor {
      max-width: 600px;
      margin: 100px auto;
      padding: 30px 20px;
    }

    h1 {
      font-size: 50px;
      margin-bottom: 15px;
    }

    .descripcion {
      font-size: 20px;
      color: #aaa;
    }

    body.dia .descripcion {
      color: #555;
    }

    /* INPUT */

    input {
      width: 180px;
      padding: 15px;
      margin-top: 25px;
      font-size: 22px;
      text-align: center;
      border-radius: 10px;
      border: 2px solid #333;
      background: #222;
      color: white;
      outline: none;
    }

    body.dia input {
      background: white;
      color: #111;
      border-color: #ccc;
    }

    input:focus {
      border-color: #777;
    }

    /* BOTONES */

    .adivinar,
    .reiniciar {
      display: block;
      margin: 20px auto 0;
      padding: 15px 30px;
      font-size: 20px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    .reiniciar {
      display: none;
      margin-top: 15px;
    }

    /* MENSAJE */

    #mensaje {
      font-size: 28px;
      font-weight: bold;
      margin-top: 35px;
      min-height: 40px;
    }

    #intentos {
      font-size: 18px;
      color: #aaa;
      margin-top: 15px;
    }

    body.dia #intentos {
      color: #555;
    }

    /* MÓVIL */

    @media (max-width: 600px) {
      h1 {
        font-size: 38px;
      }

      .contenedor {
        margin-top: 90px;
      }

      .volver,
      .tema {
        padding: 10px 13px;
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <!-- VOLVER -->
  <a class="volver" href="../../">
    ← Volver
  </a>

  <!-- TEMA -->
  <button class="tema" onclick="cambiarTema()" id="botonTema">
    ☀️ Día
  </button>

  <div class="contenedor">

    <h1>🔢 Adivina el número</h1>

    <p class="descripcion">
      Estoy pensando en un número entre 1 y 100.
    </p>

    <input
      type="number"
      id="numero"
      min="1"
      max="100"
      placeholder="1 - 100"
    >

    <button class="adivinar" onclick="comprobarNumero()">
      🎯 Adivinar
    </button>

    <div id="mensaje"></div>

    <div id="intentos">
      Intentos: 0
    </div>

    <button class="reiniciar" id="reiniciar" onclick="reiniciarJuego()">
      🔄 Jugar otra vez
    </button>

  </div>

  <script>

    let numeroSecreto = Math.floor(Math.random() * 100) + 1;
    let intentos = 0;
    let juegoTerminado = false;

    function comprobarNumero() {

      if (juegoTerminado) {
        return;
      }

      const input = document.getElementById("numero");
      const mensaje = document.getElementById("mensaje");
      const numero = Number(input.value);

      if (input.value === "") {
        mensaje.textContent = "⚠️ Escribe un número.";
        return;
      }

      if (numero < 1 || numero > 100) {
        mensaje.textContent = "⚠️ El número debe estar entre 1 y 100.";
        return;
      }

      intentos++;

      document.getElementById("intentos").textContent =
        "Intentos: " + intentos;

      if (numero < numeroSecreto) {

        mensaje.textContent = "🔼 Es más alto.";

      } else if (numero > numeroSecreto) {

        mensaje.textContent = "🔽 Es más bajo.";

      } else {

        mensaje.textContent =
          "🎉 ¡Acertaste! Era el " + numeroSecreto + ".";

        juegoTerminado = true;

        input.disabled = true;

        document.querySelector(".adivinar").style.display = "none";
        document.getElementById("reiniciar").style.display = "block";
      }

      input.value = "";
      input.focus();
    }

    function reiniciarJuego() {

      numeroSecreto = Math.floor(Math.random() * 100) + 1;

      intentos = 0;

      juegoTerminado = false;

      document.getElementById("numero").disabled = false;
      document.getElementById("numero").value = "";

      document.getElementById("mensaje").textContent = "";

      document.getElementById("intentos").textContent =
        "Intentos: 0";

      document.querySelector(".adivinar").style.display = "block";
      document.getElementById("reiniciar").style.display = "none";

      document.getElementById("numero").focus();
    }

    function cambiarTema() {

      document.body.classList.toggle("dia");

      const boton = document.getElementById("botonTema");

      if (document.body.classList.contains("dia")) {

        boton.textContent = "🌙 Noche";

      } else {

        boton.textContent = "☀️ Día";

      }
    }

    document.getElementById("numero").addEventListener("keydown", function(event) {

      if (event.key === "Enter") {
        comprobarNumero();
      }

    });

  </script>

</body>
</html>
