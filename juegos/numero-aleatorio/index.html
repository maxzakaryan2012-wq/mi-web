<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Número aleatorio - MI WEB</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      font-family: Arial, sans-serif;

      background: #111;

      color: white;

      text-align: center;

      transition: background 0.3s, color 0.3s;

    }


    body.claro {

      background: #f5f5f5;

      color: #111;

    }


    /* BOTONES SUPERIORES */

    .volver {

      position: absolute;

      top: 20px;

      left: 20px;

      padding: 12px 18px;

      border: none;

      border-radius: 12px;

      background: #222;

      color: white;

      font-size: 16px;

      cursor: pointer;

      text-decoration: none;

      transition: 0.2s;

    }


    body.claro .volver {

      background: #ddd;

      color: #111;

    }


    .tema {

      position: absolute;

      top: 20px;

      right: 20px;

      padding: 12px 18px;

      border: none;

      border-radius: 12px;

      background: #222;

      color: white;

      font-size: 16px;

      cursor: pointer;

      transition: 0.2s;

    }


    body.claro .tema {

      background: #ddd;

      color: #111;

    }


    .volver:hover,
    .tema:hover,
    .generar:hover {

      transform: scale(1.05);

    }


    /* IDIOMA */

    .idioma {

      position: absolute;

      top: 20px;

      right: 150px;

    }


    .botonIdioma {

      padding: 12px 14px;

      border: none;

      border-radius: 12px;

      background: #222;

      color: white;

      font-size: 15px;

      cursor: pointer;

    }


    body.claro .botonIdioma {

      background: #ddd;

      color: #111;

    }


    .menuIdioma {

      display: none;

      position: absolute;

      top: 48px;

      right: 0;

      min-width: 160px;

      background: #1d1d1d;

      border: 1px solid #333;

      border-radius: 12px;

      padding: 6px;

      z-index: 1000;

    }


    body.claro .menuIdioma {

      background: white;

      border-color: #ddd;

    }


    .menuIdioma.mostrar {

      display: block;

    }


    .menuIdioma button {

      width: 100%;

      padding: 10px;

      border: none;

      border-radius: 8px;

      background: transparent;

      color: white;

      text-align: left;

      cursor: pointer;

      font-size: 15px;

    }


    body.claro .menuIdioma button {

      color: #111;

    }


    .menuIdioma button:hover {

      background: #2a2a2a;

    }


    body.claro .menuIdioma button:hover {

      background: #eee;

    }


    /* CONTENEDOR */

    .contenedor {

      max-width: 600px;

      margin: 100px auto;

      padding: 30px 20px;

    }


    h1 {

      font-size: 50px;

    }


    input {

      width: 120px;

      padding: 15px;

      margin: 10px;

      font-size: 20px;

      text-align: center;

      border-radius: 10px;

      border: none;

    }


    .generar {

      margin-top: 20px;

      padding: 15px 30px;

      font-size: 20px;

      border: none;

      border-radius: 10px;

      cursor: pointer;

    }


    #resultado {

      font-size: 70px;

      font-weight: bold;

      margin-top: 40px;

    }


    @media (max-width: 600px) {

      .idioma {

        right: 125px;

      }

      .tema {

        right: 12px;

      }

      .volver {

        left: 12px;

      }

      h1 {

        font-size: 40px;

      }

    }

  </style>

</head>


<body>


  <!-- VOLVER -->

  <a
    class="volver"
    href="../../"
    id="botonVolver"
  >

    ← Volver

  </a>


  <!-- IDIOMA -->

  <div class="idioma">


    <button
      class="botonIdioma"
      onclick="abrirIdioma()"
      id="botonIdioma"
    >

      🇪🇸 ES ▾

    </button>


    <div
      class="menuIdioma"
      id="menuIdioma"
    >


      <button onclick="cambiarIdioma('es')">

        🇪🇸 Español

      </button>


      <button onclick="cambiarIdioma('en')">

        🇬🇧 English

      </button>


      <button onclick="cambiarIdioma('hy')">

        🇦🇲 Հայերեն

      </button>


    </div>

  </div>


  <!-- TEMA -->

  <button
    class="tema"
    onclick="cambiarTema()"
    id="botonTema"
  >

    ☀️ Claro

  </button>


  <!-- CONTENIDO -->

  <div class="contenedor">


    <h1>

      🎲

      <span
        data-es="Número aleatorio"
        data-en="Random number"
        data-hy="Պատահական թիվ"
      >

        Número aleatorio

      </span>

    </h1>


    <p
      data-es="Escribe dos números:"
      data-en="Enter two numbers:"
      data-hy="Գրիր երկու թիվ։"
    >

      Escribe dos números:

    </p>


    <input
      type="number"
      id="numero1"
      placeholder="1"
    >


    <input
      type="number"
      id="numero2"
      placeholder="10"
    >


    <br>


    <button
      class="generar"
      onclick="generarNumero()"
      id="botonGenerar"
    >

      🎲 Generar

    </button>


    <div id="resultado">

      ?

    </div>


  </div>


  <script>


    /* NÚMERO ALEATORIO */

    function generarNumero() {


      let numero1 =
        Number(
          document.getElementById("numero1").value
        );


      let numero2 =
        Number(
          document.getElementById("numero2").value
        );


      if (numero1 > numero2) {

        let temporal = numero1;

        numero1 = numero2;

        numero2 = temporal;

      }


      if (numero1 === numero2) {

        document.getElementById(
          "resultado"
        ).textContent = numero1;

        return;

      }


      let resultado =

        Math.floor(

          Math.random() *
          (numero2 - numero1 + 1)

        ) + numero1;


      document.getElementById(
        "resultado"
      ).textContent = resultado;

    }


    /* IDIOMA */

    function aplicarIdioma() {


      const idioma =
        localStorage.getItem("idioma") || "es";


      document.documentElement.lang =
        idioma;


      const textos =
        document.querySelectorAll(
          "[data-es][data-en][data-hy]"
        );


      textos.forEach(function(elemento) {


        if (idioma === "en") {

          elemento.textContent =
            elemento.getAttribute("data-en");

        }

        else if (idioma === "hy") {

          elemento.textContent =
            elemento.getAttribute("data-hy");

        }

        else {

          elemento.textContent =
            elemento.getAttribute("data-es");

        }

      });


      const botonIdioma =
        document.getElementById(
          "botonIdioma"
        );


      if (idioma === "en") {

        botonIdioma.textContent =
          "🇬🇧 EN ▾";

        document.getElementById(
          "botonVolver"
        ).textContent = "← Back";

        document.getElementById(
          "botonGenerar"
        ).textContent = "🎲 Generate";

        document.title =
          "Random number - MY WEBSITE";

      }

      else if (idioma === "hy") {

        botonIdioma.textContent =
          "🇦🇲 HY ▾";

        document.getElementById(
          "botonVolver"
        ).textContent = "← Հետ";

        document.getElementById(
          "botonGenerar"
        ).textContent = "🎲 Ստեղծել";

        document.title =
          "Պատահական թիվ - ԻՄ ԿԱՅՔԸ";

      }

      else {

        botonIdioma.textContent =
          "🇪🇸 ES ▾";

        document.getElementById(
          "botonVolver"
        ).textContent = "← Volver";

        document.getElementById(
          "botonGenerar"
        ).textContent = "🎲 Generar";

        document.title =
          "Número aleatorio - MI WEB";

      }

    }


    function cambiarIdioma(idioma) {

      localStorage.setItem(
        "idioma",
        idioma
      );

      aplicarIdioma();

      document
        .getElementById("menuIdioma")
        .classList.remove("mostrar");

    }


    function abrirIdioma() {

      document
        .getElementById("menuIdioma")
        .classList.toggle("mostrar");

    }


    /* CERRAR MENÚ */

    document.addEventListener(
      "click",
      function(event) {


        const menu =
          document.getElementById(
            "menuIdioma"
          );


        const boton =
          document.getElementById(
            "botonIdioma"
          );


        if (
          !menu.contains(event.target) &&
          !boton.contains(event.target)
        ) {

          menu.classList.remove(
            "mostrar"
          );

        }

      }
    );


    /* TEMA */

    function aplicarTema() {


      const tema =
        localStorage.getItem("tema") ||
        "oscuro";


      if (tema === "claro") {

        document.body.classList.add(
          "claro"
        );

        document.getElementById(
          "botonTema"
        ).textContent =
          "🌙 Oscuro";

      }

      else {

        document.body.classList.remove(
          "claro"
        );

        document.getElementById(
          "botonTema"
        ).textContent =
          "☀️ Claro";

      }

    }


    function cambiarTema() {


      const temaActual =
        localStorage.getItem("tema") ||
        "oscuro";


      if (temaActual === "oscuro") {

        localStorage.setItem(
          "tema",
          "claro"
        );

      }

      else {

        localStorage.setItem(
          "tema",
          "oscuro"
        );

      }


      aplicarTema();

    }


    /* INICIAR */

    aplicarTema();

    aplicarIdioma();


  </script>


</body>

</html>
