<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Número aleatorio - MI WEB</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
      transition: background 0.3s, color 0.3s;
    }

    body.claro {
      background: #f5f5f5;
      color: #111;
    }

    /* VOLVER */

    .volver {
      position: absolute;
      top: 20px;
      left: 20px;
      padding: 12px 18px;
      border: none;
      border-radius: 12px;
      background: #222;
      color: white;
      font-size: 16px;
      cursor: pointer;
      text-decoration: none;
    }

    body.claro .volver {
      background: #ddd;
      color: #111;
    }

    /* TEMA */

    .tema {
      position: absolute;
      top: 20px;
      right: 20px;
      padding: 12px 18px;
      border: none;
      border-radius: 12px;
      background: #222;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    body.claro .tema {
      background: #ddd;
      color: #111;
    }

    .volver:hover,
    .tema:hover,
    .generar:hover {
      transform: scale(1.05);
    }

    /* CONTENIDO */

    .contenedor {
      max-width: 600px;
      margin: 100px auto;
      padding: 30px 20px;
    }

    h1 {
      font-size: 50px;
    }

    input {
      width: 120px;
      padding: 15px;
      margin: 10px;
      font-size: 20px;
      text-align: center;
      border-radius: 10px;
      border: none;
    }

    .generar {
      margin-top: 20px;
      padding: 15px 30px;
      font-size: 20px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    #resultado {
      font-size: 70px;
      font-weight: bold;
      margin-top: 40px;
    }
  </style>
</head>

<body>

  <a class="volver" href="../../">
    ← Volver
  </a>

  <button class="tema" onclick="cambiarTema()" id="botonTema">
    ☀️ Claro
  </button>

  <div class="contenedor">

    <h1>🎲 Número aleatorio</h1>

    <p>Escribe dos números:</p>

    <input type="number" id="numero1" placeholder="1">

    <input type="number" id="numero2" placeholder="10">

    <br>

    <button class="generar" onclick="generarNumero()">
      🎲 Generar
    </button>

    <div id="resultado">?</div>

  </div>

  <script>

    function generarNumero() {

      let numero1 =
        Number(document.getElementById("numero1").value);

      let numero2 =
        Number(document.getElementById("numero2").value);

      if (numero1 > numero2) {

        let temporal = numero1;

        numero1 = numero2;
        numero2 = temporal;
      }

      if (numero1 === numero2) {

        document.getElementById("resultado").textContent =
          numero1;

        return;
      }

      let resultado =
        Math.floor(
          Math.random() * (numero2 - numero1 + 1)
        ) + numero1;

      document.getElementById("resultado").textContent =
        resultado;
    }

    function aplicarTema() {

      const tema =
        localStorage.getItem("tema") || "oscuro";

      if (tema === "claro") {

        document.body.classList.add("claro");

        document.getElementById("botonTema").textContent =
          "🌙 Oscuro";

      } else {

        document.body.classList.remove("claro");

        document.getElementById("botonTema").textContent =
          "☀️ Claro";
      }
    }

    function cambiarTema() {

      const temaActual =
        localStorage.getItem("tema") || "oscuro";

      if (temaActual === "oscuro") {

        localStorage.setItem("tema", "claro");

      } else {

        localStorage.setItem("tema", "oscuro");
      }

      aplicarTema();
    }

    aplicarTema();

  </script>

</body>
</html>
