<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Número aleatorio - MI WEB</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            transition: 0.3s;
        }

        /* BARRA */

        .barra {
            height: 70px;
            background: #181818;
            display: flex;
            align-items: center;
            padding: 0 25px;
            gap: 15px;
            border-bottom: 1px solid #333;
        }

        .volver {
            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
        }

        .volver:hover {
            opacity: 0.7;
        }

        .espacio {
            flex: 1;
        }

        .menu-idioma {
            position: relative;
        }

        .boton-idioma,
        #botonTema {
            background: #252525;
            color: white;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 10px 14px;
            cursor: pointer;
            font-size: 14px;
        }

        .boton-idioma:hover,
        #botonTema:hover {
            background: #333;
        }

        .idiomas {
            display: none;
            position: absolute;
            right: 0;
            top: 45px;
            background: #202020;
            border: 1px solid #444;
            border-radius: 8px;
            overflow: hidden;
            min-width: 150px;
            z-index: 100;
        }

        .idiomas button {
            width: 100%;
            border: none;
            background: transparent;
            color: white;
            padding: 12px;
            text-align: left;
            cursor: pointer;
            font-size: 14px;
        }

        .idiomas button:hover {
            background: #333;
        }

        /* CONTENIDO */

        .contenedor {
            max-width: 700px;
            margin: 0 auto;
            padding: 50px 20px;
            text-align: center;
        }

        h1 {
            font-size: 38px;
            margin-bottom: 10px;
        }

        #descripcion {
            color: #bbb;
            font-size: 17px;
            margin-bottom: 30px;
        }

        .inputs {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        input {
            width: 180px;
            padding: 14px;
            font-size: 17px;
            border-radius: 10px;
            border: 1px solid #555;
            background: #202020;
            color: white;
            outline: none;
            text-align: center;
        }

        input:focus {
            border-color: #777;
        }

        #botonGenerar {
            display: block;
            margin: 20px auto;
            padding: 13px 25px;
            font-size: 17px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: white;
            color: #111;
            font-weight: bold;
        }

        #botonGenerar:hover {
            transform: scale(1.03);
        }

        #resultado {
            min-height: 50px;
            margin-top: 25px;
            font-size: 32px;
            font-weight: bold;
        }

        /* ESTADÍSTICAS */

        .estadisticas {
            margin-top: 60px;
            text-align: left;
        }

        .estadisticas h2 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 20px;
        }

        .tabla-contenedor {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid #333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #181818;
        }

        th,
        td {
            padding: 14px 10px;
            text-align: center;
            border-bottom: 1px solid #333;
        }

        th {
            background: #222;
            font-size: 14px;
        }

        td {
            font-size: 15px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .tu-fila {
            background: #292929;
            font-weight: bold;
        }

        .posicion-usuario {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            background: #181818;
            border: 1px solid #333;
            text-align: center;
            display: none;
        }

        /* TEMA CLARO */

        body.claro {
            background: #f4f4f4;
            color: #111;
        }

        body.claro .barra {
            background: white;
            border-bottom: 1px solid #ddd;
        }

        body.claro .volver {
            color: #111;
        }

        body.claro .boton-idioma,
        body.claro #botonTema {
            background: #f1f1f1;
            color: #111;
            border-color: #ccc;
        }

        body.claro .boton-idioma:hover,
        body.claro #botonTema:hover {
            background: #e5e5e5;
        }

        body.claro .idiomas {
            background: white;
            border-color: #ccc;
        }

        body.claro .idiomas button {
            color: #111;
        }

        body.claro .idiomas button:hover {
            background: #eee;
        }

        body.claro #descripcion {
            color: #555;
        }

        body.claro input {
            background: white;
            color: #111;
            border-color: #bbb;
        }

        body.claro table {
            background: white;
        }

        body.claro th {
            background: #eee;
        }

        body.claro th,
        body.claro td {
            border-bottom-color: #ddd;
        }

        body.claro .tu-fila {
            background: #e8e8e8;
        }

        body.claro .posicion-usuario {
            background: white;
            border-color: #ddd;
        }

    </style>

</head>

<body>

    <!-- BARRA SUPERIOR -->

    <div class="barra">

        <a
            href="../../index.html"
            class="volver"
            id="volver"
        >
            ← Volver
        </a>

        <div class="espacio"></div>

        <div class="menu-idioma">

            <button
                class="boton-idioma"
                id="botonIdioma"
                onclick="abrirIdioma()"
            >
                🇪🇸 ES ▾
            </button>

            <div
                class="idiomas"
                id="menuIdiomas"
            >

                <button onclick="cambiarIdioma('es')">
                    🇪🇸 Español
                </button>

                <button onclick="cambiarIdioma('en')">
                    🇬🇧 English
                </button>

                <button onclick="cambiarIdioma('hy')">
                    🇦🇲 Հայերեն
                </button>

            </div>

        </div>

        <button
            id="botonTema"
            onclick="cambiarTema()"
        >
            ☀️ Claro
        </button>

    </div>


    <!-- CONTENIDO -->

    <main class="contenedor">

        <h1 id="titulo">
            🎲 Número aleatorio
        </h1>

        <p id="descripcion">
            Escribe dos números:
        </p>

        <div class="inputs">

            <input
                type="number"
                id="numero1"
                placeholder="Número 1"
            >

            <input
                type="number"
                id="numero2"
                placeholder="Número 2"
            >

        </div>

        <button
            id="botonGenerar"
            onclick="generarNumero()"
        >
            🎲 Generar
        </button>

        <div id="resultado"></div>


        <!-- ESTADÍSTICAS -->

        <section class="estadisticas">

            <h2 id="tituloEstadisticas">
                🏆 Estadísticas
            </h2>

            <div class="tabla-contenedor">

                <table>

                    <thead>

                        <tr>

                            <th id="thPuesto">
                                Puesto
                            </th>

                            <th id="thNombre">
                                Nombre
                            </th>

                            <th id="thGenerados">
                                Números generados
                            </th>

                        </tr>

                    </thead>

                    <tbody id="tablaRanking">
                    </tbody>

                </table>

            </div>

            <div
                class="posicion-usuario"
                id="posicionUsuario"
            ></div>

        </section>

    </main>


    <script>

        /* =====================================================
           NÚMERO ALEATORIO
        ===================================================== */

        function generarNumero() {

            const input1 =
                document.getElementById("numero1");

            const input2 =
                document.getElementById("numero2");

            let numero1 =
                Number(input1.value);

            let numero2 =
                Number(input2.value);

            const idioma =
                localStorage.getItem("idioma") || "es";


            if (
                input1.value === "" ||
                input2.value === ""
            ) {

                if (idioma === "en") {

                    document.getElementById("resultado").textContent =
                        "⚠️ Enter two numbers.";

                } else if (idioma === "hy") {

                    document.getElementById("resultado").textContent =
                        "⚠️ Գրիր երկու թիվ։";

                } else {

                    document.getElementById("resultado").textContent =
                        "⚠️ Escribe dos números.";
                }

                return;
            }


            if (numero1 > numero2) {

                const temporal = numero1;

                numero1 = numero2;
                numero2 = temporal;
            }


            const resultado =
                Math.floor(
                    Math.random() *
                    (
                        numero2 -
                        numero1 +
                        1
                    )
                ) +
                numero1;


            document.getElementById("resultado").textContent =
                resultado;


            guardarNumeroGenerado();
        }


        /* =====================================================
           USUARIO
        ===================================================== */

        function obtenerNombreUsuario() {

            let nombre =
                localStorage.getItem("nombreUsuario");


            if (!nombre) {

                let numero =
                    localStorage.getItem("numeroUsuario");


                if (!numero) {

                    numero =
                        Math.floor(
                            Math.random() * 10000
                        );

                    numero =
                        String(numero).padStart(4, "0");

                    localStorage.setItem(
                        "numeroUsuario",
                        numero
                    );
                }


                nombre =
                    "user_" + numero;


                localStorage.setItem(
                    "nombreUsuario",
                    nombre
                );
            }


            return nombre;
        }


        /* =====================================================
           ESTADÍSTICAS
        ===================================================== */

        const ESTADISTICAS_KEY =
            "estadisticasNumeroAleatorio";


        function obtenerEstadisticas() {

            const datos =
                localStorage.getItem(
                    ESTADISTICAS_KEY
                );


            if (!datos) {
                return {};
            }


            try {

                const datosParseados =
                    JSON.parse(datos);


                if (
                    !datosParseados ||
                    typeof datosParseados !== "object" ||
                    Array.isArray(datosParseados)
                ) {

                    return {};
                }


                const resultado = {};


                Object.keys(datosParseados).forEach(
                    function(nombre) {

                        const jugador =
                            datosParseados[nombre];


                        if (
                            !jugador ||
                            typeof jugador !== "object"
                        ) {

                            return;
                        }


                        const generados =
                            Number(jugador.generados);


                        if (
                            !Number.isFinite(generados) ||
                            generados < 0
                        ) {

                            return;
                        }


                        resultado[nombre] = {

                            generados:
                                Math.floor(generados)

                        };

                    }
                );


                return resultado;

            } catch {

                return {};
            }
        }


        function guardarNumeroGenerado() {

            const nombre =
                obtenerNombreUsuario();


            const estadisticas =
                obtenerEstadisticas();


            if (!estadisticas[nombre]) {

                estadisticas[nombre] = {

                    generados: 1

                };

            } else {

                estadisticas[nombre].generados += 1;
            }


            localStorage.setItem(
                ESTADISTICAS_KEY,
                JSON.stringify(estadisticas)
            );


            mostrarRanking();
        }


        function ordenarRanking(estadisticas) {

            const jugadores =
                Object.keys(estadisticas).map(
                    function(nombre) {

                        return {

                            nombre: nombre,

                            generados:
                                estadisticas[nombre].generados

                        };

                    }
                );


            jugadores.sort(
                function(a, b) {

                    if (
                        a.generados !==
                        b.generados
                    ) {

                        return (
                            b.generados -
                            a.generados
                        );
                    }


                    return a.nombre.localeCompare(
                        b.nombre
                    );

                }
            );


            return jugadores;
        }


        function mostrarRanking() {

            const estadisticas =
                obtenerEstadisticas();


            const ranking =
                ordenarRanking(
                    estadisticas
                );


            const tabla =
                document.getElementById(
                    "tablaRanking"
                );


            const nombreUsuario =
                obtenerNombreUsuario();


            tabla.innerHTML = "";


            const top10 =
                ranking.slice(0, 10);


            top10.forEach(
                function(jugador, index) {

                    const fila =
                        document.createElement("tr");


                    if (
                        jugador.nombre ===
                        nombreUsuario
                    ) {

                        fila.classList.add(
                            "tu-fila"
                        );
                    }


                    const puesto =
                        document.createElement("td");


                    const nombre =
                        document.createElement("td");


                    const generados =
                        document.createElement("td");


                    puesto.textContent =
                        index + 1;


                    nombre.textContent =
                        jugador.nombre;


                    generados.textContent =
                        jugador.generados;


                    fila.appendChild(puesto);
                    fila.appendChild(nombre);
                    fila.appendChild(generados);


                    tabla.appendChild(fila);

                }
            );


            mostrarPosicionUsuario(
                ranking,
                nombreUsuario
            );
        }


        function mostrarPosicionUsuario(
            ranking,
            nombreUsuario
        ) {

            const elemento =
                document.getElementById(
                    "posicionUsuario"
                );


            const posicion =
                ranking.findIndex(
                    function(jugador) {

                        return (
                            jugador.nombre ===
                            nombreUsuario
                        );

                    }
                );


            if (
                posicion === -1 ||
                posicion < 10
            ) {

                elemento.style.display =
                    "none";

                return;
            }


            const jugador =
                ranking[posicion];


            const idioma =
                localStorage.getItem(
                    "idioma"
                ) || "es";


            if (idioma === "en") {

                elemento.textContent =
                    "👤 Your position: " +
                    (posicion + 1) +
                    " — " +
                    nombreUsuario +
                    " — " +
                    jugador.generados +
                    " random numbers generated";


            } else if (idioma === "hy") {

                elemento.textContent =
                    "👤 Քո դիրքը՝ " +
                    (posicion + 1) +
                    " — " +
                    nombreUsuario +
                    " — " +
                    jugador.generados +
                    " պատահական թիվ";


            } else {

                elemento.textContent =
                    "👤 Tu posición: " +
                    (posicion + 1) +
                    " — " +
                    nombreUsuario +
                    " — " +
                    jugador.generados +
                    " números aleatorios generados";
            }


            elemento.style.display =
                "block";
        }


        /* =====================================================
           IDIOMAS
        ===================================================== */

        function abrirIdioma() {

            const menu =
                document.getElementById(
                    "menuIdiomas"
                );


            if (
                menu.style.display === "block"
            ) {

                menu.style.display = "none";

            } else {

                menu.style.display = "block";
            }
        }


        function cambiarIdioma(idioma) {

            localStorage.setItem(
                "idioma",
                idioma
            );


            aplicarIdioma();


            document.getElementById(
                "menuIdiomas"
            ).style.display = "none";
        }


        function aplicarIdioma() {

            const idioma =
                localStorage.getItem(
                    "idioma"
                ) || "es";


            const titulo =
                document.getElementById("titulo");

            const descripcion =
                document.getElementById("descripcion");

            const volver =
                document.getElementById("volver");

            const botonGenerar =
                document.getElementById("botonGenerar");

            const numero1 =
                document.getElementById("numero1");

            const numero2 =
                document.getElementById("numero2");

            const botonIdioma =
                document.getElementById("botonIdioma");


            const tituloEstadisticas =
                document.getElementById(
                    "tituloEstadisticas"
                );

            const thPuesto =
                document.getElementById("thPuesto");

            const thNombre =
                document.getElementById("thNombre");

            const thGenerados =
                document.getElementById("thGenerados");


            if (idioma === "en") {

                titulo.textContent =
                    "🎲 Random number";

                descripcion.textContent =
                    "Enter two numbers:";

                volver.textContent =
                    "← Back";

                botonGenerar.textContent =
                    "🎲 Generate";

                numero1.placeholder =
                    "Number 1";

                numero2.placeholder =
                    "Number 2";

                botonIdioma.textContent =
                    "🇬🇧 EN ▾";

                tituloEstadisticas.textContent =
                    "🏆 Statistics";

                thPuesto.textContent =
                    "Place";

                thNombre.textContent =
                    "Name";

                thGenerados.textContent =
                    "Random numbers generated";

                document.title =
                    "Random number - MY WEBSITE";


            } else if (idioma === "hy") {

                titulo.textContent =
                    "🎲 Պատահական թիվ";

                descripcion.textContent =
                    "Գրիր երկու թիվ։";

                volver.textContent =
                    "← Հետ";

                botonGenerar.textContent =
                    "🎲 Ստեղծել";

                numero1.placeholder =
                    "Թիվ 1";

                numero2.placeholder =
                    "Թիվ 2";

                botonIdioma.textContent =
                    "🇦🇲 HY ▾";

                tituloEstadisticas.textContent =
                    "🏆 Վիճակագրություն";

                thPuesto.textContent =
                    "Դիրք";

                thNombre.textContent =
                    "Անուն";

                thGenerados.textContent =
                    "Ստեղծված պատահական թվեր";

                document.title =
                    "Պատահական թիվ - ԻՄ ԿԱՅՔԸ";


            } else {

                titulo.textContent =
                    "🎲 Número aleatorio";

                descripcion.textContent =
                    "Escribe dos números:";

                volver.textContent =
                    "← Volver";

                botonGenerar.textContent =
                    "🎲 Generar";

                numero1.placeholder =
                    "Número 1";

                numero2.placeholder =
                    "Número 2";

                botonIdioma.textContent =
                    "🇪🇸 ES ▾";

                tituloEstadisticas.textContent =
                    "🏆 Estadísticas";

                thPuesto.textContent =
                    "Puesto";

                thNombre.textContent =
                    "Nombre";

                thGenerados.textContent =
                    "Números generados";

                document.title =
                    "Número aleatorio - MI WEB";
            }


            mostrarRanking();

            actualizarTextoTema();
        }


        document.addEventListener(
            "click",
            function(event) {

                const menu =
                    document.getElementById(
                        "menuIdiomas"
                    );

                const boton =
                    document.getElementById(
                        "botonIdioma"
                    );


                if (
                    !menu.contains(event.target) &&
                    !boton.contains(event.target)
                ) {

                    menu.style.display = "none";
                }

            }
        );


        /* =====================================================
           TEMA
        ===================================================== */

        function aplicarTema() {

            const tema =
                localStorage.getItem(
                    "tema"
                ) || "oscuro";


            if (tema === "claro") {

                document.body.classList.add(
                    "claro"
                );

            } else {

                document.body.classList.remove(
                    "claro"
                );
            }


            actualizarTextoTema();
        }


        function cambiarTema() {

            const temaActual =
                localStorage.getItem(
                    "tema"
                ) || "oscuro";


            const nuevoTema =
                temaActual === "oscuro"
                ? "claro"
                : "oscuro";


            localStorage.setItem(
                "tema",
                nuevoTema
            );


            aplicarTema();
        }


        function actualizarTextoTema() {

            const tema =
                localStorage.getItem(
                    "tema"
                ) || "oscuro";


            const idioma =
                localStorage.getItem(
                    "idioma"
                ) || "es";


            const boton =
                document.getElementById(
                    "botonTema"
                );


            if (idioma === "en") {

                boton.textContent =
                    tema === "oscuro"
                    ? "☀️ Light"
                    : "🌙 Dark";

            } else if (idioma === "hy") {

                boton.textContent =
                    tema === "oscuro"
                    ? "☀️ Բաց"
                    : "🌙 Մութ";

            } else {

                boton.textContent =
                    tema === "oscuro"
                    ? "☀️ Claro"
                    : "🌙 Oscuro";
            }
        }


        /* =====================================================
           INICIO
        ===================================================== */

        aplicarIdioma();

        aplicarTema();

        mostrarRanking();

    </script>

</body>
</html>
