<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Carrera Infinita - MI WEB</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            transition: 0.3s;
        }

        body.claro {
            background: #f2f2f2;
            color: #111;
        }

        /* =========================
           BARRA
        ========================= */

        .barra {
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            background: #181818;
            border-bottom: 1px solid #333;
        }

        body.claro .barra {
            background: white;
            border-bottom: 1px solid #ddd;
        }

        .logo {
            font-size: 21px;
            font-weight: bold;
        }

        .controles {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .volver,
        .botonTema,
        .idioma {
            border: none;
            border-radius: 10px;
            padding: 10px 13px;
            background: #292929;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }

        .volver {
            text-decoration: none;
        }

        body.claro .volver,
        body.claro .botonTema,
        body.claro .idioma {
            background: #e8e8e8;
            color: #111;
        }

        .menu-idioma {
            position: relative;
        }

        .opciones-idioma {
            display: none;
            position: absolute;
            right: 0;
            top: 45px;
            background: #222;
            border-radius: 10px;
            overflow: hidden;
            z-index: 100;
        }

        body.claro .opciones-idioma {
            background: white;
        }

        .opciones-idioma button {
            display: block;
            width: 150px;
            padding: 12px;
            border: none;
            background: transparent;
            color: white;
            text-align: left;
            cursor: pointer;
        }

        body.claro .opciones-idioma button {
            color: #111;
        }

        .opciones-idioma button:hover {
            background: #333;
        }

        body.claro .opciones-idioma button:hover {
            background: #eee;
        }

        /* =========================
           CONTENIDO
        ========================= */

        main {
            max-width: 850px;
            margin: auto;
            padding: 30px 20px 50px;
            text-align: center;
        }

        h1 {
            margin: 0 0 8px;
        }

        #descripcion {
            color: #aaa;
            margin-bottom: 20px;
        }

        body.claro #descripcion {
            color: #555;
        }

        /* =========================
           MARCADOR
        ========================= */

        .marcador {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 18px;
            font-size: 18px;
            font-weight: bold;
        }

        /* =========================
           JUEGO
        ========================= */

        .zona-juego {
            position: relative;
            width: min(450px, 100%);
            height: 620px;
            margin: auto;
            overflow: hidden;
            border-radius: 20px;
            border: 4px solid #555;

            background:
                linear-gradient(
                    90deg,
                    #272727 0%,
                    #272727 32.5%,
                    #5b5b5b 32.5%,
                    #5b5b5b 33.5%,
                    #272727 33.5%,
                    #272727 66.5%,
                    #5b5b5b 66.5%,
                    #5b5b5b 67.5%,
                    #272727 67.5%,
                    #272727 100%
                );
        }

        body.claro .zona-juego {
            border-color: #777;
        }

        /* =========================
           LÍNEAS DE LA CARRETERA
        ========================= */

        .linea-carril {
            position: absolute;
            top: -120px;
            bottom: -120px;
            width: 4px;

            background:
                repeating-linear-gradient(
                    to bottom,
                    rgba(255,255,255,0.8) 0px,
                    rgba(255,255,255,0.8) 55px,
                    transparent 55px,
                    transparent 110px
                );

            animation: carretera 0.55s linear infinite;
            pointer-events: none;
        }

        .linea1 {
            left: 33.33%;
        }

        .linea2 {
            left: 66.66%;
        }

        @keyframes carretera {

            from {
                transform: translateY(-110px);
            }

            to {
                transform: translateY(0);
            }

        }

        /* =========================
           PERSONAJE ROBOT
        ========================= */

        .personaje {
            position: absolute;
            bottom: 35px;
            left: 50%;
            width: 64px;
            height: 86px;
            transform: translateX(-50%);
            z-index: 20;

            transition:
                left 0.12s ease-out;
        }

        .robot-cabeza {
            position: absolute;
            top: 0;
            left: 10px;
            width: 44px;
            height: 39px;

            background:
                linear-gradient(
                    #8fe8ff,
                    #3da8d8
                );

            border: 3px solid #101820;
            border-radius: 10px 10px 8px 8px;
        }

        .robot-ojo {
            position: absolute;
            top: 12px;
            width: 8px;
            height: 8px;
            background: #111;
            border-radius: 50%;
        }

        .ojo1 {
            left: 9px;
        }

        .ojo2 {
            right: 9px;
        }

        .robot-antena {
            position: absolute;
            top: -12px;
            left: 29px;
            width: 4px;
            height: 12px;
            background: #222;
        }

        .robot-antena::after {
            content: "";
            position: absolute;
            top: -5px;
            left: -3px;
            width: 10px;
            height: 10px;
            background: #ffcc33;
            border-radius: 50%;
            border: 2px solid #111;
        }

        .robot-cuerpo {
            position: absolute;
            top: 38px;
            left: 7px;
            width: 50px;
            height: 38px;

            background:
                linear-gradient(
                    #3574e8,
                    #214ab2
                );

            border: 3px solid #101820;
            border-radius: 9px;
        }

        .robot-pecho {
            position: absolute;
            top: 8px;
            left: 15px;
            width: 14px;
            height: 10px;
            background: #70e1ff;
            border-radius: 3px;
        }

        .robot-brazo {
            position: absolute;
            top: 43px;
            width: 11px;
            height: 29px;
            background: #3976c9;
            border: 3px solid #101820;
            border-radius: 8px;
        }

        .brazo1 {
            left: 0;
            transform: rotate(8deg);
        }

        .brazo2 {
            right: 0;
            transform: rotate(-8deg);
        }

        .robot-pierna {
            position: absolute;
            bottom: 0;
            width: 14px;
            height: 22px;
            background: #303a4a;
            border: 3px solid #101820;
            border-radius: 6px;
        }

        .pierna1 {
            left: 15px;
        }

        .pierna2 {
            right: 15px;
        }

        /* =========================
           OBSTÁCULOS
        ========================= */

        .obstaculo {
            position: absolute;
            z-index: 10;
            transform: translateX(-50%);
        }

        /* GRANDE: 2 FILAS */

        .obstaculo-grande {
            width: 88px;
            height: 130px;

            background:
                linear-gradient(
                    135deg,
                    #d93030 0%,
                    #8e1616 100%
                );

            border: 5px solid #4b0c0c;
            border-radius: 13px;

            box-shadow:
                inset 0 0 0 3px rgba(255,255,255,0.12);
        }

        .obstaculo-grande::before {
            content: "⚠";
            position: absolute;
            top: 32px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 45px;
            color: #ffd33d;
        }

        .obstaculo-grande::after {
            content: "";
            position: absolute;
            left: 10px;
            right: 10px;
            bottom: 14px;
            height: 8px;
            background:
                repeating-linear-gradient(
                    135deg,
                    #ffd33d 0px,
                    #ffd33d 12px,
                    #151515 12px,
                    #151515 24px
                );
        }

        /* PEQUEÑO 1 */

        .obstaculo-barrera {
            width: 82px;
            height: 62px;

            background:
                repeating-linear-gradient(
                    135deg,
                    #ff9f1c 0px,
                    #ff9f1c 13px,
                    #242424 13px,
                    #242424 26px
                );

            border: 4px solid #8b4c00;
            border-radius: 9px;
        }

        .obstaculo-barrera::after {
            content: "";
            position: absolute;
            left: 7px;
            right: 7px;
            bottom: 8px;
            height: 7px;
            background: #111;
            border-radius: 4px;
        }

        /* PEQUEÑO 2 */

        .obstaculo-caja {
            width: 76px;
            height: 62px;

            background:
                linear-gradient(
                    135deg,
                    #8f5be8,
                    #4e269b
                );

            border: 4px solid #29115d;
            border-radius: 8px;
        }

        .obstaculo-caja::before {
            content: "X";
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f4dcff;
            font-size: 32px;
            font-weight: bold;
        }

        /* =========================
           MONEDAS
        ========================= */

        .moneda {
            position: absolute;
            z-index: 8;
            width: 38px;
            height: 38px;

            border-radius: 50%;

            transform:
                translateX(-50%)
                rotateY(0deg);

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 17px;
            font-weight: bold;

            animation:
                girarMoneda 0.7s linear infinite;
        }

        .moneda-bronce {
            background:
                radial-gradient(
                    circle at 35% 30%,
                    #d99a55,
                    #8a4f22
                );

            border: 4px solid #663818;
            color: #ffe0ad;
        }

        .moneda-plata {
            background:
                radial-gradient(
                    circle at 35% 30%,
                    #ffffff,
                    #8d9298
                );

            border: 4px solid #555b61;
            color: #ffffff;
        }

        .moneda-oro {
            width: 44px;
            height: 44px;

            background:
                radial-gradient(
                    circle at 35% 30%,
                    #fff36b,
                    #d99b00
                );

            border: 4px solid #9b6b00;
            color: #fff7b0;

            box-shadow:
                0 0 12px rgba(255,210,0,0.55);
        }

        @keyframes girarMoneda {

            0% {
                transform:
                    translateX(-50%)
                    rotateY(0deg);
            }

            50% {
                transform:
                    translateX(-50%)
                    rotateY(90deg);
            }

            100% {
                transform:
                    translateX(-50%)
                    rotateY(180deg);
            }

        }

        /* =========================
           PANTALLAS
        ========================= */

        .pantalla-inicio,
        .pantalla-final {
            position: absolute;
            inset: 0;
            z-index: 50;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            padding: 25px;

            background:
                rgba(0,0,0,0.80);
        }

        .pantalla-final {
            display: none;
        }

        .pantalla-inicio h2,
        .pantalla-final h2 {
            font-size: 32px;
            margin: 6px;
        }

        .pantalla-inicio p,
        .pantalla-final p {
            color: #ddd;
            max-width: 300px;
            line-height: 1.5;
        }

        .boton-jugar {
            margin-top: 15px;
            padding: 15px 30px;

            border: none;
            border-radius: 12px;

            background: #2979ff;
            color: white;

            font-size: 18px;
            font-weight: bold;

            cursor: pointer;
        }

        .boton-jugar:hover {
            transform: scale(1.04);
        }

        .instrucciones {
            margin-top: 20px;
            color: #aaa;
            font-size: 14px;
        }

        /* =========================
           RANKING
        ========================= */

        .estadisticas {
            margin: 35px auto 0;
            max-width: 700px;

            background: #1d1d1d;
            border-radius: 16px;
            padding: 20px;
        }

        body.claro .estadisticas {
            background: white;
            border: 1px solid #ddd;
        }

        .estadisticas h2 {
            margin-top: 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 10px;
            border-bottom: 1px solid #444;
        }

        body.claro th,
        body.claro td {
            border-bottom: 1px solid #ddd;
        }

        .tu-posicion {
            margin-top: 15px;
            color: #aaa;
        }

        body.claro .tu-posicion {
            color: #555;
        }

        /* =========================
           MÓVIL
        ========================= */

        @media (max-width: 600px) {

            .barra {
                padding: 0 10px;
            }

            .logo {
                font-size: 17px;
            }

            .zona-juego {
                height: 570px;
            }

            .volver,
            .botonTema,
            .idioma {
                padding: 8px 9px;
            }

            .marcador {
                gap: 15px;
                font-size: 16px;
            }

        }

    </style>
</head>

<body>

    <!-- =========================
         BARRA
    ========================= -->

    <header class="barra">

        <a
            href="../../index.html"
            class="volver"
            id="volver"
        >
            ← Volver
        </a>

        <div class="logo">
            🏃 Carrera Infinita
        </div>

        <div class="controles">

            <div class="menu-idioma">

                <button
                    class="idioma"
                    id="botonIdioma"
                    onclick="mostrarIdiomas()"
                >
                    🇪🇸 ES ▾
                </button>

                <div
                    class="opciones-idioma"
                    id="opcionesIdioma"
                >

                    <button onclick="cambiarIdioma('es')">
                        🇪🇸 Español
                    </button>

                    <button onclick="cambiarIdioma('en')">
                        🇬🇧 English
                    </button>

                    <button onclick="cambiarIdioma('hy')">
                        🇦🇲 Հայերեն
                    </button>

                </div>

            </div>

            <button
                class="botonTema"
                id="botonTema"
                onclick="cambiarTema()"
            >
                ☀️ Claro
            </button>

        </div>

    </header>


    <main>

        <h1 id="titulo">
            🏃 Carrera Infinita
        </h1>

        <p id="descripcion">
            Esquiva los obstáculos y recoge monedas.
        </p>


        <!-- MARCADOR -->

        <div class="marcador">

            <div>
                🏆
                <span id="textoPuntos">
                    Puntos:
                </span>
                <span id="puntos">
                    0
                </span>
            </div>

            <div>
                🪙
                <span id="textoMonedas">
                    Monedas:
                </span>
                <span id="monedas">
                    0
                </span>
            </div>

        </div>


        <!-- =========================
             ZONA DE JUEGO
        ========================= -->

        <div
            class="zona-juego"
            id="zonaJuego"
        >

            <div class="linea-carril linea1"></div>
            <div class="linea-carril linea2"></div>


            <!-- ROBOT -->

            <div
                class="personaje"
                id="personaje"
            >

                <div class="robot-antena"></div>

                <div class="robot-cabeza">

                    <div class="robot-ojo ojo1"></div>
                    <div class="robot-ojo ojo2"></div>

                </div>

                <div class="robot-cuerpo">

                    <div class="robot-pecho"></div>

                </div>

                <div class="robot-brazo brazo1"></div>
                <div class="robot-brazo brazo2"></div>

                <div class="robot-pierna pierna1"></div>
                <div class="robot-pierna pierna2"></div>

            </div>


            <!-- PANTALLA INICIAL -->

            <div
                class="pantalla-inicio"
                id="pantallaInicio"
            >

                <h2>
                    🤖
                </h2>

                <h2 id="tituloInicio">
                    ¡Corre!
                </h2>

                <p id="textoInicio">
                    Esquiva los obstáculos y recoge monedas.
                </p>

                <button
                    class="boton-jugar"
                    id="botonJugar"
                    onclick="empezarJuego()"
                >
                    ▶️ Empezar
                </button>

                <div
                    class="instrucciones"
                    id="instrucciones"
                >
                    ← → o A / D para cambiar de carril
                </div>

            </div>


            <!-- PANTALLA FINAL -->

            <div
                class="pantalla-final"
                id="pantallaFinal"
            >

                <h2 id="tituloFinal">
                    💥 ¡Has chocado!
                </h2>

                <p id="resultadoFinal">
                    Puntos: 0
                </p>

                <button
                    class="boton-jugar"
                    id="botonReintentar"
                    onclick="empezarJuego()"
                >
                    🔄 Jugar otra vez
                </button>

            </div>

        </div>


        <!-- =========================
             RANKING
        ========================= -->

        <section class="estadisticas">

            <h2 id="tituloRanking">
                🏆 Récords
            </h2>

            <table>

                <thead>

                    <tr>

                        <th id="thPuesto">
                            Puesto
                        </th>

                        <th id="thNombre">
                            Nombre
                        </th>

                        <th id="thPuntos">
                            Más puntos
                        </th>

                        <th id="thPartidas">
                            Partidas
                        </th>

                    </tr>

                </thead>

                <tbody id="tablaRanking"></tbody>

            </table>

            <div
                class="tu-posicion"
                id="tuPosicion"
            ></div>

        </section>

    </main>


    <script>

        /* =========================
           TEMA
        ========================= */

        function aplicarTema() {

            const tema =
                localStorage.getItem("tema") || "oscuro";

            if (tema === "claro") {

                document.body.classList.add("claro");

            } else {

                document.body.classList.remove("claro");

            }

            actualizarTextoTema();

        }


        function cambiarTema() {

            const actual =
                localStorage.getItem("tema") || "oscuro";

            const nuevo =
                actual === "oscuro"
                ? "claro"
                : "oscuro";

            localStorage.setItem(
                "tema",
                nuevo
            );

            aplicarTema();

        }


        function actualizarTextoTema() {

            const tema =
                localStorage.getItem("tema") || "oscuro";

            const idioma =
                localStorage.getItem("idioma") || "es";

            const boton =
                document.getElementById(
                    "botonTema"
                );

            if (idioma === "en") {

                boton.textContent =
                    tema === "oscuro"
                    ? "☀️ Light"
                    : "🌙 Dark";

            } else if (idioma === "hy") {

                boton.textContent =
                    tema === "oscuro"
                    ? "☀️ Բաց"
                    : "🌙 Մութ";

            } else {

                boton.textContent =
                    tema === "oscuro"
                    ? "☀️ Claro"
                    : "🌙 Oscuro";

            }

        }


        /* =========================
           IDIOMA
        ========================= */

        function mostrarIdiomas() {

            const menu =
                document.getElementById(
                    "opcionesIdioma"
                );

            menu.style.display =
                menu.style.display === "block"
                ? "none"
                : "block";

        }


        function cambiarIdioma(idioma) {

            localStorage.setItem(
                "idioma",
                idioma
            );

            aplicarIdioma();

            document.getElementById(
                "opcionesIdioma"
            ).style.display = "none";

        }


        function aplicarIdioma() {

            const idioma =
                localStorage.getItem("idioma") || "es";


            if (idioma === "en") {

                document.documentElement.lang = "en";

                document.title =
                    "Infinite Run - MY WEBSITE";

                document.getElementById("volver").textContent =
                    "← Back";

                document.getElementById("titulo").textContent =
                    "🏃 Infinite Run";

                document.getElementById("descripcion").textContent =
                    "Dodge obstacles and collect coins.";

                document.getElementById("textoPuntos").textContent =
                    "Points:";

                document.getElementById("textoMonedas").textContent =
                    "Coins:";

                document.getElementById("tituloInicio").textContent =
                    "Run!";

                document.getElementById("textoInicio").textContent =
                    "Dodge obstacles and collect coins.";

                document.getElementById("botonJugar").textContent =
                    "▶️ Start";

                document.getElementById("instrucciones").textContent =
                    "← → or A / D to change lanes";

                document.getElementById("tituloFinal").textContent =
                    "💥 You crashed!";

                document.getElementById("botonReintentar").textContent =
                    "🔄 Play again";

                document.getElementById("tituloRanking").textContent =
                    "🏆 Records";

                document.getElementById("thPuesto").textContent =
                    "Rank";

                document.getElementById("thNombre").textContent =
                    "Name";

                document.getElementById("thPuntos").textContent =
                    "Best score";

                document.getElementById("thPartidas").textContent =
                    "Games";

                document.getElementById("botonIdioma").textContent =
                    "🇬🇧 EN ▾";


            } else if (idioma === "hy") {

                document.documentElement.lang = "hy";

                document.title =
                    "Անվերջ վազք - ԻՄ ԿԱՅՔԸ";

                document.getElementById("volver").textContent =
                    "← Հետ";

                document.getElementById("titulo").textContent =
                    "🏃 Անվերջ վազք";

                document.getElementById("descripcion").textContent =
                    "Խուսափիր խոչընդոտներից և հավաքիր մետաղադրամներ։";

                document.getElementById("textoPuntos").textContent =
                    "Միավորներ:";

                document.getElementById("textoMonedas").textContent =
                    "Մետաղադրամներ:";

                document.getElementById("tituloInicio").textContent =
                    "Վազիր!";

                document.getElementById("textoInicio").textContent =
                    "Խուսափիր խոչընդոտներից և հավաքիր մետաղադրամներ։";

                document.getElementById("botonJugar").textContent =
                    "▶️ Սկսել";

                document.getElementById("instrucciones").textContent =
                    "← → կամ A / D՝ գիծը փոխելու համար";

                document.getElementById("tituloFinal").textContent =
                    "💥 Բախվեցիր!";

                document.getElementById("botonReintentar").textContent =
                    "🔄 Նորից խաղալ";

                document.getElementById("tituloRanking").textContent =
                    "🏆 Ռեկորդներ";

                document.getElementById("thPuesto").textContent =
                    "Տեղ";

                document.getElementById("thNombre").textContent =
                    "Անուն";

                document.getElementById("thPuntos").textContent =
                    "Լավագույն միավոր";

                document.getElementById("thPartidas").textContent =
                    "Խաղեր";

                document.getElementById("botonIdioma").textContent =
                    "🇦🇲 HY ▾";


            } else {

                document.documentElement.lang = "es";

                document.title =
                    "Carrera Infinita - MI WEB";

                document.getElementById("volver").textContent =
                    "← Volver";

                document.getElementById("titulo").textContent =
                    "🏃 Carrera Infinita";

                document.getElementById("descripcion").textContent =
                    "Esquiva los obstáculos y recoge monedas.";

                document.getElementById("textoPuntos").textContent =
                    "Puntos:";

                document.getElementById("textoMonedas").textContent =
                    "Monedas:";

                document.getElementById("tituloInicio").textContent =
                    "¡Corre!";

                document.getElementById("textoInicio").textContent =
                    "Esquiva los obstáculos y recoge monedas.";

                document.getElementById("botonJugar").textContent =
                    "▶️ Empezar";

                document.getElementById("instrucciones").textContent =
                    "← → o A / D para cambiar de carril";

                document.getElementById("tituloFinal").textContent =
                    "💥 ¡Has chocado!";

                document.getElementById("botonReintentar").textContent =
                    "🔄 Jugar otra vez";

                document.getElementById("tituloRanking").textContent =
                    "🏆 Récords";

                document.getElementById("thPuesto").textContent =
                    "Puesto";

                document.getElementById("thNombre").textContent =
                    "Nombre";

                document.getElementById("thPuntos").textContent =
                    "Más puntos";

                document.getElementById("thPartidas").textContent =
                    "Partidas";

                document.getElementById("botonIdioma").textContent =
                    "🇪🇸 ES ▾";

            }

            actualizarTextoTema();
            mostrarRanking();

        }


        /* =========================
           USUARIO
        ========================= */

        function obtenerNombreUsuario() {

            return (
                localStorage.getItem(
                    "nombreUsuario"
                ) ||
                "user_0001"
            );

        }


        /* =========================
           VARIABLES
        ========================= */

        let juegoActivo = false;

        let carrilActual = 1;

        let puntos = 0;

        let monedas = 0;

        let velocidad = 4;

        let tiempoJuego = 0;

        let obstaculos = [];

        let monedasObjetos = [];

        let intervaloObstaculos;

        let intervaloMonedas;

        let animacion;

        let relojVelocidad;


        const posicionesCarriles = [
            "16.66%",
            "50%",
            "83.33%"
        ];


        /* =========================
           MOVIMIENTO
        ========================= */

        function moverIzquierda() {

            if (!juegoActivo) {
                return;
            }

            if (carrilActual > 0) {

                carrilActual--;

                actualizarPosicionPersonaje();

            }

        }


        function moverDerecha() {

            if (!juegoActivo) {
                return;
            }

            if (carrilActual < 2) {

                carrilActual++;

                actualizarPosicionPersonaje();

            }

        }


        function actualizarPosicionPersonaje() {

            document.getElementById(
                "personaje"
            ).style.left =
                posicionesCarriles[carrilActual];

        }


        document.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "ArrowLeft" ||
                    event.key.toLowerCase() === "a"
                ) {

                    event.preventDefault();

                    moverIzquierda();

                }

                if (
                    event.key === "ArrowRight" ||
                    event.key.toLowerCase() === "d"
                ) {

                    event.preventDefault();

                    moverDerecha();

                }

            }
        );


        /* =========================
           EMPEZAR
        ========================= */

        function empezarJuego() {

            detenerJuego();

            limpiarObjetos();

            juegoActivo = true;

            carrilActual = 1;

            puntos = 0;

            monedas = 0;

            velocidad = 4;

            tiempoJuego = 0;

            actualizarMarcador();

            actualizarPosicionPersonaje();

            document.getElementById(
                "pantallaInicio"
            ).style.display = "none";

            document.getElementById(
                "pantallaFinal"
            ).style.display = "none";


            intervaloObstaculos =
                setInterval(
                    crearObstaculo,
                    900
                );


            intervaloMonedas =
                setInterval(
                    crearMoneda,
                    650
                );


            relojVelocidad =
                setInterval(
                    aumentarVelocidad,
                    3000
                );


            animacion =
                requestAnimationFrame(
                    actualizarJuego
                );

        }


        /* =========================
           VELOCIDAD
        ========================= */

        function aumentarVelocidad() {

            if (!juegoActivo) {
                return;
            }

            tiempoJuego++;

            velocidad += 0.35;

            if (velocidad > 11) {
                velocidad = 11;
            }

        }


        /* =========================
           OBSTÁCULOS
        ========================= */

        function crearObstaculo() {

            if (!juegoActivo) {
                return;
            }

            const zona =
                document.getElementById(
                    "zonaJuego"
                );

            const obstaculo =
                document.createElement(
                    "div"
                );


            const tipo =
                Math.floor(
                    Math.random() * 3
                );


            let alto;


            if (tipo === 0) {

                /*
                    GRANDE
                    2 FILAS
                */

                obstaculo.className =
                    "obstaculo obstaculo-grande";

                alto = 130;


            } else if (tipo === 1) {

                /*
                    PEQUEÑO 1
                    1 FILA
                */

                obstaculo.className =
                    "obstaculo obstaculo-barrera";

                alto = 62;


            } else {

                /*
                    PEQUEÑO 2
                    1 FILA
                */

                obstaculo.className =
                    "obstaculo obstaculo-caja";

                alto = 62;

            }


            const carril =
                Math.floor(
                    Math.random() * 3
                );


            obstaculo.dataset.carril =
                carril;


            obstaculo.style.left =
                posicionesCarriles[carril];


            obstaculo.style.top =
                (-alto - 10) + "px";


            zona.appendChild(
                obstaculo
            );


            obstaculos.push({

                elemento: obstaculo,

                carril: carril,

                y: -alto - 10,

                alto: alto

            });

        }


        /* =========================
           MONEDAS
        ========================= */

        function crearMoneda() {

            if (!juegoActivo) {
                return;
            }

            const zona =
                document.getElementById(
                    "zonaJuego"
                );

            const moneda =
                document.createElement(
                    "div"
                );


            const aleatorio =
                Math.random();


            let valor;

            let clase;


            /*
                BRONCE
                1 PUNTO
            */

            if (aleatorio < 0.65) {

                valor = 1;

                clase =
                    "moneda moneda-bronce";

            }

            /*
                PLATA
                5 PUNTOS
            */

            else if (aleatorio < 0.90) {

                valor = 5;

                clase =
                    "moneda moneda-plata";

            }

            /*
                ORO
                20 PUNTOS
            */

            else {

                valor = 20;

                clase =
                    "moneda moneda-oro";

            }


            moneda.className =
                clase;

            moneda.textContent =
                "★";


            const carril =
                Math.floor(
                    Math.random() * 3
                );


            moneda.style.left =
                posicionesCarriles[carril];


            moneda.style.top =
                "-55px";


            zona.appendChild(
                moneda
            );


            monedasObjetos.push({

                elemento: moneda,

                carril: carril,

                y: -55,

                valor: valor

            });

        }


        /* =========================
           ACTUALIZAR
        ========================= */

        function actualizarJuego() {

            if (!juegoActivo) {
                return;
            }


            const personaje =
                document.getElementById(
                    "personaje"
                );


            const personajeRect =
                personaje.getBoundingClientRect();


            const zona =
                document.getElementById(
                    "zonaJuego"
                );


            /* OBSTÁCULOS */

            for (
                let i = obstaculos.length - 1;
                i >= 0;
                i--
            ) {

                const obstaculo =
                    obstaculos[i];


                obstaculo.y +=
                    velocidad;


                obstaculo.elemento.style.top =
                    obstaculo.y + "px";


                const rect =
                    obstaculo.elemento
                        .getBoundingClientRect();


                /*
                    CHOQUE
                */

                if (
                    detectarColision(
                        personajeRect,
                        rect
                    )
                ) {

                    terminarJuego();

                    return;

                }


                /*
                    BORRAR CUANDO SALE
                */

                if (
                    obstaculo.y >
                    zona.clientHeight + 150
                ) {

                    obstaculo.elemento.remove();

                    obstaculos.splice(
                        i,
                        1
                    );

                }

            }


            /* MONEDAS */

            for (
                let i = monedasObjetos.length - 1;
                i >= 0;
                i--
            ) {

                const moneda =
                    monedasObjetos[i];


                moneda.y +=
                    velocidad;


                moneda.elemento.style.top =
                    moneda.y + "px";


                const rect =
                    moneda.elemento
                        .getBoundingClientRect();


                /*
                    RECOGER MONEDA
                */

                if (
                    detectarColision(
                        personajeRect,
                        rect
                    )
                ) {

                    puntos +=
                        moneda.valor;

                    monedas++;


                    moneda.elemento.remove();


                    monedasObjetos.splice(
                        i,
                        1
                    );


                    actualizarMarcador();

                    continue;

                }


                /*
                    BORRAR
                */

                if (
                    moneda.y >
                    zona.clientHeight + 100
                ) {

                    moneda.elemento.remove();

                    monedasObjetos.splice(
                        i,
                        1
                    );

                }

            }


            animacion =
                requestAnimationFrame(
                    actualizarJuego
                );

        }


        /* =========================
           COLISIÓN
        ========================= */

        function detectarColision(
            a,
            b
        ) {

            const margen = 8;

            return (

                a.left + margen <
                b.right - margen &&

                a.right - margen >
                b.left + margen &&

                a.top + margen <
                b.bottom - margen &&

                a.bottom - margen >
                b.top + margen

            );

        }


        /* =========================
           TERMINAR
        ========================= */

        function terminarJuego() {

            if (!juegoActivo) {
                return;
            }


            juegoActivo = false;


            detenerJuego();


            guardarEstadisticas();


            const idioma =
                localStorage.getItem(
                    "idioma"
                ) || "es";


            let texto;


            if (idioma === "en") {

                texto =
                    "Score: " +
                    puntos +
                    " | Coins: " +
                    monedas;

            }

            else if (idioma === "hy") {

                texto =
                    "Միավորներ՝ " +
                    puntos +
                    " | Մետաղադրամներ՝ " +
                    monedas;

            }

            else {

                texto =
                    "Puntos: " +
                    puntos +
                    " | Monedas: " +
                    monedas;

            }


            document.getElementById(
                "resultadoFinal"
            ).textContent =
                texto;


            document.getElementById(
                "pantallaFinal"
            ).style.display =
                "flex";


            mostrarRanking();

        }


        function detenerJuego() {

            clearInterval(
                intervaloObstaculos
            );

            clearInterval(
                intervaloMonedas
            );

            clearInterval(
                relojVelocidad
            );


            intervaloObstaculos = null;

            intervaloMonedas = null;

            relojVelocidad = null;


            if (animacion) {

                cancelAnimationFrame(
                    animacion
                );

                animacion = null;

            }

        }


        function limpiarObjetos() {

            obstaculos.forEach(
                objeto => {

                    objeto.elemento.remove();

                }
            );


            monedasObjetos.forEach(
                objeto => {

                    objeto.elemento.remove();

                }
            );


            obstaculos = [];

            monedasObjetos = [];

        }


        /* =========================
           MARCADOR
        ========================= */

        function actualizarMarcador() {

            document.getElementById(
                "puntos"
            ).textContent =
                puntos;


            document.getElementById(
                "monedas"
            ).textContent =
                monedas;

        }


        /* =========================
           ESTADÍSTICAS
        ========================= */

        function guardarEstadisticas() {

            const nombre =
                obtenerNombreUsuario();


            let estadisticas;


            try {

                estadisticas =
                    JSON.parse(
                        localStorage.getItem(
                            "estadisticasCarreraInfinita"
                        )
                    ) || {};

            }

            catch {

                estadisticas = {};

            }


            if (!estadisticas[nombre]) {

                estadisticas[nombre] = {

                    mejorPuntuacion: 0,

                    partidas: 0

                };

            }


            estadisticas[nombre].partidas++;


            if (
                puntos >
                estadisticas[nombre]
                    .mejorPuntuacion
            ) {

                estadisticas[nombre]
                    .mejorPuntuacion =
                    puntos;

            }


            localStorage.setItem(
                "estadisticasCarreraInfinita",
                JSON.stringify(
                    estadisticas
                )
            );

        }


        /* =========================
           RANKING
        ========================= */

        function mostrarRanking() {

            let estadisticas;


            try {

                estadisticas =
                    JSON.parse(
                        localStorage.getItem(
                            "estadisticasCarreraInfinita"
                        )
                    ) || {};

            }

            catch {

                estadisticas = {};

            }


            const jugadores =
                Object.keys(
                    estadisticas
                ).map(
                    nombre => ({

                        nombre: nombre,

                        mejorPuntuacion:
                            estadisticas[nombre]
                                .mejorPuntuacion || 0,

                        partidas:
                            estadisticas[nombre]
                                .partidas || 0

                    })
                );


            jugadores.sort(
                (a, b) => {

                    if (
                        b.mejorPuntuacion !==
                        a.mejorPuntuacion
                    ) {

                        return (
                            b.mejorPuntuacion -
                            a.mejorPuntuacion
                        );

                    }


                    return (
                        b.partidas -
                        a.partidas
                    );

                }
            );


            const tabla =
                document.getElementById(
                    "tablaRanking"
                );


            tabla.innerHTML = "";


            jugadores
                .slice(0, 10)
                .forEach(
                    (jugador, indice) => {

                        const fila =
                            document.createElement(
                                "tr"
                            );


                        fila.innerHTML = `

                            <td>
                                ${indice + 1}
                            </td>

                            <td>
                                ${escapeHTML(
                                    jugador.nombre
                                )}
                            </td>

                            <td>
                                ${jugador.mejorPuntuacion}
                            </td>

                            <td>
                                ${jugador.partidas}
                            </td>

                        `;


                        tabla.appendChild(
                            fila
                        );

                    }
                );


            const nombre =
                obtenerNombreUsuario();


            const posicion =
                jugadores.findIndex(
                    jugador =>
                        jugador.nombre ===
                        nombre
                ) + 1;


            const tuPosicion =
                document.getElementById(
                    "tuPosicion"
                );


            if (
                posicion > 10 &&
                posicion <= jugadores.length
            ) {

                const jugador =
                    jugadores[
                        posicion - 1
                    ];


                const idioma =
                    localStorage.getItem(
                        "idioma"
                    ) || "es";


                if (idioma === "en") {

                    tuPosicion.textContent =
                        "👤 Your position: " +
                        posicion +
                        " — " +
                        nombre +
                        " — " +
                        jugador.mejorPuntuacion +
                        " points";

                }

                else if (idioma === "hy") {

                    tuPosicion.textContent =
                        "👤 Քո դիրքը՝ " +
                        posicion +
                        " — " +
                        nombre +
                        " — " +
                        jugador.mejorPuntuacion +
                        " միավոր";

                }

                else {

                    tuPosicion.textContent =
                        "👤 Tu posición: " +
                        posicion +
                        " — " +
                        nombre +
                        " — " +
                        jugador.mejorPuntuacion +
                        " puntos";

                }

            }

            else {

                tuPosicion.textContent = "";

            }

        }


        function escapeHTML(texto) {

            const div =
                document.createElement(
                    "div"
                );

            div.textContent =
                texto;

            return div.innerHTML;

        }


        /* =========================
           INICIO
        ========================= */

        aplicarTema();

        aplicarIdioma();

        actualizarPosicionPersonaje();

        actualizarMarcador();

        mostrarRanking();

    </script>

</body>
</html>
