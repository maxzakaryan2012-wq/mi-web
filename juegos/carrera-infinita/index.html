<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Carrera Infinita</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }

        body.claro {
            background: #f2f2f2;
            color: #111;
        }

        /* =========================
           BARRA SUPERIOR
        ========================= */

        .barra-superior {
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            background: #181818;
            border-bottom: 1px solid #333;
        }

        body.claro .barra-superior {
            background: white;
            border-bottom: 1px solid #ddd;
        }

        .izquierda {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .boton {
            border: none;
            border-radius: 10px;
            padding: 10px 14px;
            background: #292929;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        .boton:hover {
            background: #3a3a3a;
        }

        body.claro .boton {
            background: #e8e8e8;
            color: #111;
        }

        body.claro .boton:hover {
            background: #d8d8d8;
        }

        .derecha {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        select {
            background: #292929;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 10px;
            font-size: 14px;
            cursor: pointer;
        }

        body.claro select {
            background: #e8e8e8;
            color: #111;
        }

        /* =========================
           CONTENIDO
        ========================= */

        .contenedor {
            width: min(1000px, 94%);
            margin: auto;
            padding: 25px 0 50px;
            text-align: center;
        }

        h1 {
            margin: 5px 0 20px;
            font-size: 32px;
        }

        .descripcion {
            color: #aaa;
            margin-bottom: 20px;
        }

        body.claro .descripcion {
            color: #555;
        }

        /* =========================
           MARCADOR
        ========================= */

        .marcador {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .marcador-caja {
            min-width: 150px;
            padding: 12px 20px;
            border-radius: 12px;
            background: #1d1d1d;
            border: 1px solid #333;
        }

        body.claro .marcador-caja {
            background: white;
            border: 1px solid #ddd;
        }

        .marcador-titulo {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 4px;
        }

        body.claro .marcador-titulo {
            color: #666;
        }

        .marcador-valor {
            font-size: 25px;
            font-weight: bold;
        }

        /* =========================
           JUEGO
        ========================= */

        .zona-juego {
            position: relative;
            width: 390px;
            max-width: 100%;
            height: 600px;
            margin: auto;
            overflow: hidden;
            border-radius: 18px;
            background: #222;
            border: 4px solid #444;
            box-shadow: 0 15px 40px rgba(0,0,0,0.35);
        }

        body.claro .zona-juego {
            border-color: #aaa;
        }

        .carretera {
            position: absolute;
            inset: 0;
            background:
                linear-gradient(
                    90deg,
                    #252525 0%,
                    #303030 10%,
                    #303030 90%,
                    #252525 100%
                );
        }

        .linea-carril {
            position: absolute;
            top: -100px;
            bottom: -100px;
            width: 5px;
            border-radius: 10px;
            background: repeating-linear-gradient(
                to bottom,
                white 0px,
                white 50px,
                transparent 50px,
                transparent 100px
            );
            opacity: 0.45;
        }

        .linea1 {
            left: 33.33%;
        }

        .linea2 {
            left: 66.66%;
        }

        /* =========================
           JUGADOR
        ========================= */

        .jugador {
            position: absolute;
            width: 60px;
            height: 95px;
            bottom: 35px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            transition: left 0.12s ease;
        }

        .cabeza {
            position: absolute;
            width: 42px;
            height: 38px;
            left: 9px;
            top: 0;
            background: #d9d9d9;
            border: 3px solid #111;
            border-radius: 10px;
        }

        .ojo {
            position: absolute;
            width: 7px;
            height: 7px;
            top: 10px;
            background: #111;
            border-radius: 50%;
        }

        .ojo1 {
            left: 9px;
        }

        .ojo2 {
            right: 9px;
        }

        .antena {
            position: absolute;
            width: 4px;
            height: 15px;
            top: -14px;
            left: 28px;
            background: #aaa;
        }

        .antena-punta {
            position: absolute;
            width: 8px;
            height: 8px;
            top: -19px;
            left: 26px;
            background: #ff4040;
            border-radius: 50%;
        }

        .cuerpo {
            position: absolute;
            width: 48px;
            height: 45px;
            left: 6px;
            top: 35px;
            background: #3498db;
            border: 3px solid #111;
            border-radius: 10px;
        }

        .panel {
            position: absolute;
            width: 25px;
            height: 12px;
            left: 9px;
            top: 10px;
            background: #75d7ff;
            border-radius: 4px;
        }

        .brazo {
            position: absolute;
            width: 10px;
            height: 35px;
            top: 40px;
            background: #aaa;
            border: 2px solid #111;
            border-radius: 6px;
        }

        .brazo1 {
            left: -7px;
            transform: rotate(10deg);
        }

        .brazo2 {
            right: -7px;
            transform: rotate(-10deg);
        }

        .pierna {
            position: absolute;
            width: 13px;
            height: 25px;
            top: 76px;
            background: #777;
            border: 2px solid #111;
            border-radius: 5px;
        }

        .pierna1 {
            left: 13px;
        }

        .pierna2 {
            right: 13px;
        }

        /* =========================
           OBSTÁCULOS
        ========================= */

        .obstaculo {
            position: absolute;
            z-index: 5;
            transform: translateX(-50%);
        }

        .obstaculo-grande {
            width: 88px;
            height: 130px;
            background:
                repeating-linear-gradient(
                    135deg,
                    #e74c3c 0px,
                    #e74c3c 18px,
                    #222 18px,
                    #222 30px
                );
            border: 4px solid #111;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
        }

        .obstaculo-grande::after {
            content: "⚠";
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            color: white;
            text-shadow: 0 2px 4px black;
        }

        .obstaculo-barrera {
            width: 82px;
            height: 62px;
            background:
                repeating-linear-gradient(
                    135deg,
                    #f39c12 0px,
                    #f39c12 15px,
                    #222 15px,
                    #222 28px
                );
            border: 4px solid #111;
            border-radius: 8px;
        }

        .obstaculo-barrera::after {
            content: "!";
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
            font-weight: bold;
            color: white;
        }

        .obstaculo-caja {
            width: 76px;
            height: 62px;
            background: #8e44ad;
            border: 4px solid #111;
            border-radius: 8px;
            box-shadow: inset 0 0 0 5px #9b59b6;
        }

        .obstaculo-caja::after {
            content: "✕";
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: white;
        }

        /* =========================
           MONEDAS
        ========================= */

        .moneda {
            position: absolute;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            transform: translateX(-50%);
            z-index: 6;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            border: 3px solid rgba(0,0,0,0.5);
            box-shadow: 0 3px 8px rgba(0,0,0,0.4);
        }

        .moneda-bronce {
            background: #b87333;
            color: white;
        }

        .moneda-plata {
            background: #cfd3d6;
            color: #222;
        }

        .moneda-oro {
            background: #ffd700;
            color: #222;
        }

        /* =========================
           PANTALLAS
        ========================= */

        .pantalla-inicio,
        .pantalla-final {
            position: absolute;
            inset: 0;
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 25px;
            background: rgba(0,0,0,0.86);
        }

        .pantalla-final {
            display: none;
        }

        .pantalla-inicio h2,
        .pantalla-final h2 {
            font-size: 32px;
            margin: 0 0 12px;
        }

        .pantalla-inicio p,
        .pantalla-final p {
            color: #ccc;
            line-height: 1.5;
        }

        .boton-jugar {
            border: none;
            padding: 14px 28px;
            margin-top: 15px;
            border-radius: 12px;
            background: #2ecc71;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .boton-jugar:hover {
            background: #27ae60;
        }

        .resultado-final {
            font-size: 19px;
            line-height: 1.8;
            margin: 10px 0;
        }

        /* =========================
           RECORDS
        ========================= */

        .records {
            margin: 30px auto 0;
            max-width: 650px;
            text-align: left;
        }

        .records h2 {
            text-align: center;
            margin-bottom: 15px;
        }

        .tabla-records {
            width: 100%;
            border-collapse: collapse;
            overflow: hidden;
            border-radius: 12px;
            background: #1c1c1c;
        }

        body.claro .tabla-records {
            background: white;
        }

        .tabla-records th,
        .tabla-records td {
            padding: 12px 10px;
            text-align: center;
            border-bottom: 1px solid #333;
        }

        body.claro .tabla-records th,
        body.claro .tabla-records td {
            border-bottom: 1px solid #ddd;
        }

        .tabla-records th {
            background: #292929;
        }

        body.claro .tabla-records th {
            background: #e8e8e8;
        }

        .sin-records {
            text-align: center;
            color: #999;
            padding: 20px;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 500px) {
            .barra-superior {
                padding: 0 10px;
            }

            .boton {
                padding: 8px 10px;
                font-size: 13px;
            }

            select {
                padding: 8px;
                font-size: 13px;
            }

            .zona-juego {
                height: 560px;
            }

            h1 {
                font-size: 27px;
            }

            .tabla-records th,
            .tabla-records td {
                padding: 9px 5px;
                font-size: 13px;
            }
        }
    </style>
</head>

    <header class="barra-superior">

    <!-- =========================
         CONTENIDO
    ========================= -->

    <main class="contenedor">

        <h1 id="tituloJuego">
            🏃 Carrera Infinita

        <p

        <!-- MARCADOR -->

        <!-- =========================

        ========================= -->

        <div class="zona-juego" id="zonaJuego">

            <div class="carretera">

                <div class="linea-carril linea2"></div>

            </div>


            <!-- JUGADOR -->

            <div

                <div class="antena"></div>
                <div class="antena-punta"></div>

                <div class="cabeza">
                    <div class="ojo ojo1"></div>
                    <div class="ojo ojo2"></div>
                </div>

                <div class="cuerpo">
                    <div class="panel"></div>
                </div>

                <div class="brazo brazo1"></div>
                <div class="brazo brazo2"></div>

                <div class="pierna pierna1"></div>
                <div class="pierna pierna2"></div>

            </div>


            <!-- PANTALLA INICIAL -->

            <div
                class="pantalla-inicio"
                id="pantallaInicio"
            >

                <h2 id="tituloInicio">
                    🏃 ¡Prepárate!
                </h2>

                <p id="textoInicio">
                    Muévete entre los tres carriles,
                    esquiva los obstáculos y recoge monedas.
                </p>

                <p id="controlesInicio">
                    ← → o A / D
                </p>

                <button
                    class="boton-jugar"
                    onclick="iniciarJuego()"
                    id="botonJugar"
                >
                    ▶ Jugar
                </button>

            </div>


            <!-- PANTALLA FINAL -->

            <div
                class="pantalla-final"
                id="pantallaFinal"
            >

                <h2 id="tituloFinal">
                    💥 ¡Fin de la carrera!
                </h2>

                <div
                    class="resultado-final"
                    id="resultadoFinal"
                >
                    Puntos: 0<br>
                    Tiempo: 0.0 s
                </div>

                <button
                    class="boton-jugar"
                    onclick="iniciarJuego()"
                    id="botonReintentar"
                >
                    🔄 Jugar otra vez
                </button>

            </div>

        </div>


        <!-- =========================
             RECORDS
        ========================= -->

        <section class="records">

            <h2 id="tituloRecords">
                🏆 Récords
            </h2>

            <table class="tabla-records">

                <thead>

                    <tr>
                        <th>#</th>
                        <th id="cabeceraJugador">Jugador</th>
                        <th id="cabeceraPuntos">Puntos</th>
                        <th id="cabeceraTiempo">Tiempo</th>
                    </tr>

                </thead>

                <tbody id="tablaRecords">
                </tbody>

            </table>

        </section>

    </main>

        /* =====================================================
           USUARIO
        ===================================================== */

        function obtenerNumeroUsuario() {

            let numero =
                localStorage.getItem("numeroUsuario");

            if (!numero) {

                numero =
                    Math.floor(
                        Math.random() * 10000
                    );

                numero =
                    String(numero).padStart(4, "0");

                localStorage.setItem(
                    "numeroUsuario",
                    numero
                );
            }

            return numero;
        }


        function obtenerNombreUsuario() {

            let nombre =
                localStorage.getItem("nombreUsuario");

            if (!nombre) {

                nombre =
                    "user_" +
                    obtenerNumeroUsuario();

                localStorage.setItem(
                    "nombreUsuario",
                    nombre
                );
            }

            return nombre;
        }


        /* =====================================================
           TEMA
        ===================================================== */

        function aplicarTema() {

            const tema =
                localStorage.getItem("tema") ||
                "oscuro";

            if (tema === "claro") {

                document.body.classList.add("claro");

            } else {

                document.body.classList.remove("claro");

            }

            actualizarTextoTema();
        }


        function cambiarTema() {

            const temaActual =
                localStorage.getItem("tema") ||
                "oscuro";

            const nuevoTema =
                temaActual === "oscuro"
                    ? "claro"
                    : "oscuro";

            localStorage.setItem(
                "tema",
                nuevoTema
            );

            aplicarTema();
        }


        function actualizarTextoTema() {

            const tema =
                localStorage.getItem("tema") ||
                "oscuro";

            const idioma =
                localStorage.getItem("idioma") ||
                "es";

            const boton =
                document.getElementById("botonTema");

            if (idioma === "en") {

                boton.textContent =
                    tema === "oscuro"
                        ? "☀️ Light"
                        : "🌙 Dark";

            } else if (idioma === "hy") {

                boton.textContent =
                    tema === "oscuro"
                        ? "☀️ Բաց"
                        : "🌙 Մութ";

            } else {

                boton.textContent =
                    tema === "oscuro"
                        ? "☀️ Claro"
                        : "🌙 Oscuro";

            }

        }


        /* =====================================================
           IDIOMA
        ===================================================== */

        function aplicarIdioma() {

            const idioma =
                localStorage.getItem("idioma") ||
                "es";

            const t =
                textos[idioma] ||
                textos.es;


            document.getElementById(
                "selectorIdioma"
            ).value = idioma;


            document.getElementById(
                "tituloJuego"
            ).textContent =
                t.titulo;


            document.getElementById(
                "descripcionJuego"
            ).textContent =
                t.descripcion;


            document.getElementById(
                "botonVolver"
            ).textContent =
                t.volver;


            document.getElementById(
                "textoPuntos"
            ).textContent =
                t.puntos;


            document.getElementById(
                "textoTiempo"
            ).textContent =
                t.tiempo;


            document.getElementById(
                "tituloInicio"
            ).textContent =
                t.inicio;


            document.getElementById(
                "textoInicio"
            ).textContent =
                t.instrucciones;


            document.getElementById(
                "controlesInicio"
            ).textContent =
                t.controles;


            document.getElementById(
                "botonJugar"
            ).textContent =
                t.jugar;


            document.getElementById(
                "tituloFinal"
            ).textContent =
                t.final;


            document.getElementById(
                "botonReintentar"
            ).textContent =
                t.otraVez;


            document.getElementById(
                "tituloRecords"
            ).textContent =
                t.records;


            document.getElementById(
                "cabeceraJugador"
            ).textContent =
                t.jugador;


            document.getElementById(
                "cabeceraPuntos"
            ).textContent =
                t.puntos;


            document.getElementById(
                "cabeceraTiempo"
            ).textContent =
                t.tiempo;


            actualizarTextoTema();

            actualizarResultadoFinal();

            mostrarRecords();

        }


        function cambiarIdioma() {

            const idioma =
                document.getElementById(
                    "selectorIdioma"
                ).value;

            localStorage.setItem(
                "idioma",
                idioma
            );

            aplicarIdioma();

        }


        /* =====================================================
           POSICIONES DE CARRILES
        ===================================================== */

        function obtenerPosicionCarril(carril) {

            const ancho =
                zonaJuego.clientWidth;

            const posiciones = [

                ancho * 0.1666,

                ancho * 0.5,

                ancho * 0.8333

            ];

            return posiciones[carril];

        }


        function actualizarJugador() {

            jugador.style.left =
                obtenerPosicionCarril(
                    carrilJugador
                ) + "px";

        }


        /* =====================================================
           CAMBIO DE CARRIL
        ===================================================== */

        function moverIzquierda() {

            if (!jugando) return;

            if (carrilJugador > 0) {

                carrilJugador--;

                actualizarJugador();

            }
        }


        function moverDerecha() {

            if (!jugando) return;

            if (carrilJugador < 2) {

                carrilJugador++;

                actualizarJugador();

            }
        }


        document.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "ArrowLeft" ||
                    event.key.toLowerCase() === "a"
                ) {

                    moverIzquierda();

                }

                if (
                    event.key === "ArrowRight" ||
                    event.key.toLowerCase() === "d"
                ) {

                    moverDerecha();

                }

            }
        );


        /* =====================================================
           INICIAR JUEGO
        ===================================================== */

        function iniciarJuego() {

            limpiarJuego();

            jugando = true;

            puntosActuales = 0;

            tiempoActual = 0;

            velocidad = 4;

            carrilJugador = 1;

            contadorObstaculos = 0;

            contadorMonedas = 0;

            puntos.textContent = "0";

            tiempo.textContent = "0.0 s";

            actualizarJugador();


            document.getElementById(
                "pantallaInicio"
            ).style.display = "none";


            document.getElementById(
                "pantallaFinal"
            ).style.display = "none";


            tiempoInicio =
                performance.now();


            intervaloTiempo =
                setInterval(
                    actualizarTiempo,
                    50
                );


            intervaloJuego =
                setInterval(
                    actualizarJuego,
                    20
                );

        }


        /* =====================================================
           TIEMPO
        ===================================================== */

        function actualizarTiempo() {

            if (!jugando) return;

            tiempoActual =
                (performance.now() -
                    tiempoInicio) / 1000;

            const idioma =
                localStorage.getItem("idioma") ||
                "es";

            const unidad =
                textos[idioma].segundos;

            tiempo.textContent =
                tiempoActual.toFixed(1) +
                " " +
                unidad;

        }


        /* =====================================================
           ACTUALIZAR JUEGO
        ===================================================== */

        function actualizarJuego() {

            if (!jugando) return;


            moverElementos();


            if (
                Math.random() <
                0.012
            ) {

                crearObstaculo();

            }


            if (
                Math.random() <
                0.008
            ) {

                crearMoneda();

            }


            /* Aumentar velocidad cada cierto tiempo */

            velocidad =
                Math.min(
                    11,
                    4 +
                    Math.floor(
                        tiempoActual / 3
                    ) * 0.35
                );

        }


        /* =====================================================
           MOVER ELEMENTOS
        ===================================================== */

        function moverElementos() {

            const elementos =
                zonaJuego.querySelectorAll(
                    ".obstaculo, .moneda"
                );


            elementos.forEach(
                function(elemento) {

                    let top =
                        parseFloat(
                            elemento.style.top
                        );


                    if (
                        isNaN(top)
                    ) {

                        top = -150;

                    }


                    top += velocidad;


                    elemento.style.top =
                        top + "px";


                    if (
                        detectarColision(
                            elemento
                        )
                    ) {

                        if (
                            elemento.classList.contains(
                                "moneda"
                            )
                        ) {

                            recogerMoneda(
                                elemento
                            );

                        } else {

                            terminarJuego();

                        }

                    }


                    if (
                        top >
                        zonaJuego.clientHeight + 150
                    ) {

                        elemento.remove();

                    }

                }
            );

        }


        /* =====================================================
           CREAR OBSTÁCULO
        ===================================================== */

        function crearObstaculo() {

            const obstaculo =
                document.createElement("div");


            obstaculo.classList.add(
                "obstaculo"
            );


            const tipo =
                Math.floor(
                    Math.random() * 3
                );


            if (tipo === 0) {

                obstaculo.classList.add(
                    "obstaculo-grande"
                );

            } else if (tipo === 1) {

                obstaculo.classList.add(
                    "obstaculo-barrera"
                );

            } else {

                obstaculo.classList.add(
                    "obstaculo-caja"
                );

            }


            const carril =
                Math.floor(
                    Math.random() * 3
                );


            obstaculo.style.left =
                obtenerPosicionCarril(
                    carril
                ) + "px";


            obstaculo.style.top =
                "-150px";


            zonaJuego.appendChild(
                obstaculo
            );


            contadorObstaculos++;

        }


        /* =====================================================
           CREAR MONEDA
        ===================================================== */

        function crearMoneda() {

            const moneda =
                document.createElement("div");


            moneda.classList.add(
                "moneda"
            );


            const aleatorio =
                Math.random();


            let valor;


            if (aleatorio < 0.65) {

                moneda.classList.add(
                    "moneda-bronce"
                );

                moneda.textContent = "1";

                valor = 1;

            } else if (
                aleatorio < 0.90
            ) {

                moneda.classList.add(
                    "moneda-plata"
                );

                moneda.textContent = "5";

                valor = 5;

            } else {

                moneda.classList.add(
                    "moneda-oro"
                );

                moneda.textContent = "20";

                valor = 20;

            }


            moneda.dataset.valor =
                valor;


            const carril =
                Math.floor(
                    Math.random() * 3
                );


            moneda.style.left =
                obtenerPosicionCarril(
                    carril
                ) + "px";


            moneda.style.top =
                "-50px";


            zonaJuego.appendChild(
                moneda
            );


            contadorMonedas++;

        }


        /* =====================================================
           COLISIONES
        ===================================================== */

        function detectarColision(elemento) {

            const jugadorRect =
                jugador.getBoundingClientRect();

            const elementoRect =
                elemento.getBoundingClientRect();


            const margen = 8;


            return !(
                jugadorRect.right - margen <
                    elementoRect.left ||

                jugadorRect.left + margen >
                    elementoRect.right ||

                jugadorRect.bottom - margen <
                    elementoRect.top ||

                jugadorRect.top + margen >
                    elementoRect.bottom
            );

        }


        /* =====================================================
           RECOGER MONEDA
        ===================================================== */

        function recogerMoneda(moneda) {

            const valor =
                Number(
                    moneda.dataset.valor
                ) || 1;


            puntosActuales += valor;


            puntos.textContent =
                puntosActuales;


            moneda.remove();

        }


        /* =====================================================
           TERMINAR JUEGO
        ===================================================== */

        function terminarJuego() {

            if (!jugando) return;


            jugando = false;


            clearInterval(
                intervaloJuego
            );

            clearInterval(
                intervaloTiempo
            );


            actualizarTiempo();


            guardarEstadistica();


            actualizarResultadoFinal();


            document.getElementById(
                "pantallaFinal"
            ).style.display = "flex";


            mostrarRecords();

        }


        /* =====================================================
           RESULTADO FINAL
        ===================================================== */

        function actualizarResultadoFinal() {

            const elemento =
                document.getElementById(
                    "resultadoFinal"
                );


            if (!elemento) return;


            const idioma =
                localStorage.getItem("idioma") ||
                "es";


            const t =
                textos[idioma];


            elemento.innerHTML =
                t.puntos +
                ": <strong>" +
                puntosActuales +
                "</strong><br>" +

                t.tiempo +
                ": <strong>" +
                tiempoActual.toFixed(1) +
                " " +
                t.segundos +
                "</strong>";

        }


        /* =====================================================
           LIMPIAR JUEGO
        ===================================================== */

        function limpiarJuego() {

            clearInterval(
                intervaloJuego
            );

            clearInterval(
                intervaloTiempo
            );


            const elementos =
                zonaJuego.querySelectorAll(
                    ".obstaculo, .moneda"
                );


            elementos.forEach(
                function(elemento) {

                    elemento.remove();

                }
            );

        }


        /* =====================================================
           ESTADÍSTICAS
        ===================================================== */

        function obtenerEstadisticas() {

            let datos =
                localStorage.getItem(
                    estadisticasKey
                );


            if (!datos) {

                return {};

            }


            try {

                return JSON.parse(datos);

            } catch {

                return {};

            }

        }


        function guardarEstadistica() {

            const datos =
                obtenerEstadisticas();


            const nombre =
                obtenerNombreUsuario();


            if (
                !datos[nombre]
            ) {

                datos[nombre] = {

                    mejorPuntuacion:
                        puntosActuales,

                    mejorTiempo:
                        tiempoActual,

                    partidas: 1

                };

            } else {

                datos[nombre].partidas++;


                if (
                    puntosActuales >
                    datos[nombre].mejorPuntuacion
                ) {

                    datos[nombre].mejorPuntuacion =
                        puntosActuales;

                    datos[nombre].mejorTiempo =
                        tiempoActual;

                } else if (
                    puntosActuales ===
                    datos[nombre].mejorPuntuacion
                ) {

                    if (
                        tiempoActual >
                        datos[nombre].mejorTiempo
                    ) {

                        datos[nombre].mejorTiempo =
                            tiempoActual;

                    }

                }

            }


            localStorage.setItem(
                estadisticasKey,
                JSON.stringify(datos)
            );

        }


        /* =====================================================
           RECORDS
        ===================================================== */

        function mostrarRecords() {

            const tabla =
                document.getElementById(
                    "tablaRecords"
                );


            tabla.innerHTML = "";


            const datos =
                obtenerEstadisticas();


            const jugadores =
                Object.keys(datos);


            const idioma =
                localStorage.getItem("idioma") ||
                "es";


            const t =
                textos[idioma];


            if (
                jugadores.length === 0
            ) {

                tabla.innerHTML =
                    '<tr><td colspan="4" class="sin-records">' +
                    t.sinRecords +
                    "</td></tr>";

                return;

            }


            jugadores.sort(
                function(a, b) {

                    const puntosA =
                        datos[a].mejorPuntuacion || 0;

                    const puntosB =
                        datos[b].mejorPuntuacion || 0;


                    if (
                        puntosB !== puntosA
                    ) {

                        return puntosB -
                            puntosA;

                    }


                    const tiempoA =
                        datos[a].mejorTiempo || 0;

                    const tiempoB =
                        datos[b].mejorTiempo || 0;


                    return tiempoB -
                        tiempoA;

                }
            );


            const top =
                jugadores.slice(0, 10);


            top.forEach(
                function(nombre, indice) {

                    const jugadorDatos =
                        datos[nombre];


                    const fila =
                        document.createElement("tr");


                    fila.innerHTML =

                        "<td>" +
                        (indice + 1) +
                        "</td>" +

                        "<td>" +
                        escaparHTML(nombre) +
                        "</td>" +

                        "<td>" +
                        (jugadorDatos.mejorPuntuacion || 0) +
                        "</td>" +

                        "<td>" +
                        (
                            jugadorDatos.mejorTiempo ||
                            0
                        ).toFixed(1) +
                        " " +
                        t.segundos +
                        "</td>";


                    tabla.appendChild(
                        fila
                    );

                }
            );

        }


        /* =====================================================
           SEGURIDAD DEL NOMBRE
        ===================================================== */

        function escaparHTML(texto) {

            const div =
                document.createElement("div");

            div.textContent =
                texto;

            return div.innerHTML;

        }


        /* =====================================================
           VOLVER
        ===================================================== */

        function volverInicio() {

            window.location.href =
                "../../index.html";

        }


        /* =====================================================
           INICIO
        ===================================================== */

        aplicarTema();

        aplicarIdioma();

        actualizarJugador();

        mostrarRecords();

    </script>

</body>
</html>
