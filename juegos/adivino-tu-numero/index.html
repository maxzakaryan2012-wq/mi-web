<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🧠 Adivino tu número</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f2f2f2;
    color:#222;
    transition:0.3s;
}

body.oscuro{
    background:#111;
    color:#fff;
}


/* ================================
   CONTENEDOR
================================ */

.contenedor{
    width:100%;
    max-width:1200px;
    margin:0 auto;
    padding:25px;
}


/* ================================
   CABECERA
================================ */

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:25px;
    flex-wrap:wrap;
}

header h1{
    margin:0;
    font-size:32px;
}

.botones-header{
    display:flex;
    gap:8px;
}


/* ================================
   BOTONES GENERALES
================================ */

button{
    border:none;
    border-radius:10px;
    padding:12px 18px;
    font-size:16px;
    cursor:pointer;
    background:#ddd;
    color:#222;
    transition:0.2s;
}

button:hover{
    transform:scale(1.03);
    background:#cfcfcf;
}

button:disabled{
    opacity:0.5;
    cursor:not-allowed;
    transform:none;
}

.oscuro button{
    background:#333;
    color:#fff;
}

.oscuro button:hover{
    background:#444;
}


/* ================================
   BOTÓN VOLVER
================================ */

.volver{
    display:inline-block;
    text-decoration:none;
    background:#ddd;
    color:#222;
    padding:12px 18px;
    border-radius:10px;
    font-size:16px;
    transition:0.2s;
}

.volver:hover{
    background:#cfcfcf;
    transform:scale(1.03);
}

.oscuro .volver{
    background:#333;
    color:#fff;
}

.oscuro .volver:hover{
    background:#444;
}


/* ================================
   JUEGO
================================ */

.juego{
    width:100%;
    min-height:520px;
    background:#fff;
    border-radius:20px;
    padding:45px;
    box-shadow:0 5px 20px rgba(0,0,0,0.12);
    text-align:center;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.oscuro .juego{
    background:#1d1d1d;
}

.instrucciones{
    font-size:19px;
    margin-bottom:30px;
}


/* ================================
   NOMBRE
================================ */

.nombre{
    margin-bottom:20px;
}

.nombre input{
    width:260px;
    max-width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid #bbb;
    font-size:16px;
    text-align:center;
    outline:none;
}

.oscuro .nombre input{
    background:#292929;
    color:#fff;
    border-color:#555;
}


/* ================================
   NÚMERO
================================ */

.numero{
    font-size:90px;
    font-weight:bold;
    margin:20px 0;
    letter-spacing:2px;
}

.rango{
    font-size:18px;
    color:#666;
    margin-bottom:30px;
}

.oscuro .rango{
    color:#aaa;
}


/* ================================
   BOTONES DEL JUEGO
================================ */

.botones{
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
}

.botones button{
    min-width:170px;
    background:#333;
    color:white;
}

.botones button:hover{
    background:#555;
}

.oscuro .botones button{
    background:#555;
}

.oscuro .botones button:hover{
    background:#666;
}


/* ================================
   INTENTOS
================================ */

.intentos{
    margin-top:30px;
    font-size:20px;
    font-weight:bold;
}


/* ================================
   MENSAJE
================================ */

.mensaje{
    margin-top:20px;
    font-size:21px;
    font-weight:bold;
    min-height:25px;
}


/* ================================
   REINICIAR
================================ */

.reiniciar{
    margin:20px auto 0;
    background:#222;
    color:white;
    display:none;
}

.reiniciar:hover{
    background:#444;
}

.oscuro .reiniciar{
    background:#eee;
    color:#111;
}

.oscuro .reiniciar:hover{
    background:#ccc;
}


/* ================================
   ESTADÍSTICAS
================================ */

.estadisticas{
    width:100%;
    margin-top:30px;
    background:#fff;
    border-radius:20px;
    padding:30px;
    box-shadow:0 5px 20px rgba(0,0,0,0.12);
}

.oscuro .estadisticas{
    background:#1d1d1d;
}

.estadisticas h2{
    margin-top:0;
    margin-bottom:20px;
}


/* ================================
   TABLA
================================ */

table{
    width:100%;
    border-collapse:collapse;
}

th,
td{
    padding:13px 10px;
    border-bottom:1px solid #ddd;
    text-align:center;
}

.oscuro th,
.oscuro td{
    border-bottom:1px solid #444;
}

th{
    font-weight:bold;
}

.tu-fila{
    font-weight:bold;
    background:#e8e8e8;
}

.oscuro .tu-fila{
    background:#303030;
}

.sin-datos{
    opacity:0.7;
}

.posicion{
    margin-top:18px;
    font-weight:bold;
}


/* ================================
   MÓVIL
================================ */

@media(max-width:700px){

    .contenedor{
        padding:15px;
    }

    header h1{
        font-size:26px;
    }

    .juego{
        min-height:500px;
        padding:25px 15px;
    }

    .numero{
        font-size:65px;
    }

    .botones{
        flex-direction:column;
        width:100%;
    }

    .botones button{
        width:100%;
    }

    table{
        font-size:14px;
    }

    th,
    td{
        padding:9px 4px;
    }

}

</style>

</head>


<body>


<div class="contenedor">


<header>

<h1 id="titulo">
    🧠 Adivino tu número
</h1>


<div class="botones-header">

<a
    href="../../index.html"
    class="volver"
    id="volverBtn"
>
    ← Volver
</a>

<button id="idiomaBtn">
    🇪🇸
</button>

<button id="temaBtn">
    🌙
</button>

</div>

</header>



<!-- ================================
     JUEGO
================================ -->

<div class="juego">


<div
    class="instrucciones"
    id="instrucciones"
>
    Piensa un número del 1 al 100 y yo intentaré adivinarlo.
</div>



<div class="nombre">

<input
    type="text"
    id="nombreInput"
    placeholder="Tu nombre"
    maxlength="20"
>

</div>



<div
    class="numero"
    id="numeroActual"
>
    50
</div>



<div
    class="rango"
    id="rango"
>
    Estoy buscando entre 1 y 100
</div>



<div class="botones">

<button
    id="menorBtn"
>
    ⬇️ Es menor
</button>


<button
    id="correctoBtn"
>
    ✓ Correcto
</button>


<button
    id="mayorBtn"
>
    ⬆️ Es mayor
</button>

</div>



<div class="intentos">

<span id="textoIntentos">
    Intentos:
</span>

<span id="intentos">
    1
</span>

</div>



<div
    class="mensaje"
    id="mensaje"
></div>



<button
    class="reiniciar"
    id="reiniciarBtn"
>
    🔄 Volver a jugar
</button>


</div>



<!-- ================================
     ESTADÍSTICAS
================================ -->

<div class="estadisticas">


<h2 id="tituloRanking">
    🏆 Ranking
</h2>


<table>

<thead>

<tr>

<th>
    #
</th>

<th id="nombreColumna">
    Nombre
</th>

<th id="intentosColumna">
    Mejor partida
</th>

<th id="partidasColumna">
    Partidas ganadas
</th>

</tr>

</thead>


<tbody id="rankingBody">
</tbody>

</table>


<div
    class="posicion"
    id="posicionUsuario"
></div>


</div>


</div>



<script>


/* =====================================================
   CONFIGURACIÓN
===================================================== */

const ESTADISTICAS_KEY =
    "estadisticasAdivinoNumero";


/* =====================================================
   IDIOMAS
===================================================== */

const idiomas = {

es:{

titulo:
"🧠 Adivino tu número",

instrucciones:
"Piensa un número del 1 al 100 y yo intentaré adivinarlo.",

nombre:
"Tu nombre",

volver:
"← Volver",

menor:
"⬇️ Es menor",

correcto:
"✓ Correcto",

mayor:
"⬆️ Es mayor",

intentos:
"Intentos:",

rango:
"Estoy buscando entre {min} y {max}",

ranking:
"🏆 Ranking",

nombreColumna:
"Nombre",

intentosColumna:
"Mejor partida",

partidasColumna:
"Partidas ganadas",

sinDatos:
"Todavía no hay partidas.",

posicion:
"Tu posición: #{pos}",

victoria:
"🎉 ¡Lo he adivinado en {intentos} intentos!",

reiniciar:
"🔄 Volver a jugar"

},


en:{

titulo:
"🧠 I Guess Your Number",

instrucciones:
"Think of a number from 1 to 100 and I will try to guess it.",

nombre:
"Your name",

volver:
"← Back",

menor:
"⬇️ Lower",

correcto:
"✓ Correct",

mayor:
"⬆️ Higher",

intentos:
"Attempts:",

rango:
"I'm searching between {min} and {max}",

ranking:
"🏆 Ranking",

nombreColumna:
"Name",

intentosColumna:
"Best game",

partidasColumna:
"Games won",

sinDatos:
"There are no games yet.",

posicion:
"Your position: #{pos}",

victoria:
"🎉 I guessed it in {intentos} attempts!",

reiniciar:
"🔄 Play again"

},


hy:{

titulo:
"🧠 Գուշակում եմ քո թիվը",

instrucciones:
"Մտածիր 1-ից 100 թիվ, և ես կփորձեմ գուշակել այն։",

nombre:
"Քո անունը",

volver:
"← Հետ",

menor:
"⬇️ Ավելի փոքր է",

correcto:
"✓ Ճիշտ է",

mayor:
"⬆️ Ավելի մեծ է",

intentos:
"Փորձեր:",

rango:
"Փնտրում եմ {min}-ից մինչև {max}",

ranking:
"🏆 Վարկանիշ",

nombreColumna:
"Անուն",

intentosColumna:
"Լավագույն խաղ",

partidasColumna:
"Հաղթած խաղեր",

sinDatos:
"Դեռ խաղեր չկան։",

posicion:
"Քո դիրքը՝ #{pos}",

victoria:
"🎉 Գուշակեցի {intentos} փորձից հետո։",

reiniciar:
"🔄 Նորից խաղալ"

}

};


/* =====================================================
   ELEMENTOS
===================================================== */

const numeroActual =
document.getElementById("numeroActual");

const rango =
document.getElementById("rango");

const intentosElemento =
document.getElementById("intentos");

const mensaje =
document.getElementById("mensaje");

const reiniciarBtn =
document.getElementById("reiniciarBtn");

const menorBtn =
document.getElementById("menorBtn");

const correctoBtn =
document.getElementById("correctoBtn");

const mayorBtn =
document.getElementById("mayorBtn");

const nombreInput =
document.getElementById("nombreInput");

const rankingBody =
document.getElementById("rankingBody");

const posicionUsuario =
document.getElementById("posicionUsuario");

const idiomaBtn =
document.getElementById("idiomaBtn");

const temaBtn =
document.getElementById("temaBtn");

const volverBtn =
document.getElementById("volverBtn");


/* =====================================================
   ESTADO
===================================================== */

let minimo = 1;

let maximo = 100;

let numeroAdivinado = 1;

let intentos = 1;

let terminado = false;


/* =====================================================
   IDIOMA
===================================================== */

let idioma =
localStorage.getItem("idioma") || "es";


function aplicarIdioma(){

    const t =
    idiomas[idioma];


    document.getElementById("titulo")
    .textContent =
    t.titulo;


    document.getElementById("instrucciones")
    .textContent =
    t.instrucciones;


    nombreInput.placeholder =
    t.nombre;


    volverBtn.textContent =
    t.volver;


    menorBtn.textContent =
    t.menor;


    correctoBtn.textContent =
    t.correcto;


    mayorBtn.textContent =
    t.mayor;


    document.getElementById(
        "textoIntentos"
    ).textContent =
    t.intentos;


    document.getElementById(
        "tituloRanking"
    ).textContent =
    t.ranking;


    document.getElementById(
        "nombreColumna"
    ).textContent =
    t.nombreColumna;


    document.getElementById(
        "intentosColumna"
    ).textContent =
    t.intentosColumna;


    document.getElementById(
        "partidasColumna"
    ).textContent =
    t.partidasColumna;


    reiniciarBtn.textContent =
    t.reiniciar;


    idiomaBtn.textContent =
    idioma === "es"
    ? "🇪🇸"
    : idioma === "en"
    ? "🇬🇧"
    : "🇦🇲";


    actualizarRango();

    mostrarRanking();

}


idiomaBtn.addEventListener(
"click",
()=>{

    if(idioma === "es"){

        idioma = "en";

    }
    else if(idioma === "en"){

        idioma = "hy";

    }
    else{

        idioma = "es";

    }


    localStorage.setItem(
        "idioma",
        idioma
    );


    aplicarIdioma();

});


/* =====================================================
   TEMA
===================================================== */

let tema =
localStorage.getItem("tema") || "claro";


function aplicarTema(){

    if(tema === "oscuro"){

        document.body.classList.add(
            "oscuro"
        );

        temaBtn.textContent =
        "☀️";

    }
    else{

        document.body.classList.remove(
            "oscuro"
        );

        temaBtn.textContent =
        "🌙";

    }

}


temaBtn.addEventListener(
"click",
()=>{

    tema =
    tema === "claro"
    ? "oscuro"
    : "claro";


    localStorage.setItem(
        "tema",
        tema
    );


    aplicarTema();

});


/* =====================================================
   NOMBRE
===================================================== */

function obtenerNombreUsuario(){

    let nombre =
    nombreInput.value.trim();


    if(nombre){

        localStorage.setItem(
            "nombreUsuario",
            nombre
        );

        return nombre;

    }


    nombre =
    localStorage.getItem(
        "nombreUsuario"
    );


    if(nombre){

        return nombre;

    }


    const numero =
    localStorage.getItem(
        "numeroUsuario"
    );


    if(numero){

        return "Jugador " + numero;

    }


    return "Jugador";

}


/* =====================================================
   ESTADÍSTICAS
===================================================== */

function obtenerEstadisticas(){

    try{

        const datos =
        JSON.parse(
            localStorage.getItem(
                ESTADISTICAS_KEY
            )
        );


        if(Array.isArray(datos)){

            return datos;

        }

    }
    catch(e){}


    return [];

}


function guardarEstadisticas(
datos
){

    localStorage.setItem(
        ESTADISTICAS_KEY,
        JSON.stringify(datos)
    );

}


/* =====================================================
   ORDENAR
===================================================== */

function ordenarRanking(
datos
){

    return datos.sort(
        (a,b)=>{

            if(
                a.mejorIntentos !==
                b.mejorIntentos
            ){

                return (
                    a.mejorIntentos -
                    b.mejorIntentos
                );

            }


            if(
                a.partidas !==
                b.partidas
            ){

                return (
                    b.partidas -
                    a.partidas
                );

            }


            return a.nombre.localeCompare(
                b.nombre
            );

        }
    );

}


/* =====================================================
   RANKING
===================================================== */

function mostrarRanking(){

    const datos =
    ordenarRanking(
        obtenerEstadisticas()
    );


    rankingBody.innerHTML =
    "";


    const t =
    idiomas[idioma];


    if(datos.length === 0){

        rankingBody.innerHTML =
        `<tr>
            <td colspan="4"
                class="sin-datos">
                ${t.sinDatos}
            </td>
        </tr>`;


        posicionUsuario.textContent =
        "";

        return;

    }


    const nombreActual =
    obtenerNombreUsuario();


    datos
    .slice(0,10)
    .forEach(
        (jugador,index)=>{

            const fila =
            document.createElement(
                "tr"
            );


            if(
                jugador.nombre ===
                nombreActual
            ){

                fila.classList.add(
                    "tu-fila"
                );

            }


            fila.innerHTML = `
                <td>${index + 1}</td>
                <td>${jugador.nombre}</td>
                <td>${jugador.mejorIntentos}</td>
                <td>${jugador.partidas}</td>
            `;


            rankingBody.appendChild(
                fila
            );

        }
    );


    const posicion =
    datos.findIndex(
        jugador =>
        jugador.nombre ===
        nombreActual
    );


    if(posicion >= 10){

        posicionUsuario.textContent =
        t.posicion.replace(
            "{pos}",
            posicion + 1
        );

    }
    else{

        posicionUsuario.textContent =
        "";

    }

}


/* =====================================================
   RANGO
===================================================== */

function actualizarRango(){

    const t =
    idiomas[idioma];


    rango.textContent =
    t.rango
    .replace(
        "{min}",
        minimo
    )
    .replace(
        "{max}",
        maximo
    );

}


/* =====================================================
   NÚMERO ALEATORIO
===================================================== */

function generarNumero(){

    if(minimo > maximo){

        return;

    }


    /*
        Elegimos un número completamente
        aleatorio dentro del rango actual.
    */

    numeroAdivinado =
    Math.floor(
        Math.random() *
        (maximo - minimo + 1)
    ) + minimo;


    numeroActual.textContent =
    numeroAdivinado;


    actualizarRango();

}


/* =====================================================
   INICIAR
===================================================== */

function iniciarJuego(){

    minimo = 1;

    maximo = 100;

    intentos = 1;

    terminado = false;

    mensaje.textContent =
    "";

    reiniciarBtn.style.display =
    "none";


    menorBtn.disabled =
    false;

    correctoBtn.disabled =
    false;

    mayorBtn.disabled =
    false;


    intentosElemento.textContent =
    intentos;


    generarNumero();

}


/* =====================================================
   ES MENOR
===================================================== */

menorBtn.addEventListener(
"click",
()=>{

    if(terminado){

        return;

    }


    maximo =
    numeroAdivinado - 1;


    intentos++;


    intentosElemento.textContent =
    intentos;


    if(minimo > maximo){

        mensaje.textContent =
        "🤔 Algo no cuadra.";

        return;

    }


    generarNumero();

});


/* =====================================================
   ES MAYOR
===================================================== */

mayorBtn.addEventListener(
"click",
()=>{

    if(terminado){

        return;

    }


    minimo =
    numeroAdivinado + 1;


    intentos++;


    intentosElemento.textContent =
    intentos;


    if(minimo > maximo){

        mensaje.textContent =
        "🤔 Algo no cuadra.";

        return;

    }


    generarNumero();

});


/* =====================================================
   CORRECTO
===================================================== */

correctoBtn.addEventListener(
"click",
()=>{

    if(terminado){

        return;

    }


    terminado = true;


    menorBtn.disabled =
    true;

    correctoBtn.disabled =
    true;

    mayorBtn.disabled =
    true;


    const t =
    idiomas[idioma];


    mensaje.textContent =
    t.victoria.replace(
        "{intentos}",
        intentos
    );


    reiniciarBtn.style.display =
    "block";


    const nombre =
    obtenerNombreUsuario();


    const datos =
    obtenerEstadisticas();


    let jugador =
    datos.find(
        j =>
        j.nombre ===
        nombre
    );


    if(!jugador){

        jugador = {

            nombre:
            nombre,

            mejorIntentos:
            intentos,

            partidas:
            1

        };


        datos.push(
            jugador
        );

    }
    else{

        jugador.partidas++;


        if(
            intentos <
            jugador.mejorIntentos
        ){

            jugador.mejorIntentos =
            intentos;

        }

    }


    guardarEstadisticas(
        datos
    );


    mostrarRanking();

});


/* =====================================================
   REINICIAR
===================================================== */

reiniciarBtn.addEventListener(
"click",
iniciarJuego
);


/* =====================================================
   INICIO
===================================================== */

const nombreGuardado =
localStorage.getItem(
    "nombreUsuario"
);


if(nombreGuardado){

    nombreInput.value =
    nombreGuardado;

}


aplicarTema();

aplicarIdioma();

iniciarJuego();

</script>

</body>
</html>
