<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Adivino tu número</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f2f2f2;
            color: #222;
            transition: 0.2s;
        }

        body.oscuro {
            background: #181818;
            color: #eee;
        }

        header {
            width: 100%;
            height: 70px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 30px;

            border-bottom: 1px solid #ccc;

            background: #fff;
        }

        body.oscuro header {
            background: #222;
            border-color: #444;
        }

        .volver {
            text-decoration: none;
            color: #222;

            font-size: 17px;
            font-weight: bold;

            padding: 10px 16px;

            border: 1px solid #bbb;
            border-radius: 8px;

            background: #eee;
        }

        .volver:hover {
            background: #ddd;
        }

        body.oscuro .volver {
            color: #eee;
            background: #333;
            border-color: #555;
        }

        .controles {
            display: flex;
            gap: 8px;
        }

        .control {
            border: 1px solid #aaa;
            background: #eee;
            color: #222;

            padding: 9px 13px;

            border-radius: 8px;

            cursor: pointer;

            font-size: 15px;
        }

        .control:hover {
            background: #ddd;
        }

        body.oscuro .control {
            background: #333;
            color: #eee;
            border-color: #555;
        }

        main {
            width: 100%;
            max-width: 1100px;

            margin: 35px auto;

            padding: 0 20px;
        }

        .titulo {
            text-align: center;
            margin-bottom: 25px;
        }

        .titulo h1 {
            margin: 0 0 8px;
            font-size: 34px;
        }

        .titulo p {
            margin: 0;
            color: #666;
            font-size: 17px;
        }

        body.oscuro .titulo p {
            color: #aaa;
        }

        /*
        =====================================================
        PANTALLA DEL JUEGO
        =====================================================
        */

        .juego {
            width: 100%;

            background: #fff;

            border: 1px solid #ccc;
            border-radius: 14px;

            padding: 35px;

            min-height: 420px;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;
        }

        body.oscuro .juego {
            background: #222;
            border-color: #444;
        }

        .mensaje {
            font-size: 25px;
            font-weight: bold;

            margin-bottom: 25px;
        }

        .numero {
            font-size: 60px;
            font-weight: bold;

            margin: 15px 0 30px;
        }

        .rango {
            font-size: 17px;

            color: #666;

            margin-bottom: 25px;
        }

        body.oscuro .rango {
            color: #aaa;
        }

        .botones {
            display: flex;

            justify-content: center;
            align-items: center;

            gap: 12px;

            flex-wrap: wrap;
        }

        .boton {
            border: none;

            background: #333;
            color: white;

            padding: 14px 22px;

            border-radius: 8px;

            cursor: pointer;

            font-size: 16px;
            font-weight: bold;

            min-width: 150px;
        }

        .boton:hover {
            background: #111;
        }

        body.oscuro .boton {
            background: #ddd;
            color: #222;
        }

        body.oscuro .boton:hover {
            background: #fff;
        }

        .reiniciar {
            margin-top: 25px;

            background: #eee;
            color: #222;

            border: 1px solid #aaa;

            padding: 10px 18px;

            border-radius: 8px;

            cursor: pointer;

            font-size: 15px;
        }

        .reiniciar:hover {
            background: #ddd;
        }

        body.oscuro .reiniciar {
            background: #333;
            color: #eee;
            border-color: #555;
        }

        /*
        =====================================================
        ESTADÍSTICAS
        =====================================================
        */

        .estadisticas {
            margin-top: 35px;

            background: #fff;

            border: 1px solid #ccc;
            border-radius: 14px;

            padding: 25px;
        }

        body.oscuro .estadisticas {
            background: #222;
            border-color: #444;
        }

        .estadisticas h2 {
            margin-top: 0;

            text-align: center;
        }

        table {
            width: 100%;

            border-collapse: collapse;

            margin-top: 20px;
        }

        th,
        td {
            padding: 12px;

            border-bottom: 1px solid #ccc;

            text-align: center;
        }

        body.oscuro th,
        body.oscuro td {
            border-color: #444;
        }

        th {
            background: #eee;
        }

        body.oscuro th {
            background: #333;
        }

        .tu-fila {
            font-weight: bold;
            background: #e5e5e5;
        }

        body.oscuro .tu-fila {
            background: #333;
        }

        /*
        =====================================================
        RESPONSIVE
        =====================================================
        */

        @media (max-width: 700px) {

            header {
                padding: 0 15px;
            }

            main {
                margin-top: 20px;

                padding: 0 10px;
            }

            .juego {
                padding: 25px 15px;

                min-height: 400px;
            }

            .numero {
                font-size: 48px;
            }

            .boton {
                width: 100%;
            }

            .botones {
                width: 100%;
            }

            .estadisticas {
                padding: 15px;
            }

        }

    </style>
</head>

<body>

<header>

    <a
        href="../../index.html"
        class="volver"
        id="volverBtn"
    >
        ← Volver
    </a>

    <div class="controles">

        <button
            class="control"
            id="idiomaBtn"
        >
            🇪🇸 ES
        </button>

        <button
            class="control"
            id="temaBtn"
        >
            🌙
        </button>

    </div>

</header>


<main>

    <div class="titulo">

        <h1 id="tituloJuego">
            🧠 Adivino tu número
        </h1>

        <p id="descripcionJuego">
            Piensa un número y trataré de adivinarlo.
        </p>

    </div>


    <!-- =====================================================
         JUEGO
    ====================================================== -->

    <section class="juego">

        <div
            class="mensaje"
            id="mensaje"
        >
            Piensa un número del 1 al 100
        </div>


        <div
            class="numero"
            id="numero"
        >
            ¿Listo?
        </div>


        <div
            class="rango"
            id="rango"
        >
            Cuando estés preparado, pulsa comenzar.
        </div>


        <div class="botones">

            <button
                class="boton"
                id="menorBtn"
                style="display:none;"
            >
                ⬇️ Es menor
            </button>

            <button
                class="boton"
                id="correctoBtn"
                style="display:none;"
            >
                ✓ Correcto
            </button>

            <button
                class="boton"
                id="mayorBtn"
                style="display:none;"
            >
                ⬆️ Es mayor
            </button>

        </div>


        <button
            class="boton"
            id="comenzarBtn"
        >
            🧠 Comenzar
        </button>


        <button
            class="reiniciar"
            id="reiniciarBtn"
            style="display:none;"
        >
            🔄 Nueva partida
        </button>

    </section>


    <!-- =====================================================
         ESTADÍSTICAS
    ====================================================== -->

    <section class="estadisticas">

        <h2 id="estadisticasTitulo">
            🏆 Estadísticas
        </h2>

        <table>

            <thead>

                <tr>

                    <th>
                        #
                    </th>

                    <th>
                        Jugador
                    </th>

                    <th id="intentosColumna">
                        Mejor partida
                    </th>

                    <th id="partidasColumna">
                        Partidas ganadas
                    </th>

                </tr>

            </thead>

            <tbody id="ranking">

            </tbody>

        </table>

    </section>

</main>


<script>

    /* =====================================================
       IDIOMAS
    ===================================================== */

    const idiomas = {

        es: {

            titulo: "🧠 Adivino tu número",

            descripcion:
                "Piensa un número y trataré de adivinarlo.",

            volver:
                "← Volver",

            comenzar:
                "🧠 Comenzar",

            nueva:
                "🔄 Nueva partida",

            piensa:
                "Piensa un número del 1 al 100",

            listo:
                "Cuando estés preparado, pulsa comenzar.",

            menor:
                "⬇️ Es menor",

            correcto:
                "✓ Correcto",

            mayor:
                "⬆️ Es mayor",

            estadisticas:
                "🏆 Estadísticas",

            jugador:
                "Jugador",

            mejor:
                "Mejor partida",

            partidas:
                "Partidas ganadas",

            numero:
                "Creo que tu número es",

            acierto:
                "¡He acertado! 🎉",

            intentos:
                "Intentos"

        },


        en: {

            titulo: "🧠 I Guess Your Number",

            descripcion:
                "Think of a number and I will try to guess it.",

            volver:
                "← Back",

            comenzar:
                "🧠 Start",

            nueva:
                "🔄 New game",

            piensa:
                "Think of a number from 1 to 100",

            listo:
                "When you're ready, press start.",

            menor:
                "⬇️ Lower",

            correcto:
                "✓ Correct",

            mayor:
                "⬆️ Higher",

            estadisticas:
                "🏆 Statistics",

            jugador:
                "Player",

            mejor:
                "Best game",

            partidas:
                "Games won",

            numero:
                "I think your number is",

            acierto:
                "I got it! 🎉",

            intentos:
                "Attempts"

        },


        hy: {

            titulo: "🧠 Գուշակում եմ քո թիվը",

            descripcion:
                "Մտածիր թիվ և ես կփորձեմ գուշակել այն։",

            volver:
                "← Վերադառնալ",

            comenzar:
                "🧠 Սկսել",

            nueva:
                "🔄 Նոր խաղ",

            piensa:
                "Մտածիր 1-ից 100 թիվ",

            listo:
                "Երբ պատրաստ լինես, սեղմիր սկսելու կոճակը։",

            menor:
                "⬇️ Ավելի փոքր է",

            correcto:
                "✓ Ճիշտ է",

            mayor:
                "⬆️ Ավելի մեծ է",

            estadisticas:
                "🏆 Վիճակագրություն",

            jugador:
                "Խաղացող",

            mejor:
                "Լավագույն խաղ",

            partidas:
                "Հաղթած խաղեր",

            numero:
                "Կարծում եմ՝ քո թիվը",

            acierto:
                "Գուշակեցի! 🎉",

            intentos:
                "Փորձեր"

        }

    };


    /* =====================================================
       ELEMENTOS
    ===================================================== */

    const mensaje =
        document.getElementById("mensaje");

    const numero =
        document.getElementById("numero");

    const rango =
        document.getElementById("rango");

    const comenzarBtn =
        document.getElementById("comenzarBtn");

    const menorBtn =
        document.getElementById("menorBtn");

    const correctoBtn =
        document.getElementById("correctoBtn");

    const mayorBtn =
        document.getElementById("mayorBtn");

    const reiniciarBtn =
        document.getElementById("reiniciarBtn");

    const ranking =
        document.getElementById("ranking");

    const idiomaBtn =
        document.getElementById("idiomaBtn");

    const temaBtn =
        document.getElementById("temaBtn");


    /* =====================================================
       ESTADÍSTICAS
    ===================================================== */

    const ESTADISTICAS_KEY =
        "estadisticasAdivinoTuNumero";


    function obtenerNombreUsuario() {

        let nombre =
            localStorage.getItem("nombreUsuario");

        if (nombre) {
            return nombre;
        }

        let numeroUsuario =
            localStorage.getItem("numeroUsuario");

        if (!numeroUsuario) {

            numeroUsuario =
                Math.floor(
                    1000 +
                    Math.random() * 9000
                );

            localStorage.setItem(
                "numeroUsuario",
                numeroUsuario
            );

        }

        return "Jugador " + numeroUsuario;

    }


    function obtenerEstadisticas() {

        try {

            const datos =
                localStorage.getItem(
                    ESTADISTICAS_KEY
                );

            if (!datos) {
                return [];
            }

            const resultado =
                JSON.parse(datos);

            return Array.isArray(resultado)
                ? resultado
                : [];

        } catch {

            return [];

        }

    }


    function guardarEstadisticas(datos) {

        localStorage.setItem(
            ESTADISTICAS_KEY,
            JSON.stringify(datos)
        );

    }


    /* =====================================================
       RANKING
    ===================================================== */

    function mostrarRanking() {

        const datos =
            obtenerEstadisticas();

        datos.sort((a, b) => {

            if (
                a.mejorIntentos !==
                b.mejorIntentos
            ) {

                return (
                    a.mejorIntentos -
                    b.mejorIntentos
                );

            }

            if (
                a.partidas !==
                b.partidas
            ) {

                return (
                    b.partidas -
                    a.partidas
                );

            }

            return a.nombre.localeCompare(
                b.nombre
            );

        });


        ranking.innerHTML = "";


        const nombreUsuario =
            obtenerNombreUsuario();


        datos
            .slice(0, 10)
            .forEach((jugador, index) => {

                const fila =
                    document.createElement("tr");


                if (
                    jugador.nombre ===
                    nombreUsuario
                ) {

                    fila.className =
                        "tu-fila";

                }


                fila.innerHTML = `

                    <td>
                        ${index + 1}
                    </td>

                    <td>
                        ${jugador.nombre}
                    </td>

                    <td>
                        ${jugador.mejorIntentos}
                    </td>

                    <td>
                        ${jugador.partidas}
                    </td>

                `;


                ranking.appendChild(fila);

            });

    }


    /* =====================================================
       VARIABLES DEL JUEGO
    ===================================================== */

    let minimo = 1;

    let maximo = 100;

    let numeroAdivinado = 0;

    let intentos = 0;

    let jugando = false;


    /* =====================================================
       NÚMERO ALEATORIO
    ===================================================== */

    function generarNumero() {

        numeroAdivinado =
            Math.floor(
                Math.random() *
                (maximo - minimo + 1)
            ) + minimo;

    }


    /* =====================================================
       COMENZAR
    ===================================================== */

    comenzarBtn.addEventListener(
        "click",
        comenzar
    );


    function comenzar() {

        minimo = 1;

        maximo = 100;

        intentos = 0;

        jugando = true;


        generarNumero();


        comenzarBtn.style.display =
            "none";

        reiniciarBtn.style.display =
            "none";


        menorBtn.style.display =
            "inline-block";

        correctoBtn.style.display =
            "inline-block";

        mayorBtn.style.display =
            "inline-block";


        mostrarNumero();

    }


    /* =====================================================
       MOSTRAR NÚMERO
    ===================================================== */

    function mostrarNumero() {

        intentos++;


        numero.textContent =
            numeroAdivinado;


        rango.textContent =
            minimo +
            " - " +
            maximo;


        mensaje.textContent =
            idiomas[
                idiomaActual
            ].numero;

    }


    /* =====================================================
       MENOR
    ===================================================== */

    menorBtn.addEventListener(
        "click",
        () => {

            if (!jugando) {
                return;
            }


            maximo =
                numeroAdivinado - 1;


            if (minimo > maximo) {

                terminar(false);

                return;

            }


            generarNumero();

            mostrarNumero();

        }
    );


    /* =====================================================
       MAYOR
    ===================================================== */

    mayorBtn.addEventListener(
        "click",
        () => {

            if (!jugando) {
                return;
            }


            minimo =
                numeroAdivinado + 1;


            if (minimo > maximo) {

                terminar(false);

                return;

            }


            generarNumero();

            mostrarNumero();

        }
    );


    /* =====================================================
       CORRECTO
    ===================================================== */

    correctoBtn.addEventListener(
        "click",
        () => {

            if (!jugando) {
                return;
            }


            terminar(true);

        }
    );


    /* =====================================================
       TERMINAR
    ===================================================== */

    function terminar(acertado) {

        jugando = false;


        menorBtn.style.display =
            "none";

        correctoBtn.style.display =
            "none";

        mayorBtn.style.display =
            "none";


        reiniciarBtn.style.display =
            "inline-block";


        if (acertado) {

            mensaje.textContent =
                idiomas[
                    idiomaActual
                ].acierto;


            rango.textContent =
                idiomas[
                    idiomaActual
                ].intentos +
                ": " +
                intentos;


            guardarVictoria();

        } else {

            mensaje.textContent =
                "❌";

            rango.textContent =
                "No puedo continuar con ese rango.";

        }

    }


    /* =====================================================
       GUARDAR VICTORIA
    ===================================================== */

    function guardarVictoria() {

        const nombre =
            obtenerNombreUsuario();

        const datos =
            obtenerEstadisticas();


        let jugador =
            datos.find(
                j =>
                    j.nombre === nombre
            );


        if (!jugador) {

            jugador = {

                nombre:
                    nombre,

                mejorIntentos:
                    intentos,

                partidas:
                    1

            };


            datos.push(jugador);

        } else {

            jugador.partidas++;


            if (
                intentos <
                jugador.mejorIntentos
            ) {

                jugador.mejorIntentos =
                    intentos;

            }

        }


        guardarEstadisticas(datos);

        mostrarRanking();

    }


    /* =====================================================
       NUEVA PARTIDA
    ===================================================== */

    reiniciarBtn.addEventListener(
        "click",
        comenzar
    );


    /* =====================================================
       IDIOMA
    ===================================================== */

    let idiomaActual =
        localStorage.getItem("idioma") ||
        "es";


    function actualizarIdioma() {

        const t =
            idiomas[idiomaActual];


        document.getElementById(
            "tituloJuego"
        ).textContent =
            t.titulo;


        document.getElementById(
            "descripcionJuego"
        ).textContent =
            t.descripcion;


        document.getElementById(
            "volverBtn"
        ).textContent =
            t.volver;


        comenzarBtn.textContent =
            t.comenzar;


        reiniciarBtn.textContent =
            t.nueva;


        menorBtn.textContent =
            t.menor;


        correctoBtn.textContent =
            t.correcto;


        mayorBtn.textContent =
            t.mayor;


        document.getElementById(
            "estadisticasTitulo"
        ).textContent =
            t.estadisticas;


        document.getElementById(
            "intentosColumna"
        ).textContent =
            t.mejor;


        document.getElementById(
            "partidasColumna"
        ).textContent =
            t.partidas;


        if (!jugando) {

            if (
                intentos === 0
            ) {

                mensaje.textContent =
                    t.piensa;

                numero.textContent =
                    "¿Listo?";

                rango.textContent =
                    t.listo;

            }

        }


        if (
            idiomaActual === "es"
        ) {

            idiomaBtn.textContent =
                "🇪🇸 ES";

        } else if (
            idiomaActual === "en"
        ) {

            idiomaBtn.textContent =
                "🇬🇧 EN";

        } else {

            idiomaBtn.textContent =
                "🇦🇲 HY";

        }

    }


    idiomaBtn.addEventListener(
        "click",
        () => {

            if (
                idiomaActual === "es"
            ) {

                idiomaActual = "en";

            } else if (
                idiomaActual === "en"
            ) {

                idiomaActual = "hy";

            } else {

                idiomaActual = "es";

            }


            localStorage.setItem(
                "idioma",
                idiomaActual
            );


            actualizarIdioma();

        }
    );


    /* =====================================================
       TEMA
    ===================================================== */

    let tema =
        localStorage.getItem("tema") ||
        "claro";


    function actualizarTema() {

        if (tema === "oscuro") {

            document.body.classList.add(
                "oscuro"
            );

            temaBtn.textContent =
                "☀️";

        } else {

            document.body.classList.remove(
                "oscuro"
            );

            temaBtn.textContent =
                "🌙";

        }

    }


    temaBtn.addEventListener(
        "click",
        () => {

            tema =
                tema === "claro"
                    ? "oscuro"
                    : "claro";


            localStorage.setItem(
                "tema",
                tema
            );


            actualizarTema();

        }
    );


    /* =====================================================
       INICIO
    ===================================================== */

    actualizarIdioma();

    actualizarTema();

    mostrarRanking();

</script>

</body>
</html>
