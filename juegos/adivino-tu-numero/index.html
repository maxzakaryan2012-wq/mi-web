<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🧠 Adivino tu número</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f2f2f2;
    color:#222;
    transition:0.3s;
}

body.oscuro{
    background:#121212;
    color:white;
}

.contenedor{
    max-width:900px;
    margin:auto;
    padding:30px 20px;
}

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:25px;
    flex-wrap:wrap;
}

h1{
    margin:0;
    font-size:32px;
}

.botones-header{
    display:flex;
    gap:8px;
}

button{
    border:none;
    border-radius:10px;
    padding:12px 18px;
    font-size:16px;
    cursor:pointer;
    transition:0.2s;
}

button:hover{
    transform:scale(1.03);
}

button:disabled{
    opacity:0.5;
    cursor:not-allowed;
    transform:none;
}

#temaBtn,
#idiomaBtn{
    background:#ddd;
}

.oscuro #temaBtn,
.oscuro #idiomaBtn{
    background:#333;
    color:white;
}

.juego{
    background:white;
    border-radius:20px;
    padding:30px;
    box-shadow:0 5px 20px rgba(0,0,0,0.12);
    text-align:center;
}

.oscuro .juego{
    background:#1e1e1e;
}

.instrucciones{
    font-size:18px;
    margin-bottom:25px;
}

.numero{
    font-size:70px;
    font-weight:bold;
    margin:25px 0;
}

.rango{
    font-size:18px;
    opacity:0.75;
    margin-bottom:25px;
}

.botones{
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
}

.boton-menor{
    background:#ff7675;
    color:white;
}

.boton-correcto{
    background:#00b894;
    color:white;
}

.boton-mayor{
    background:#0984e3;
    color:white;
}

.intentos{
    margin-top:25px;
    font-size:20px;
    font-weight:bold;
}

.mensaje{
    margin-top:20px;
    font-size:20px;
    font-weight:bold;
}

.reiniciar{
    margin-top:20px;
    background:#6c5ce7;
    color:white;
    display:none;
}

.estadisticas{
    margin-top:30px;
    background:white;
    border-radius:20px;
    padding:25px;
    box-shadow:0 5px 20px rgba(0,0,0,0.12);
}

.oscuro .estadisticas{
    background:#1e1e1e;
}

.estadisticas h2{
    margin-top:0;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:15px;
}

th,
td{
    padding:10px;
    border-bottom:1px solid #ddd;
}

.oscuro th,
.oscuro td{
    border-bottom:1px solid #444;
}

.tu-fila{
    font-weight:bold;
    background:rgba(108,92,231,0.15);
}

.sin-datos{
    opacity:0.7;
}

.posicion{
    margin-top:15px;
    font-weight:bold;
}

.nombre{
    margin-bottom:20px;
}

.nombre input{
    padding:10px;
    border-radius:8px;
    border:1px solid #ccc;
    font-size:16px;
}

.oscuro input{
    background:#333;
    color:white;
    border:1px solid #555;
}

@media(max-width:600px){

    h1{
        font-size:26px;
    }

    .juego{
        padding:20px;
    }

    .numero{
        font-size:55px;
    }

    .botones button{
        width:100%;
    }

}

</style>
</head>

<body>

<div class="contenedor">

<header>

<h1 id="titulo">🧠 Adivino tu número</h1>

<div class="botones-header">

    <button id="idiomaBtn">
        🇪🇸
    </button>

    <button id="temaBtn">
        🌙
    </button>

</div>

</header>


<div class="juego">

<div
    class="instrucciones"
    id="instrucciones"
>
    Piensa un número del 1 al 100 y yo intentaré adivinarlo.
</div>


<div class="nombre">

    <input
        type="text"
        id="nombreInput"
        placeholder="Tu nombre"
        maxlength="20"
    >

</div>


<div
    class="numero"
    id="numeroActual"
>
    50
</div>


<div
    class="rango"
    id="rango"
>
    Estoy buscando entre 1 y 100
</div>


<div class="botones">

    <button
        class="boton-menor"
        id="menorBtn"
    >
        ⬇️ Es menor
    </button>

    <button
        class="boton-correcto"
        id="correctoBtn"
    >
        ✅ Correcto
    </button>

    <button
        class="boton-mayor"
        id="mayorBtn"
    >
        ⬆️ Es mayor
    </button>

</div>


<div class="intentos">

    <span id="textoIntentos">
        Intentos:
    </span>

    <span id="intentos">
        1
    </span>

</div>


<div
    class="mensaje"
    id="mensaje"
></div>


<button
    class="reiniciar"
    id="reiniciarBtn"
>
    🔄 Volver a jugar
</button>

</div>


<div class="estadisticas">

<h2 id="tituloRanking">
    🏆 Ranking
</h2>

<table>

<thead>

<tr>

    <th>#</th>

    <th id="nombreColumna">
        Nombre
    </th>

    <th id="intentosColumna">
        Mejor partida
    </th>

    <th id="partidasColumna">
        Partidas ganadas
    </th>

</tr>

</thead>

<tbody id="rankingBody">
</tbody>

</table>

<div
    class="posicion"
    id="posicionUsuario"
></div>

</div>

</div>


<script>

/* =====================================================
   CONFIGURACIÓN
===================================================== */

const ESTADISTICAS_KEY =
    "estadisticasAdivinoNumero";


/* =====================================================
   IDIOMAS
===================================================== */

const idiomas = {

    es: {

        titulo:
        "🧠 Adivino tu número",

        instrucciones:
        "Piensa un número del 1 al 100 y yo intentaré adivinarlo.",

        nombre:
        "Tu nombre",

        menor:
        "⬇️ Es menor",

        correcto:
        "✅ Correcto",

        mayor:
        "⬆️ Es mayor",

        intentos:
        "Intentos:",

        rango:
        "Estoy buscando entre {min} y {max}",

        ranking:
        "🏆 Ranking",

        nombreColumna:
        "Nombre",

        intentosColumna:
        "Mejor partida",

        partidasColumna:
        "Partidas ganadas",

        sinDatos:
        "Todavía no hay partidas.",

        posicion:
        "Tu posición: #{pos}",

        victoria:
        "🎉 ¡Lo he adivinado en {intentos} intentos!",

        reiniciar:
        "🔄 Volver a jugar"

    },


    en: {

        titulo:
        "🧠 I Guess Your Number",

        instrucciones:
        "Think of a number from 1 to 100 and I will try to guess it.",

        nombre:
        "Your name",

        menor:
        "⬇️ Lower",

        correcto:
        "✅ Correct",

        mayor:
        "⬆️ Higher",

        intentos:
        "Attempts:",

        rango:
        "I'm searching between {min} and {max}",

        ranking:
        "🏆 Ranking",

        nombreColumna:
        "Name",

        intentosColumna:
        "Best game",

        partidasColumna:
        "Games won",

        sinDatos:
        "There are no games yet.",

        posicion:
        "Your position: #{pos}",

        victoria:
        "🎉 I guessed it in {intentos} attempts!",

        reiniciar:
        "🔄 Play again"

    },


    hy: {

        titulo:
        "🧠 Գուշակում եմ քո թիվը",

        instrucciones:
        "Մտածիր 1-ից 100 թիվ, և ես կփորձեմ գուշակել այն։",

        nombre:
        "Քո անունը",

        menor:
        "⬇️ Ավելի փոքր է",

        correcto:
        "✅ Ճիշտ է",

        mayor:
        "⬆️ Ավելի մեծ է",

        intentos:
        "Փորձեր:",

        rango:
        "Փնտրում եմ {min}-ից մինչև {max}",

        ranking:
        "🏆 Վարկանիշ",

        nombreColumna:
        "Անուն",

        intentosColumna:
        "Լավագույն խաղ",

        partidasColumna:
        "Հաղթած խաղեր",

        sinDatos:
        "Դեռ խաղեր չկան։",

        posicion:
        "Քո դիրքը՝ #{pos}",

        victoria:
        "🎉 Գուշակեցի {intentos} փորձից հետո։",

        reiniciar:
        "🔄 Նորից խաղալ"

    }

};


/* =====================================================
   ELEMENTOS
===================================================== */

const numeroActual =
    document.getElementById(
        "numeroActual"
    );

const rango =
    document.getElementById(
        "rango"
    );

const intentosElemento =
    document.getElementById(
        "intentos"
    );

const mensaje =
    document.getElementById(
        "mensaje"
    );

const reiniciarBtn =
    document.getElementById(
        "reiniciarBtn"
    );

const menorBtn =
    document.getElementById(
        "menorBtn"
    );

const correctoBtn =
    document.getElementById(
        "correctoBtn"
    );

const mayorBtn =
    document.getElementById(
        "mayorBtn"
    );

const nombreInput =
    document.getElementById(
        "nombreInput"
    );

const rankingBody =
    document.getElementById(
        "rankingBody"
    );

const posicionUsuario =
    document.getElementById(
        "posicionUsuario"
    );

const idiomaBtn =
    document.getElementById(
        "idiomaBtn"
    );

const temaBtn =
    document.getElementById(
        "temaBtn"
    );


/* =====================================================
   ESTADO DEL JUEGO
===================================================== */

let minimo = 1;

let maximo = 100;

let numeroAdivinado;

let intentos = 1;

let terminado = false;


/* =====================================================
   IDIOMA
===================================================== */

let idioma =
    localStorage.getItem("idioma")
    || "es";


function aplicarIdioma(){

    const t =
        idiomas[idioma];

    document.getElementById(
        "titulo"
    ).textContent =
        t.titulo;

    document.getElementById(
        "instrucciones"
    ).textContent =
        t.instrucciones;

    nombreInput.placeholder =
        t.nombre;

    menorBtn.textContent =
        t.menor;

    correctoBtn.textContent =
        t.correcto;

    mayorBtn.textContent =
        t.mayor;

    document.getElementById(
        "textoIntentos"
    ).textContent =
        t.intentos;

    document.getElementById(
        "tituloRanking"
    ).textContent =
        t.ranking;

    document.getElementById(
        "nombreColumna"
    ).textContent =
        t.nombreColumna;

    document.getElementById(
        "intentosColumna"
    ).textContent =
        t.intentosColumna;

    document.getElementById(
        "partidasColumna"
    ).textContent =
        t.partidasColumna;

    reiniciarBtn.textContent =
        t.reiniciar;

    idiomaBtn.textContent =
        idioma === "es"
        ? "🇪🇸"
        : idioma === "en"
        ? "🇬🇧"
        : "🇦🇲";

    actualizarRango();

    mostrarRanking();

}


idiomaBtn.addEventListener(
    "click",
    () => {

        if(idioma === "es"){

            idioma = "en";

        }
        else if(idioma === "en"){

            idioma = "hy";

        }
        else{

            idioma = "es";

        }

        localStorage.setItem(
            "idioma",
            idioma
        );

        aplicarIdioma();

    }
);


/* =====================================================
   TEMA
===================================================== */

let tema =
    localStorage.getItem("tema")
    || "claro";


function aplicarTema(){

    if(tema === "oscuro"){

        document.body.classList.add(
            "oscuro"
        );

        temaBtn.textContent =
            "☀️";

    }
    else{

        document.body.classList.remove(
            "oscuro"
        );

        temaBtn.textContent =
            "🌙";

    }

}


temaBtn.addEventListener(
    "click",
    () => {

        tema =
            tema === "claro"
            ? "oscuro"
            : "claro";

        localStorage.setItem(
            "tema",
            tema
        );

        aplicarTema();

    }
);


/* =====================================================
   NOMBRE DEL USUARIO
===================================================== */

function obtenerNombreUsuario(){

    let nombre =
        nombreInput.value.trim();

    if(nombre){

        localStorage.setItem(
            "nombreUsuario",
            nombre
        );

        return nombre;

    }

    nombre =
        localStorage.getItem(
            "nombreUsuario"
        );

    if(nombre){

        return nombre;

    }

    const numero =
        localStorage.getItem(
            "numeroUsuario"
        );

    if(numero){

        return "Jugador " + numero;

    }

    return "Jugador";

}


/* =====================================================
   ESTADÍSTICAS
===================================================== */

function obtenerEstadisticas(){

    try{

        const datos =
            JSON.parse(
                localStorage.getItem(
                    ESTADISTICAS_KEY
                )
            );

        if(Array.isArray(datos)){

            return datos;

        }

    }
    catch(e){}

    return [];

}


function guardarEstadisticas(
    datos
){

    localStorage.setItem(
        ESTADISTICAS_KEY,
        JSON.stringify(datos)
    );

}


/* =====================================================
   ORDENAR RANKING
===================================================== */

function ordenarRanking(
    datos
){

    return datos.sort(
        (a,b) => {

            if(
                a.mejorIntentos !==
                b.mejorIntentos
            ){

                return (
                    a.mejorIntentos -
                    b.mejorIntentos
                );

            }

            if(
                a.partidas !==
                b.partidas
            ){

                return (
                    b.partidas -
                    a.partidas
                );

            }

            return a.nombre.localeCompare(
                b.nombre
            );

        }
    );

}


/* =====================================================
   MOSTRAR RANKING
===================================================== */

function mostrarRanking(){

    const datos =
        ordenarRanking(
            obtenerEstadisticas()
        );

    rankingBody.innerHTML = "";

    const t =
        idiomas[idioma];

    if(datos.length === 0){

        rankingBody.innerHTML =
            `<tr>
                <td colspan="4"
                    class="sin-datos">
                    ${t.sinDatos}
                </td>
            </tr>`;

        posicionUsuario.textContent =
            "";

        return;

    }


    const nombreActual =
        obtenerNombreUsuario();


    datos
        .slice(0,10)
        .forEach(
            (jugador,index) => {

                const fila =
                    document.createElement(
                        "tr"
                    );

                if(
                    jugador.nombre ===
                    nombreActual
                ){

                    fila.classList.add(
                        "tu-fila"
                    );

                }

                fila.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${jugador.nombre}</td>
                    <td>${jugador.mejorIntentos}</td>
                    <td>${jugador.partidas}</td>
                `;

                rankingBody.appendChild(
                    fila
                );

            }
        );


    const posicion =
        datos.findIndex(
            jugador =>
            jugador.nombre ===
            nombreActual
        );


    if(posicion >= 10){

        posicionUsuario.textContent =
            t.posicion.replace(
                "{pos}",
                posicion + 1
            );

    }
    else{

        posicionUsuario.textContent =
            "";

    }

}


/* =====================================================
   ACTUALIZAR RANGO
===================================================== */

function actualizarRango(){

    const t =
        idiomas[idioma];

    rango.textContent =
        t.rango
        .replace(
            "{min}",
            minimo
        )
        .replace(
            "{max}",
            maximo
        );

}


/* =====================================================
   GENERAR NÚMERO
===================================================== */

/*
    Ya no usamos siempre el centro.

    Pero tampoco elegimos un número
    completamente aleatorio.

    Elegimos posiciones que están
    ligeramente alejadas del centro.

    Esto hace que normalmente tarde
    más intentos que una búsqueda binaria
    normal, pero siga pareciendo lógico.
*/

function generarNumero(){

    if(minimo > maximo){

        return;

    }


    const cantidad =
        maximo - minimo + 1;


    if(cantidad <= 3){

        numeroAdivinado =
            minimo;

    }
    else{

        const centro =
            Math.floor(
                (minimo + maximo) / 2
            );


        const distancia =
            Math.max(
                2,
                Math.floor(
                    cantidad * 0.25
                )
            );


        let opciones = [];


        const izquierda =
            centro - distancia;

        const derecha =
            centro + distancia;


        if(
            izquierda >= minimo &&
            izquierda <= maximo
        ){

            opciones.push(
                izquierda
            );

        }


        if(
            derecha >= minimo &&
            derecha <= maximo
        ){

            opciones.push(
                derecha
            );

        }


        if(
            centro >= minimo &&
            centro <= maximo &&
            opciones.length === 0
        ){

            opciones.push(
                centro
            );

        }


        numeroAdivinado =
            opciones[
                Math.floor(
                    Math.random() *
                    opciones.length
                )
            ];

    }


    numeroActual.textContent =
        numeroAdivinado;

    actualizarRango();

}


/* =====================================================
   INICIAR JUEGO
===================================================== */

function iniciarJuego(){

    minimo = 1;

    maximo = 100;

    intentos = 1;

    terminado = false;

    mensaje.textContent =
        "";

    reiniciarBtn.style.display =
        "none";

    intentosElemento.textContent =
        intentos;

    menorBtn.disabled =
        false;

    correctoBtn.disabled =
        false;

    mayorBtn.disabled =
        false;

    generarNumero();

}


/* =====================================================
   ES MENOR
===================================================== */

menorBtn.addEventListener(
    "click",
    () => {

        if(terminado){

            return;

        }


        maximo =
            numeroAdivinado - 1;


        intentos++;

        intentosElemento.textContent =
            intentos;


        if(minimo > maximo){

            mensaje.textContent =
                "🤔 Creo que algo no cuadra.";

            return;

        }


        generarNumero();

    }
);


/* =====================================================
   ES MAYOR
===================================================== */

mayorBtn.addEventListener(
    "click",
    () => {

        if(terminado){

            return;

        }


        minimo =
            numeroAdivinado + 1;


        intentos++;

        intentosElemento.textContent =
            intentos;


        if(minimo > maximo){

            mensaje.textContent =
                "🤔 Creo que algo no cuadra.";

            return;

        }


        generarNumero();

    }
);


/* =====================================================
   CORRECTO
===================================================== */

correctoBtn.addEventListener(
    "click",
    () => {

        if(terminado){

            return;

        }


        terminado = true;


        menorBtn.disabled =
            true;

        correctoBtn.disabled =
            true;

        mayorBtn.disabled =
            true;


        const t =
            idiomas[idioma];


        mensaje.textContent =
            t.victoria.replace(
                "{intentos}",
                intentos
            );


        reiniciarBtn.style.display =
            "inline-block";


        const nombre =
            obtenerNombreUsuario();


        const datos =
            obtenerEstadisticas();


        let jugador =
            datos.find(
                j =>
                j.nombre ===
                nombre
            );


        if(!jugador){

            jugador = {

                nombre:
                nombre,

                mejorIntentos:
                intentos,

                partidas:
                1

            };

            datos.push(
                jugador
            );

        }
        else{

            jugador.partidas++;


            if(
                intentos <
                jugador.mejorIntentos
            ){

                jugador.mejorIntentos =
                    intentos;

            }

        }


        guardarEstadisticas(
            datos
        );

        mostrarRanking();

    }
);


/* =====================================================
   REINICIAR
===================================================== */

reiniciarBtn.addEventListener(
    "click",
    iniciarJuego
);


/* =====================================================
   INICIO
===================================================== */

const nombreGuardado =
    localStorage.getItem(
        "nombreUsuario"
    );

if(nombreGuardado){

    nombreInput.value =
        nombreGuardado;

}


aplicarTema();

aplicarIdioma();

iniciarJuego();

</script>

</body>
</html>
