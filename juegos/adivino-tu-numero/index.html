<head>

    <style>

        * {

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;

        /* BARRA */

        .barra {
            height: 70px;
            background: #181818;
            display: flex;
            align-items: center;
            padding: 0 25px;
            gap: 15px;
            border-bottom: 1px solid #333;

        }

        .espacio {
            flex: 1;
        }

        .menu-idioma {
            position: relative;
        }

        .boton-idioma,
        #botonTema {
            background: #252525;
            color: white;
            border: 1px solid #444;
            border-radius: 8px;

            cursor: pointer;

        .idiomas {

        /* JUEGO */

            font-size: 22px;

        .boton-juego {

        .boton-juego:hover {
            transform: scale(1.03);
        }

        #comenzarBtn,
        #reiniciarBtn {
            margin: 20px auto;
            padding: 13px 25px;
            font-size: 17px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: white;
            color: #111;
            font-weight: bold;
        }

        #comenzarBtn:hover,
        #reiniciarBtn:hover {
            transform: scale(1.03);
        }

        /* ESTADÍSTICAS */

        .estadisticas {
            margin-top: 60px;
            text-align: left;
        }

        .estadisticas h2 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 20px;
        }

        .tabla-contenedor {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid #333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #181818;

        th,

        /* TEMA CLARO */

        body.claro {

        body.claro .volver {

        body.claro .boton-idioma,
        body.claro #botonTema {
            background: #f1f1f1;

        }

        body.claro .boton-idioma:hover,
        body.claro #botonTema:hover {
            background: #e5e5e5;
        }

        body.claro .idiomas {
            background: white;
            border-color: #ccc;
        }

        body.claro .idiomas button {
            color: #111;
        }

        body.claro .idiomas button:hover {
            background: #eee;
        }

        body.claro #descripcion {
            color: #555;
        }

        body.claro #rango {
            color: #555;
        }

        body.claro table {
            background: white;
        }

        body.claro th {

        }

        body.claro th,
        body.claro td {

        body.claro .tu-fila {

<body>

    <!-- BARRA SUPERIOR -->

    <div class="barra">

        <a
            href="../../index.html"
            class="volver"

            ← Volver
        </a>

        <div class="espacio"></div>

        <div class="menu-idioma">

            <button

    <!-- CONTENIDO -->

    <main class="contenedor">

        <h1 id="titulo">
            🧠 Adivino tu número
        </h1>

        <p id="descripcion">
            Piensa un número del 1 al 100 y trataré de adivinarlo.
        </p>


        <!-- JUEGO -->

        <section class="juego">

            <div id="mensaje">
                Pulsa comenzar para que intente adivinarlo.
            </div>

            <div id="numero"></div>

            <div id="rango"></div>


            <button
                id="comenzarBtn"
                onclick="comenzar()"
            >
                🧠 Comenzar
            </button>


            <div
                class="botones"
                id="botonesJuego"
                style="display:none;"
            >

                <button
                    class="boton-juego"
                    id="menorBtn"
                    onclick="numeroMenor()"
                >
                    ⬇️ Es menor
                </button>

                <button
                    class="boton-juego"
                    id="correctoBtn"
                    onclick="numeroCorrecto()"
                >
                    ✓ Correcto
                </button>

                <button
                    class="boton-juego"
                    id="mayorBtn"
                    onclick="numeroMayor()"
                >
                    ⬆️ Es mayor
                </button>

            </div>


            <button
                id="reiniciarBtn"
                onclick="comenzar()"
                style="display:none;"
            >
                🔄 Nueva partida
            </button>

        </section>


        <!-- ESTADÍSTICAS -->

        <section class="estadisticas">
            <p id="avisoLocal"></p>

            <h2 id="tituloEstadisticas">
                🏆 Estadísticas
            </h2>

            <div class="tabla-contenedor">

                <table>

                    <thead>

                        <tr>

                            <th id="thPuesto">
                                Puesto
                            </th>

                            <th id="thNombre">
                                Nombre
                            </th>

                            <th id="thMejor">
                                Mejor partida
                            </th>

                            <th id="thPartidas">
                                Partidas ganadas
                            </th>

                        </tr>

                    </thead>

                    <tbody id="tablaRanking">
                    </tbody>

                </table>

            </div>


            <div
                class="posicion-usuario"
                id="posicionUsuario"
            ></div>

        </section>

    </main>


    <script src="../../assets/common.js?v=xp-20261006-8"></script>
    <script>

        /* =====================================================
           VARIABLES
        ===================================================== */

        let minimo = 1;
        let maximo = 100;
        let numeroAdivinado = 0;
        let intentos = 0;
        let jugando = false;


        /* =====================================================
           NÚMERO ALEATORIO
        ===================================================== */

        function generarNumeroAleatorio() {

            numeroAdivinado =
                Math.floor(
                    Math.random() *
                    (
                        maximo -
                        minimo +
                        1
                    )
                ) +
                minimo;

        }


        /* =====================================================
           COMENZAR
        ===================================================== */

        function comenzar() {

            minimo = 1;
            maximo = 100;
            intentos = 0;
            jugando = true;

            generarNumeroAleatorio();

            document.getElementById(
                "comenzarBtn"
            ).style.display = "none";

            document.getElementById(
                "reiniciarBtn"
            ).style.display = "none";

            document.getElementById(
                "botonesJuego"
            ).style.display = "flex";

            mostrarNumero();

        }


        /* =====================================================
           MOSTRAR NÚMERO
        ===================================================== */

        function mostrarNumero() {

            intentos++;
            MiWeb.xpAction("attempt");

            const idioma =
                localStorage.getItem("idioma") || "es";


            document.getElementById(
                "numero"
            ).textContent =
                numeroAdivinado;


            document.getElementById(
                "rango"
            ).textContent =
                "1 - 100";


            if (idioma === "en") {

                document.getElementById(
                    "mensaje"
                ).textContent =
                    "I think your number is";

            } else if (idioma === "hy") {

                document.getElementById(
                    "mensaje"
                ).textContent =
                    "Կարծում եմ՝ քո թիվը";

            } else {

                document.getElementById(
                    "mensaje"
                ).textContent =
                    "Creo que tu número es";

            }

        }


        /* =====================================================
           ES MENOR
        ===================================================== */

        function numeroMenor() {

            if (!jugando) {
                return;
            }

            maximo =
                numeroAdivinado - 1;

            if (minimo > maximo) {

                terminar(false);

                return;

            }

            generarNumeroAleatorio();

            mostrarNumero();

        }


        /* =====================================================
           ES MAYOR
        ===================================================== */

        function numeroMayor() {

            if (!jugando) {
                return;
            }

            minimo =
                numeroAdivinado + 1;

            if (minimo > maximo) {

                terminar(false);

                return;

            }

            generarNumeroAleatorio();

            mostrarNumero();

        }


        /* =====================================================
           CORRECTO
        ===================================================== */

        function numeroCorrecto() {

            if (!jugando) {
                return;
            }

            MiWeb.xpAction("correct");
            terminar(true);

        }


        /* =====================================================
           TERMINAR
        ===================================================== */

        function terminar(acertado) {

            jugando = false;

            document.getElementById(
                "botonesJuego"
            ).style.display = "none";

            document.getElementById(
                "reiniciarBtn"
            ).style.display = "block";


            const idioma =
                localStorage.getItem("idioma") || "es";


            if (acertado) {

                if (idioma === "en") {

                    document.getElementById(
                        "mensaje"
                    ).textContent =
                        "🎉 I got it!";

                    document.getElementById(
                        "rango"
                    ).textContent =
                        "Attempts: " +
                        intentos;

                } else if (idioma === "hy") {

                    document.getElementById(
                        "mensaje"
                    ).textContent =
                        "🎉 Գուշակեցի։";

                    document.getElementById(
                        "rango"
                    ).textContent =
                        "Փորձեր՝ " +
                        intentos;

                } else {

                    document.getElementById(
                        "mensaje"
                    ).textContent =
                        "🎉 ¡He acertado!";

                    document.getElementById(
                        "rango"
                    ).textContent =
                        "Intentos: " +
                        intentos;

                }


                guardarVictoria();

            } else {

                if (idioma === "en") {

                    document.getElementById(
                        "mensaje"
                    ).textContent =
                        "❌ I can't continue.";

                } else if (idioma === "hy") {

                    document.getElementById(
                        "mensaje"
                    ).textContent =
                        "❌ Չեմ կարող շարունակել։";

                } else {

                    document.getElementById(
                        "mensaje"
                    ).textContent =
                        "❌ No puedo continuar.";

                }

            }

        }


        /* =====================================================
           USUARIO
        ===================================================== */

        function obtenerNombreUsuario() { return MiWeb.profile().name; }


        /* =====================================================
           ESTADÍSTICAS
        ===================================================== */

        const ESTADISTICAS_KEY =
            "estadisticasAdivinoTuNumero";


        function obtenerEstadisticas() { return MiWeb.readStats(ESTADISTICAS_KEY); }


        function guardarVictoria() {

            const nombre =
                MiWeb.profile().id;


            const estadisticas =
                obtenerEstadisticas();


            if (!estadisticas[nombre]) {

                estadisticas[nombre] = {

                    mejorIntentos:
                        intentos,

                    partidas:
                        1

                };

            } else {

                estadisticas[nombre].partidas += 1;


                /*
                 * AQUÍ ESTÁ EL CAMBIO:
                 *
                 * MÁS INTENTOS = MEJOR PARTIDA
                 */

                if (
                    intentos >
                    estadisticas[nombre]
                        .mejorIntentos
                ) {

                    estadisticas[nombre]
                        .mejorIntentos =
                            intentos;

                }

            }


            MiWeb.writeStats(ESTADISTICAS_KEY, estadisticas);


            mostrarRanking();

        }


        /* =====================================================
           ORDENAR RANKING
        ===================================================== */

        function ordenarRanking(
            estadisticas
        ) {

            const jugadores =
                Object.keys(
                    estadisticas
                ).map(
                    function(nombre) {

                        return {

                            id: nombre,
                            nombre: MiWeb.playerName(nombre),

                            mejorIntentos:
                                estadisticas[
                                    nombre
                                ].mejorIntentos,

                            partidas:
                                estadisticas[
                                    nombre
                                ].partidas

                        };

                    }
                );


            jugadores.sort(
                function(a, b) {

                    /*
                     * MÁS INTENTOS = MEJOR
                     */

                    if (
                        a.mejorIntentos !==
                        b.mejorIntentos
                    ) {

                        return (
                            b.mejorIntentos -
                            a.mejorIntentos
                        );

                    }


                    /*
                     * Si empatan:
                     * más partidas ganadas
                     */

                    if (
                        a.partidas !==
                        b.partidas
                    ) {

                        return (
                            b.partidas -
                            a.partidas
                        );

                    }


                    return a.nombre.localeCompare(
                        b.nombre
                    );

                }
            );


            return jugadores;

        }


        /* =====================================================
           MOSTRAR RANKING
        ===================================================== */

        function mostrarRanking() {

            const estadisticas =
                obtenerEstadisticas();


            const ranking =
                ordenarRanking(
                    estadisticas
                );


            const tabla =
                document.getElementById(
                    "tablaRanking"
                );


            const nombreUsuario =
                obtenerNombreUsuario();


            tabla.innerHTML = "";


            const top10 =
                ranking.slice(0, 10);


            top10.forEach(
                function(jugador, index) {

                    const fila =
                        document.createElement(
                            "tr"
                        );


                    if (
                        jugador.id === MiWeb.profile().id
                    ) {

                        fila.classList.add(
                            "tu-fila"
                        );

                    }


                    const puesto =
                        document.createElement(
                            "td"
                        );

                    const nombre =
                        document.createElement(
                            "td"
                        );

                    const mejor =
                        document.createElement(
                            "td"
                        );

                    const partidas =
                        document.createElement(
                            "td"
                        );


                    puesto.textContent =
                        index + 1;

                    nombre.textContent =
                        jugador.nombre;

                    mejor.textContent =
                        jugador.mejorIntentos;

                    partidas.textContent =
                        jugador.partidas;


                    fila.appendChild(puesto);
                    fila.appendChild(nombre);
                    fila.appendChild(mejor);
                    fila.appendChild(partidas);


                    tabla.appendChild(fila);

                }
            );


            mostrarPosicionUsuario(
                ranking,
                nombreUsuario
            );

        }


        /* =====================================================
           POSICIÓN DEL USUARIO
        ===================================================== */

        function mostrarPosicionUsuario(
            ranking,
            nombreUsuario
        ) {

            const elemento =
                document.getElementById(
                    "posicionUsuario"
                );


            const posicion =
                ranking.findIndex(
                    function(jugador) {

                        return (
                            jugador.id === MiWeb.profile().id
                        );

                    }
                );


            if (
                posicion === -1 ||
                posicion < 10
            ) {

                elemento.style.display =
                    "none";

                return;

            }


            const jugador =
                ranking[posicion];


            const idioma =
                localStorage.getItem(
                    "idioma"
                ) || "es";


            if (idioma === "en") {

                elemento.textContent =
                    "👤 Your position: " +
                    (posicion + 1) +
                    " — " +
                    nombreUsuario +
                    " — Best game: " +
                    jugador.mejorIntentos +
                    " attempts — " +
                    jugador.partidas +
                    " games won";

            } else if (idioma === "hy") {

                elemento.textContent =
                    "👤 Քո դիրքը՝ " +
                    (posicion + 1) +
                    " — " +
                    nombreUsuario +
                    " — Լավագույն խաղ՝ " +
                    jugador.mejorIntentos +
                    " փորձ — " +
                    jugador.partidas +
                    " հաղթած խաղ";

            } else {

                elemento.textContent =
                    "👤 Tu posición: " +
                    (posicion + 1) +
                    " — " +
                    nombreUsuario +
                    " — Mejor partida: " +
                    jugador.mejorIntentos +
                    " intentos — " +
                    jugador.partidas +
                    " partidas ganadas";

            }


            elemento.style.display =
                "block";

        }


        /* =====================================================
           IDIOMAS
        ===================================================== */

        function abrirIdioma() {

            const menu =
                document.getElementById(
                    "menuIdiomas"
                );


            if (
                menu.style.display ===
                "block"
            ) {

                menu.style.display =
                    "none";

            } else {

                menu.style.display =
                    "block";

            }

        }


        function cambiarIdioma(
            idioma
        ) {

            localStorage.setItem(
                "idioma",
                idioma
            );


            aplicarIdioma();


            document.getElementById(
                "menuIdiomas"
            ).style.display =
                "none";

        }


        function aplicarIdioma() {
            MiWeb.applyLanguage();

            const idioma =
                localStorage.getItem(
                    "idioma"
                ) || "es";


            const titulo =
                document.getElementById(
                    "titulo"
                );

            const descripcion =
                document.getElementById(
                    "descripcion"
                );

            const volver =
                document.getElementById(
                    "volver"
                );

            const botonIdioma =
                document.getElementById(
                    "botonIdioma"
                );

            const tituloEstadisticas =
                document.getElementById(
                    "tituloEstadisticas"
                );

            const thPuesto =
                document.getElementById(
                    "thPuesto"
                );

            const thNombre =
                document.getElementById(
                    "thNombre"
                );

            const thMejor =
                document.getElementById(
                    "thMejor"
                );

            const thPartidas =
                document.getElementById(
                    "thPartidas"
                );

            const comenzarBtn =
                document.getElementById(
                    "comenzarBtn"
                );

            const reiniciarBtn =
                document.getElementById(
                    "reiniciarBtn"
                );

            const menorBtn =
                document.getElementById(
                    "menorBtn"
                );

            const correctoBtn =
                document.getElementById(
                    "correctoBtn"
                );

            const mayorBtn =
                document.getElementById(
                    "mayorBtn"
                );


            if (idioma === "en") {

                titulo.textContent =
                    "🧠 I Guess Your Number";

                descripcion.textContent =
                    "Think of a number from 1 to 100 and I will try to guess it.";

                volver.textContent =
                    "← Back";

                botonIdioma.textContent =
                    "🇬🇧 EN ▾";

                tituloEstadisticas.textContent =
                    "🏆 Statistics";

                thPuesto.textContent =
                    "Place";

                thNombre.textContent =
                    "Name";

                thMejor.textContent =
                    "Best game";

                thPartidas.textContent =
                    "Games won";

                comenzarBtn.textContent =
                    "🧠 Start";

                reiniciarBtn.textContent =
                    "🔄 New game";

                menorBtn.textContent =
                    "⬇️ Lower";

                correctoBtn.textContent =
                    "✓ Correct";

                mayorBtn.textContent =
                    "⬆️ Higher";

                document.title =
                    "I Guess Your Number - MY WEBSITE";


            } else if (idioma === "hy") {

                titulo.textContent =
                    "🧠 Գուշակում եմ քո թիվը";

                descripcion.textContent =
                    "Մտածիր 1-ից 100 թիվ, և ես կփորձեմ գուշակել այն։";

                volver.textContent =
                    "← Հետ";

                botonIdioma.textContent =
                    "🇦🇲 HY ▾";

                tituloEstadisticas.textContent =
                    "🏆 Վիճակագրություն";

                thPuesto.textContent =
                    "Դիրք";

                thNombre.textContent =
                    "Անուն";

                thMejor.textContent =
                    "Լավագույն խաղ";

                thPartidas.textContent =
                    "Հաղթած խաղեր";

                comenzarBtn.textContent =
                    "🧠 Սկսել";

                reiniciarBtn.textContent =
                    "🔄 Նոր խաղ";

                menorBtn.textContent =
                    "⬇️ Ավելի փոքր";

                correctoBtn.textContent =
                    "✓ Ճիշտ է";

                mayorBtn.textContent =
                    "⬆️ Ավելի մեծ";

                document.title =
                    "Գուշակում եմ քո թիվը - ԻՄ ԿԱՅՔԸ";


            } else {

                titulo.textContent =
                    "🧠 Adivino tu número";

                descripcion.textContent =
                    "Piensa un número del 1 al 100 y trataré de adivinarlo.";

                volver.textContent =
                    "← Volver";

                botonIdioma.textContent =
                    "🇪🇸 ES ▾";

                tituloEstadisticas.textContent =
                    "🏆 Estadísticas";

                thPuesto.textContent =
                    "Puesto";

                thNombre.textContent =
                    "Nombre";

                thMejor.textContent =
                    "Mejor partida";

                thPartidas.textContent =
                    "Partidas ganadas";

                comenzarBtn.textContent =
                    "🧠 Comenzar";

                reiniciarBtn.textContent =
                    "🔄 Nueva partida";

                menorBtn.textContent =
                    "⬇️ Es menor";

                correctoBtn.textContent =
                    "✓ Correcto";

                mayorBtn.textContent =
                    "⬆️ Es mayor";

                document.title =
                    "Adivino tu número - MI WEB";

            }


            mostrarRanking();

            actualizarTextoTema();

        }


        /* =====================================================
           CERRAR MENÚ
        ===================================================== */

        document.addEventListener(
            "click",
            function(event) {

                const menu =
                    document.getElementById(
                        "menuIdiomas"
                    );

                const boton =
                    document.getElementById(
                        "botonIdioma"
                    );


                if (
                    !menu.contains(
                        event.target
                    ) &&
                    !boton.contains(
                        event.target
                    )
                ) {

                    menu.style.display =
                        "none";

                }

            }
        );


        /* =====================================================
           TEMA
        ===================================================== */

        function aplicarTema() {

            const tema =
                localStorage.getItem(
                    "tema"
                ) || "oscuro";


            if (tema === "claro") {

                document.body.classList.add(
                    "claro"
                );

            } else {

                document.body.classList.remove(
                    "claro"
                );

            }


            actualizarTextoTema();

        }


        function cambiarTema() {

            const temaActual =
                localStorage.getItem(
                    "tema"
                ) || "oscuro";


            const nuevoTema =
                temaActual === "oscuro"
                ? "claro"
                : "oscuro";


            localStorage.setItem(
                "tema",
                nuevoTema
            );


            aplicarTema();

        }


        function actualizarTextoTema() {

            const tema =
                localStorage.getItem(
                    "tema"
                ) || "oscuro";


            const idioma =
                localStorage.getItem(
                    "idioma"
                ) || "es";


            const boton =
                document.getElementById(
                    "botonTema"
                );


            if (idioma === "en") {

                boton.textContent =
                    tema === "oscuro"
                    ? "☀️ Light"
                    : "🌙 Dark";

            } else if (idioma === "hy") {

                boton.textContent =
                    tema === "oscuro"
                    ? "☀️ Բաց"
                    : "🌙 Մութ";

            } else {

                boton.textContent =
                    tema === "oscuro"
                    ? "☀️ Claro"
                    : "🌙 Oscuro";

            }

        }


        /* =====================================================
           INICIO
        ===================================================== */

        aplicarIdioma();

        aplicarTema();

        mostrarRanking();

    </script>

</body>
</html>
