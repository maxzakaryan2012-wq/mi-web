<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MI WEB</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      transition: 0.3s;
    }

    body.dia {
      background: #f5f5f5;
      color: #111;
    }

    header {
      text-align: center;
      padding: 70px 20px 40px;
    }

    h1 {
      font-size: 60px;
      margin: 0;
    }

    header p {
      font-size: 22px;
      color: #aaa;
    }

    body.dia header p {
      color: #555;
    }

    /* BOTÓN DE TEMA */

    .tema {
      position: absolute;
      top: 20px;
      right: 20px;
      padding: 12px 18px;
      border: none;
      border-radius: 12px;
      background: #222;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    body.dia .tema {
      background: #ddd;
      color: #111;
    }

    .tema:hover {
      transform: scale(1.05);
    }

    /* JUEGOS */

    .juegos {
      max-width: 1000px;
      margin: auto;
      padding: 30px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .juego {
      background: #1d1d1d;
      border-radius: 18px;
      padding: 30px;
      text-decoration: none;
      color: white;
      transition: 0.2s;
      border: 1px solid #333;
    }

    body.dia .juego {
      background: white;
      color: #111;
      border: 1px solid #ddd;
    }

    .juego:hover {
      transform: translateY(-6px);
    }

    .icono {
      font-size: 50px;
    }

    .juego h2 {
      margin-bottom: 10px;
    }

    .juego p {
      color: #aaa;
    }

    body.dia .juego p {
      color: #666;
    }
  </style>
</head>

<body>

  <button class="tema" onclick="cambiarTema()" id="botonTema">
    ☀️ Día
  </button>

  <header>
    <h1>🎮 MI WEB</h1>
    <p>Pequeños juegos y experimentos.</p>
  </header>

  <main class="juegos">

    <a class="juego" href="juegos/numero-aleatorio/">
      <div class="icono">🎲</div>
      <h2>Número aleatorio</h2>
      <p>Escribe dos números y descubre cuál sale.</p>
    </a>

  </main>

  <script>
    function cambiarTema() {
      document.body.classList.toggle("dia");

      const boton = document.getElementById("botonTema");

      if (document.body.classList.contains("dia")) {
        boton.textContent = "🌙 Noche";
      } else {
        boton.textContent = "☀️ Día";
      }
    }
  </script>

</body>
</html>
