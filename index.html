<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MI WEB</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            transition: 0.3s;
        }

        body.claro {
            background: #f2f2f2;
            color: #111;
        }

        .barra {
            position: sticky;
            top: 0;
            z-index: 1000;
            height: 70px;
            display: flex;
            align-items: center;
            padding: 0 25px;
            background: #181818;
            border-bottom: 1px solid #333;
        }

        body.claro .barra {
            background: white;
            border-bottom: 1px solid #ddd;
        }

        .navegacion {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .logo {
            font-size: 21px;
            font-weight: bold;
        }

        .nav-link {
            color: #aaa;
            text-decoration: none;
            font-size: 16px;
            cursor: pointer;
        }

        .nav-link:hover {
            color: white;
        }

        body.claro .nav-link {
            color: #555;
        }

        body.claro .nav-link:hover {
            color: #111;
        }

        .controles {
            margin-left: auto;
            display: flex;
            gap: 10px;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 10px 14px;
            cursor: pointer;
            background: #292929;
            color: white;
            font-size: 14px;
        }

        button:hover {
            transform: scale(1.03);
        }

        body.claro button {
            background: #e5e5e5;
            color: #111;
        }

        .idioma {
            position: relative;
        }

        .menu-idioma {
            display: none;
            position: absolute;
            right: 0;
            top: 48px;
            background: #222;
            border-radius: 10px;
            padding: 6px;
            min-width: 150px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        body.claro .menu-idioma {
            background: white;
        }

        .menu-idioma button {
            width: 100%;
            text-align: left;
            background: transparent;
        }

        .menu-idioma button:hover {
            background: #333;
        }

        body.claro .menu-idioma button:hover {
            background: #eee;
        }

        header {
            text-align: center;
            padding: 70px 20px 40px;
        }

        header h1 {
            font-size: 50px;
            margin-bottom: 10px;
        }

        header p {
            color: #aaa;
            font-size: 18px;
        }

        body.claro header p {
            color: #555;
        }

        #juegos {
            max-width: 1000px;
            margin: auto;
            padding: 20px;
        }

        .tarjetas {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .tarjeta {
            background: #1c1c1c;
            border-radius: 18px;
            padding: 25px;
            text-decoration: none;
            color: white;
            transition: 0.2s;
            border: 1px solid #2d2d2d;
        }

        .tarjeta:hover {
            transform: translateY(-5px);
        }

        body.claro .tarjeta {
            background: white;
            color: #111;
            border: 1px solid #ddd;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .tarjeta h2 {
            margin-top: 0;
        }

        .tarjeta p {
            color: #aaa;
        }

        body.claro .tarjeta p {
            color: #555;
        }
    </style>
</head>

<body>

    <nav class="barra">

        <div class="navegacion">
            <div class="logo" id="logo">🎮 MI WEB</div>

            <a href="#" class="nav-link" id="inicio">🏠 Inicio</a>

            <a href="#juegos" class="nav-link" id="juegosLink">🎮 Juegos</a>
        </div>

        <div class="controles">

            <div class="idioma">

                <button id="botonIdioma" onclick="abrirIdioma()">
                    🇪🇸 ES ▾
                </button>

                <div class="menu-idioma" id="menuIdioma">

                    <button onclick="cambiarIdioma('es')">
                        🇪🇸 Español
                    </button>

                    <button onclick="cambiarIdioma('en')">
                        🇬🇧 English
                    </button>

                    <button onclick="cambiarIdioma('hy')">
                        🇦🇲 Հայերեն
                    </button>

                </div>

            </div>

            <button id="botonTema" onclick="cambiarTema()">
                ☀️ Claro
            </button>

        </div>

    </nav>


    <header>

        <h1 id="titulo">🎮 MI WEB</h1>

        <p id="descripcion">
            Pequeños juegos y experimentos.
        </p>

    </header>


    <main id="juegos">

        <div class="tarjetas">

            <a class="tarjeta" href="juegos/numero-aleatorio/">

                <h2 id="juego1Titulo">
                    🎲 Número aleatorio
                </h2>

                <p id="juego1Descripcion">
                    Genera un número aleatorio entre dos números.
                </p>

            </a>


            <a class="tarjeta" href="juegos/adivina-el-numero/">

                <h2 id="juego2Titulo">
                    🔢 Adivina el número
                </h2>

                <p id="juego2Descripcion">
                    Intenta adivinar el número secreto.
                </p>

            </a>

        </div>

    </main>


    <script>

        function aplicarIdioma() {

            const idioma = localStorage.getItem("idioma") || "es";

            document.documentElement.lang = idioma;

            if (idioma === "en") {

                document.getElementById("logo").textContent = "🎮 MY WEBSITE";
                document.getElementById("inicio").textContent = "🏠 Home";
                document.getElementById("juegosLink").textContent = "🎮 Games";

                document.getElementById("titulo").textContent = "🎮 MY WEBSITE";
                document.getElementById("descripcion").textContent =
                    "Small games and experiments.";

                document.getElementById("juego1Titulo").textContent =
                    "🎲 Random number";

                document.getElementById("juego1Descripcion").textContent =
                    "Generate a random number between two numbers.";

                document.getElementById("juego2Titulo").textContent =
                    "🔢 Guess the number";

                document.getElementById("juego2Descripcion").textContent =
                    "Try to guess the secret number.";

                document.getElementById("botonIdioma").textContent =
                    "🇬🇧 EN ▾";

                document.title = "MY WEBSITE";

            } else if (idioma === "hy") {

                document.getElementById("logo").textContent = "🎮 ԻՄ ԿԱՅՔԸ";
                document.getElementById("inicio").textContent = "🏠 Գլխավոր";
                document.getElementById("juegosLink").textContent = "🎮 Խաղեր";

                document.getElementById("titulo").textContent =
                    "🎮 ԻՄ ԿԱՅՔԸ";

                document.getElementById("descripcion").textContent =
                    "Փոքր խաղեր և փորձեր։";

                document.getElementById("juego1Titulo").textContent =
                    "🎲 Պատահական թիվ";

                document.getElementById("juego1Descripcion").textContent =
                    "Ստեղծիր պատահական թիվ երկու թվերի միջև։";

                document.getElementById("juego2Titulo").textContent =
                    "🔢 Գուշակիր թիվը";

                document.getElementById("juego2Descripcion").textContent =
                    "Փորձիր գուշակել գաղտնի թիվը։";

                document.getElementById("botonIdioma").textContent =
                    "🇦🇲 HY ▾";

                document.title = "ԻՄ ԿԱՅՔԸ";

            } else {

                document.getElementById("logo").textContent = "🎮 MI WEB";
                document.getElementById("inicio").textContent = "🏠 Inicio";
                document.getElementById("juegosLink").textContent = "🎮 Juegos";

                document.getElementById("titulo").textContent = "🎮 MI WEB";

                document.getElementById("descripcion").textContent =
                    "Pequeños juegos y experimentos.";

                document.getElementById("juego1Titulo").textContent =
                    "🎲 Número aleatorio";

                document.getElementById("juego1Descripcion").textContent =
                    "Genera un número aleatorio entre dos números.";

                document.getElementById("juego2Titulo").textContent =
                    "🔢 Adivina el número";

                document.getElementById("juego2Descripcion").textContent =
                    "Intenta adivinar el número secreto.";

                document.getElementById("botonIdioma").textContent =
                    "🇪🇸 ES ▾";

                document.title = "MI WEB";
            }

            actualizarTextoTema();
        }


        function cambiarIdioma(idioma) {

            localStorage.setItem("idioma", idioma);

            document.getElementById("menuIdioma").style.display = "none";

            aplicarIdioma();
        }


        function abrirIdioma() {

            const menu = document.getElementById("menuIdioma");

            menu.style.display =
                menu.style.display === "block" ? "none" : "block";
        }


        document.addEventListener("click", function(event) {

            const idioma = document.querySelector(".idioma");

            if (!idioma.contains(event.target)) {

                document.getElementById("menuIdioma").style.display = "none";

            }

        });


        function aplicarTema() {

            const tema = localStorage.getItem("tema") || "oscuro";

            if (tema === "claro") {

                document.body.classList.add("claro");

            } else {

                document.body.classList.remove("claro");

            }

            actualizarTextoTema();
        }


        function cambiarTema() {

            const temaActual =
                localStorage.getItem("tema") || "oscuro";

            const nuevoTema =
                temaActual === "oscuro" ? "claro" : "oscuro";

            localStorage.setItem("tema", nuevoTema);

            aplicarTema();
        }


        function actualizarTextoTema() {

            const tema =
                localStorage.getItem("tema") || "oscuro";

            const idioma =
                localStorage.getItem("idioma") || "es";

            const boton = document.getElementById("botonTema");

            if (idioma === "en") {

                boton.textContent =
                    tema === "oscuro" ? "☀️ Light" : "🌙 Dark";

            } else if (idioma === "hy") {

                boton.textContent =
                    tema === "oscuro" ? "☀️ Բաց" : "🌙 Մութ";

            } else {

                boton.textContent =
                    tema === "oscuro" ? "☀️ Claro" : "🌙 Oscuro";

            }
        }


        aplicarIdioma();
        aplicarTema();

    </script>

</body>
</html>
