<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MI WEB</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            transition: 0.3s;
        }

        /* =========================
           BARRA SUPERIOR
        ========================= */

        .barra {
            height: 65px;
            background: #181818;
            display: flex;
            align-items: center;
            padding: 0 25px;
            border-bottom: 1px solid #333;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            margin-right: 30px;
        }

        .navegacion {
            display: flex;
            gap: 10px;
        }

        .navegacion a {
            color: white;
            text-decoration: none;
            padding: 10px 14px;
            border-radius: 8px;
            transition: 0.2s;
        }

        .navegacion a:hover {
            background: #292929;
        }

        .controles {
            margin-left: auto;
            display: flex;
            gap: 10px;
        }

        .boton-control {
            background: #292929;
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        .boton-control:hover {
            background: #383838;
        }

        /* =========================
           IDIOMA
        ========================= */

        .idioma {
            position: relative;
        }

        .menu-idioma {
            display: none;
            position: absolute;
            right: 0;
            top: 45px;
            background: #222;
            border: 1px solid #444;
            border-radius: 10px;
            padding: 6px;
            z-index: 100;
            min-width: 150px;
        }

        .menu-idioma button {
            display: block;
            width: 100%;
            background: none;
            border: none;
            color: white;
            padding: 10px;
            text-align: left;
            border-radius: 7px;
            cursor: pointer;
            font-size: 14px;
        }

        .menu-idioma button:hover {
            background: #333;
        }

        /* =========================
           CONTENIDO
        ========================= */

        main {
            max-width: 1000px;
            margin: 0 auto;
            padding: 50px 20px;
        }

        .cabecera {
            text-align: center;
            margin-bottom: 35px;
        }

        .cabecera h1 {
            font-size: 45px;
            margin-bottom: 10px;
        }

        .cabecera p {
            color: #aaa;
            font-size: 18px;
        }

        /* =========================
           USUARIO
        ========================= */

        .registro-usuario {
            max-width: 700px;
            margin: 0 auto 35px;
            padding: 20px 25px;
            text-align: center;
            background: #1b1b1b;
            border: 1px solid #333;
            border-radius: 15px;
        }

        .usuario-principal {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        #nombreGuardado {
            font-size: 21px;
            font-weight: bold;
            margin: 0;
        }

        .boton-nombre {
            background: #333;
            color: white;
            border: none;
            padding: 9px 14px;
            border-radius: 8px;
            cursor: pointer;
        }

        .boton-nombre:hover {
            background: #444;
        }

        .formulario-usuario {
            display: none;
            justify-content: center;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .formulario-usuario input {
            width: 250px;
            padding: 12px;
            border: 1px solid #444;
            border-radius: 8px;
            background: #111;
            color: white;
            font-size: 16px;
            outline: none;
        }

        .formulario-usuario button {
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #333;
            color: white;
            font-size: 15px;
        }

        .formulario-usuario button:hover {
            background: #444;
        }

        /* =========================
           JUEGOS
        ========================= */

        #juegos {
            scroll-margin-top: 80px;
        }

        .titulo-juegos {
            text-align: center;
            font-size: 30px;
            margin-bottom: 25px;
        }

        .juegos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .tarjeta {
            background: #1b1b1b;
            border: 1px solid #333;
            border-radius: 15px;
            padding: 25px;
            transition: 0.2s;
        }

        .tarjeta:hover {
            transform: translateY(-3px);
            border-color: #555;
        }

        .tarjeta h2 {
            margin-top: 0;
        }

        .tarjeta p {
            color: #aaa;
            line-height: 1.5;
        }

        .tarjeta a {
            display: inline-block;
            margin-top: 10px;
            background: #333;
            color: white;
            text-decoration: none;
            padding: 11px 16px;
            border-radius: 8px;
            transition: 0.2s;
        }

        .tarjeta a:hover {
            background: #444;
        }

        /* =========================
           MODO CLARO
        ========================= */

        body.claro {
            background: #f5f5f5;
            color: #111;
        }

        body.claro .barra {
            background: white;
            border-bottom: 1px solid #ddd;
        }

        body.claro .logo {
            color: #111;
        }

        body.claro .navegacion a {
            color: #111;
        }

        body.claro .navegacion a:hover {
            background: #eee;
        }

        body.claro .boton-control {
            background: #eee;
            color: #111;
        }

        body.claro .boton-control:hover {
            background: #ddd;
        }

        body.claro .menu-idioma {
            background: white;
            border-color: #ddd;
        }

        body.claro .menu-idioma button {
            color: #111;
        }

        body.claro .menu-idioma button:hover {
            background: #eee;
        }

        body.claro .cabecera p {
            color: #555;
        }

        body.claro .registro-usuario {
            background: white;
            border-color: #ddd;
        }

        body.claro .boton-nombre {
            background: #eee;
            color: #111;
        }

        body.claro .boton-nombre:hover {
            background: #ddd;
        }

        body.claro .formulario-usuario input {
            background: #f5f5f5;
            color: #111;
            border-color: #ccc;
        }

        body.claro .formulario-usuario button {
            background: #eee;
            color: #111;
        }

        body.claro .formulario-usuario button:hover {
            background: #ddd;
        }

        body.claro .tarjeta {
            background: white;
            border-color: #ddd;
        }

        body.claro .tarjeta p {
            color: #555;
        }

        body.claro .tarjeta a {
            background: #eee;
            color: #111;
        }

        body.claro .tarjeta a:hover {
            background: #ddd;
        }

        /* =========================
           MÓVIL
        ========================= */

        @media (max-width: 650px) {

            .barra {
                padding: 0 12px;
            }

            .logo {
                margin-right: 10px;
                font-size: 18px;
            }

            .navegacion a {
                padding: 8px;
            }

            .boton-control {
                padding: 8px;
            }

            .cabecera h1 {
                font-size: 35px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         BARRA SUPERIOR
    ========================= -->

    <header class="barra">

        <div class="logo" id="logo">
            🎮 MI WEB
        </div>

        <nav class="navegacion">

            <a href="index.html" id="inicio">
                🏠 Inicio
            </a>

            <a href="#juegos" id="juegosLink">
                🎮 Juegos
            </a>

        </nav>

        <div class="controles">

            <!-- IDIOMA -->

            <div class="idioma">

                <button
                    class="boton-control"
                    onclick="abrirIdioma()"
                    id="botonIdioma"
                >
                    🇪🇸 ES ▾
                </button>

                <div
                    class="menu-idioma"
                    id="menuIdioma"
                >

                    <button onclick="cambiarIdioma('es')">
                        🇪🇸 Español
                    </button>

                    <button onclick="cambiarIdioma('en')">
                        🇬🇧 English
                    </button>

                    <button onclick="cambiarIdioma('hy')">
                        🇦🇲 Հայերեն
                    </button>

                </div>

            </div>

            <!-- TEMA -->

            <button
                class="boton-control"
                id="botonTema"
                onclick="cambiarTema()"
            >
                ☀️ Claro
            </button>

        </div>

    </header>


    <!-- =========================
         CONTENIDO
    ========================= -->

    <main>

        <section class="cabecera">

            <h1 id="titulo">
                🎮 MI WEB
            </h1>

            <p id="descripcion">
                Pequeños juegos y experimentos.
            </p>

        </section>


        <!-- =========================
             USUARIO
        ========================= -->

        <section class="registro-usuario">

            <div class="usuario-principal">

                <p id="nombreGuardado">
                    👤 user_0001
                </p>

                <button
                    class="boton-nombre"
                    id="botonCambiarNombre"
                    onclick="mostrarFormularioNombre()"
                >
                    ✏️ Cambiar nombre
                </button>

            </div>


            <div
                class="formulario-usuario"
                id="formularioUsuario"
            >

                <input
                    type="text"
                    id="nombreUsuario"
                    maxlength="20"
                    placeholder="Escribe tu nombre"
                    autocomplete="off"
                >

                <button
                    onclick="guardarNombre()"
                    id="botonGuardarNombre"
                >
                    Guardar
                </button>

                <button
                    onclick="cancelarCambioNombre()"
                    id="botonCancelarNombre"
                >
                    Cancelar
                </button>

            </div>

        </section>


        <!-- =========================
             JUEGOS
        ========================= -->

        <section id="juegos">

            <h2
                class="titulo-juegos"
                id="tituloJuegos"
            >
                🎮 Juegos
            </h2>


            <div class="juegos">

                <!-- NÚMERO ALEATORIO -->

                <div class="tarjeta">

                    <h2 id="tituloAleatorio">
                        🎲 Número aleatorio
                    </h2>

                    <p id="descripcionAleatorio">
                        Genera un número aleatorio entre dos números.
                    </p>

                    <a
                        href="juegos/numero-aleatorio/index.html"
                        id="botonAleatorio"
                    >
                        🎲 Jugar
                    </a>

                </div>


                <!-- ADIVINA EL NÚMERO -->

                <div class="tarjeta">

                    <h2 id="tituloAdivina">
                        🔢 Adivina el número
                    </h2>

                    <p id="descripcionAdivina">
                        Intenta adivinar el número secreto entre 1 y 100.
                    </p>

                    <a
                        href="juegos/adivina-el-numero/index.html"
                        id="botonAdivina"
                    >
                        🎯 Jugar
                    </a>

                </div>

            </div>

        </section>

    </main>


    <script>

        /* =========================
           IDIOMAS
        ========================= */

        function aplicarIdioma() {

            const idioma =
                localStorage.getItem("idioma") || "es";


            if (idioma === "en") {

                document.documentElement.lang = "en";

                document.title = "MY WEBSITE";

                document.getElementById("logo").textContent =
                    "🎮 MY WEBSITE";

                document.getElementById("inicio").textContent =
                    "🏠 Home";

                document.getElementById("juegosLink").textContent =
                    "🎮 Games";

                document.getElementById("titulo").textContent =
                    "🎮 MY WEBSITE";

                document.getElementById("descripcion").textContent =
                    "Small games and experiments.";

                document.getElementById("tituloJuegos").textContent =
                    "🎮 Games";

                document.getElementById("tituloAleatorio").textContent =
                    "🎲 Random number";

                document.getElementById("descripcionAleatorio").textContent =
                    "Generate a random number between two numbers.";

                document.getElementById("botonAleatorio").textContent =
                    "🎲 Play";

                document.getElementById("tituloAdivina").textContent =
                    "🔢 Guess the number";

                document.getElementById("descripcionAdivina").textContent =
                    "Try to guess the secret number between 1 and 100.";

                document.getElementById("botonAdivina").textContent =
                    "🎯 Play";

                document.getElementById("botonIdioma").textContent =
                    "🇬🇧 EN ▾";

                document.getElementById("botonCambiarNombre").textContent =
                    "✏️ Change name";

                document.getElementById("nombreUsuario").placeholder =
                    "Enter your name";

                document.getElementById("botonGuardarNombre").textContent =
                    "Save";

                document.getElementById("botonCancelarNombre").textContent =
                    "Cancel";

            }

            else if (idioma === "hy") {

                document.documentElement.lang = "hy";

                document.title = "ԻՄ ԿԱՅՔԸ";

                document.getElementById("logo").textContent =
                    "🎮 ԻՄ ԿԱՅՔԸ";

                document.getElementById("inicio").textContent =
                    "🏠 Գլխավոր";

                document.getElementById("juegosLink").textContent =
                    "🎮 Խաղեր";

                document.getElementById("titulo").textContent =
                    "🎮 ԻՄ ԿԱՅՔԸ";

                document.getElementById("descripcion").textContent =
                    "Փոքր խաղեր և փորձեր։";

                document.getElementById("tituloJuegos").textContent =
                    "🎮 Խաղեր";

                document.getElementById("tituloAleatorio").textContent =
                    "🎲 Պատահական թիվ";

                document.getElementById("descripcionAleatorio").textContent =
                    "Ստեղծիր պատահական թիվ երկու թվերի միջև։";

                document.getElementById("botonAleatorio").textContent =
                    "🎲 Խաղալ";

                document.getElementById("tituloAdivina").textContent =
                    "🔢 Գուշակիր թիվը";

                document.getElementById("descripcionAdivina").textContent =
                    "Փորձիր գուշակել 1-ից 100-ի միջև գաղտնի թիվը։";

                document.getElementById("botonAdivina").textContent =
                    "🎯 Խաղալ";

                document.getElementById("botonIdioma").textContent =
                    "🇦🇲 HY ▾";

                document.getElementById("botonCambiarNombre").textContent =
                    "✏️ Փոխել անունը";

                document.getElementById("nombreUsuario").placeholder =
                    "Գրիր քո անունը";

                document.getElementById("botonGuardarNombre").textContent =
                    "Պահպանել";

                document.getElementById("botonCancelarNombre").textContent =
                    "Չեղարկել";

            }

            else {

                document.documentElement.lang = "es";

                document.title = "MI WEB";

                document.getElementById("logo").textContent =
                    "🎮 MI WEB";

                document.getElementById("inicio").textContent =
                    "🏠 Inicio";

                document.getElementById("juegosLink").textContent =
                    "🎮 Juegos";

                document.getElementById("titulo").textContent =
                    "🎮 MI WEB";

                document.getElementById("descripcion").textContent =
                    "Pequeños juegos y experimentos.";

                document.getElementById("tituloJuegos").textContent =
                    "🎮 Juegos";

                document.getElementById("tituloAleatorio").textContent =
                    "🎲 Número aleatorio";

                document.getElementById("descripcionAleatorio").textContent =
                    "Genera un número aleatorio entre dos números.";

                document.getElementById("botonAleatorio").textContent =
                    "🎲 Jugar";

                document.getElementById("tituloAdivina").textContent =
                    "🔢 Adivina el número";

                document.getElementById("descripcionAdivina").textContent =
                    "Intenta adivinar el número secreto entre 1 y 100.";

                document.getElementById("botonAdivina").textContent =
                    "🎯 Jugar";

                document.getElementById("botonIdioma").textContent =
                    "🇪🇸 ES ▾";

                document.getElementById("botonCambiarNombre").textContent =
                    "✏️ Cambiar nombre";

                document.getElementById("nombreUsuario").placeholder =
                    "Escribe tu nombre";

                document.getElementById("botonGuardarNombre").textContent =
                    "Guardar";

                document.getElementById("botonCancelarNombre").textContent =
                    "Cancelar";
            }


            actualizarTextoTema();
        }


        function cambiarIdioma(idioma) {

            localStorage.setItem("idioma", idioma);

            aplicarIdioma();

            document.getElementById("menuIdioma").style.display =
                "none";
        }


        function abrirIdioma() {

            const menu =
                document.getElementById("menuIdioma");

            if (menu.style.display === "block") {
                menu.style.display = "none";
            } else {
                menu.style.display = "block";
            }
        }


        document.addEventListener("click", function(event) {

            const idioma =
                document.querySelector(".idioma");

            const menu =
                document.getElementById("menuIdioma");

            if (!idioma.contains(event.target)) {
                menu.style.display = "none";
            }

        });


        /* =========================
           TEMA
        ========================= */

        function aplicarTema() {

            const tema =
                localStorage.getItem("tema") || "oscuro";

            if (tema === "claro") {

                document.body.classList.add("claro");

            } else {

                document.body.classList.remove("claro");

            }

            actualizarTextoTema();
        }


        function cambiarTema() {

            const temaActual =
                localStorage.getItem("tema") || "oscuro";

            const nuevoTema =
                temaActual === "oscuro"
                ? "claro"
                : "oscuro";

            localStorage.setItem("tema", nuevoTema);

            aplicarTema();
        }


        function actualizarTextoTema() {

            const tema =
                localStorage.getItem("tema") || "oscuro";

            const idioma =
                localStorage.getItem("idioma") || "es";

            const boton =
                document.getElementById("botonTema");


            if (idioma === "en") {

                boton.textContent =
                    tema === "oscuro"
                    ? "☀️ Light"
                    : "🌙 Dark";

            }

            else if (idioma === "hy") {

                boton.textContent =
                    tema === "oscuro"
                    ? "☀️ Բաց"
                    : "🌙 Մութ";

            }

            else {

                boton.textContent =
                    tema === "oscuro"
                    ? "☀️ Claro"
                    : "🌙 Oscuro";

            }
        }


        /* =========================
           USUARIO
        ========================= */

        function obtenerNumeroUsuario() {

            let numero =
                localStorage.getItem("numeroUsuario");


            if (!numero) {

                numero =
                    Math.floor(
                        Math.random() * 10000
                    );

                numero =
                    String(numero).padStart(4, "0");

                localStorage.setItem(
                    "numeroUsuario",
                    numero
                );
            }


            return numero;
        }


        function obtenerNombreUsuario() {

            let nombre =
                localStorage.getItem("nombreUsuario");


            if (!nombre) {

                nombre =
                    "user_" + obtenerNumeroUsuario();

                localStorage.setItem(
                    "nombreUsuario",
                    nombre
                );
            }


            return nombre;
        }


        function mostrarNombreUsuario() {

            const nombre =
                obtenerNombreUsuario();

            document.getElementById(
                "nombreGuardado"
            ).textContent =
                "👤 " + nombre;
        }


        function mostrarFormularioNombre() {

            const formulario =
                document.getElementById(
                    "formularioUsuario"
                );

            const input =
                document.getElementById(
                    "nombreUsuario"
                );


            formulario.style.display = "flex";

            input.value =
                obtenerNombreUsuario();

            input.focus();
            input.select();
        }


        function guardarNombre() {

            const input =
                document.getElementById(
                    "nombreUsuario"
                );

            const nombre =
                input.value.trim();


            if (nombre === "") {

                input.focus();

                return;
            }


            localStorage.setItem(
                "nombreUsuario",
                nombre
            );


            mostrarNombreUsuario();

            document.getElementById(
                "formularioUsuario"
            ).style.display = "none";
        }


        function cancelarCambioNombre() {

            document.getElementById(
                "formularioUsuario"
            ).style.display = "none";
        }


        /* =========================
           INICIAR
        ========================= */

        aplicarIdioma();

        aplicarTema();

        mostrarNombreUsuario();

    </script>

</body>
</html>
