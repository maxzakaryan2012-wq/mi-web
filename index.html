<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MI WEB</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }

    header {
      text-align: center;
      padding: 70px 20px 40px;
    }

    h1 {
      font-size: 60px;
      margin: 0;
    }

    header p {
      font-size: 22px;
      color: #bbb;
    }

    .juegos {
      max-width: 1000px;
      margin: auto;
      padding: 30px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .juego {
      background: #1d1d1d;
      border-radius: 18px;
      padding: 30px;
      text-decoration: none;
      color: white;
      transition: 0.2s;
      border: 1px solid #333;
    }

    .juego:hover {
      transform: translateY(-6px);
      background: #252525;
    }

    .icono {
      font-size: 50px;
    }

    .juego h2 {
      margin-bottom: 10px;
    }

    .juego p {
      color: #aaa;
    }
  </style>
</head>

<body>

  <header>
    <h1>🎮 MI WEB</h1>
    <p>Pequeños juegos y experimentos.</p>
  </header>

  <main class="juegos">

    <a class="juego" href="juegos/numero-aleatorio/">
      <div class="icono">🎲</div>
      <h2>Número aleatorio</h2>
      <p>Escribe dos números y descubre cuál sale.</p>
    </a>

  </main>

</body>
</html>
